// El Big Bang: un punto que estalla en rayos, chispas y fluorescente
function bigBang(cx, cy, semilla){
  const s = semilla * 31 + 1, r = aleatorio(s);
  // Resplandor de fluorescente en forma de estrella
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = "rgba(255, 212, 0, .85)";
  ctx.beginPath();
  for (let k = 0; k < 16; k++){
    const ang = k / 16 * Math.PI * 2, rr = k % 2 ? 9 : 22 + r() * 6;
    const px = cx + Math.cos(ang) * rr, py = cy + Math.sin(ang) * rr;
    k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255, 140, 40, .6)"; ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // Contorno de la estrella a mano
  ctx.strokeStyle = TINTA; ctx.lineWidth = 2; ctx.lineJoin = "round";
  ctx.beginPath();
  const rr2 = aleatorio(s);
  for (let k = 0; k < 16; k++){
    const ang = k / 16 * Math.PI * 2, rr = k % 2 ? 9 : 22 + rr2() * 6;
    const px = cx + Math.cos(ang) * rr, py = cy + Math.sin(ang) * rr;
    k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.stroke();
  // Rayos que salen disparados
  for (let k = 0; k < 8; k++){
    const ang = k / 8 * Math.PI * 2 + .2, r1 = 30, r2 = 38 + r() * 6;
    raya(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1, cx + Math.cos(ang) * r2, cy + Math.sin(ang) * r2, s + k, 1.6);
  }
  // Chispas (puntitos y crucecitas)
  ctx.fillStyle = TINTA;
  for (let k = 0; k < 6; k++){
    const ang = r() * Math.PI * 2, d = 26 + r() * 18;
    ctx.beginPath(); ctx.arc(cx + Math.cos(ang) * d, cy + Math.sin(ang) * d, 1.6, 0, Math.PI * 2); ctx.fill();
  }
}

// La Tierra recién nacida: bola de lava con grietas, meteoritos y la Luna formándose
function tierraNace(cx, cy, semilla){
  const s = semilla * 29 + 4, R0 = 21;
  ctx.save(); ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "rgba(240, 90, 40, .7)"; ctx.beginPath(); ctx.arc(cx, cy, R0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255, 190, 40, .7)";                    // manchas de lava más clara
  for (const [dx, dy, rr] of [[-7, -5, 6], [6, 6, 5], [8, -9, 3.5], [-6, 9, 3]]){
    ctx.beginPath(); ctx.arc(cx + dx, cy + dy, rr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  circuloMano(cx, cy, R0, s, 2.2);
  // Grietas de la corteza
  raya(cx - 14, cy - 2, cx - 3, cy + 2, s + 1, 1.3);
  raya(cx - 3, cy + 2, cx + 4, cy - 6, s + 2, 1.3);
  raya(cx + 2, cy + 12, cx + 12, cy + 4, s + 3, 1.3);
  // Meteoritos llegando (arriba a la izquierda), con estela
  for (const [mx, my, k] of [[-34, -26, 0], [-24, -36, 1]]){
    ctx.save(); ctx.globalAlpha *= .6; raya(cx + mx - 14, cy + my - 10, cx + mx, cy + my, s + 5 + k, 1.4); ctx.restore();
    ctx.fillStyle = TINTA; ctx.beginPath(); ctx.arc(cx + mx + 1, cy + my + 1, 2.4, 0, Math.PI * 2); ctx.fill();
  }
  // La Luna pequeñita
  const lx = cx + R0 + 11, ly = cy - 12;
  ctx.fillStyle = "#e9e6dd"; ctx.beginPath(); ctx.arc(lx, ly, 6, 0, Math.PI * 2); ctx.fill();
  circuloMano(lx, ly, 6, s + 7, 1.5);
}

// La Tierra ya con océanos: azul, con alguna isla volcánica y nubes
function tierraAzul(cx, cy, semilla, sinLuna){
  const s = semilla * 37 + 2, R0 = 21;
  ctx.save(); ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "rgba(50, 120, 210, .75)"; ctx.beginPath(); ctx.arc(cx, cy, R0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(140, 110, 70, .8)";                    // islas volcánicas
  for (const [dx, dy, rx, ry] of [[-8, -4, 4, 2.5], [6, 7, 3, 2], [9, -8, 2.5, 1.8]]){
    ctx.beginPath(); ctx.ellipse(cx + dx, cy + dy, rx, ry, .3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.save(); ctx.fillStyle = "rgba(255, 255, 255, .85)";       // nubes
  for (const [dx, dy, rx] of [[-4, 10, 6], [4, -13, 5], [-13, 3, 3.5]]){
    ctx.beginPath(); ctx.ellipse(cx + dx, cy + dy, rx, 1.8, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  circuloMano(cx, cy, R0, s, 2.2);
  if (sinLuna) return;
  const lx = cx + R0 + 11, ly = cy - 12;                         // la Luna
  ctx.fillStyle = "#e9e6dd"; ctx.beginPath(); ctx.arc(lx, ly, 6, 0, Math.PI * 2); ctx.fill();
  circuloMano(lx, ly, 6, s + 7, 1.5);
}

// Organismo unicelular: una bacteria en forma de cápsula, con su contenido y un flagelo
function celula(cx, cy){
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-.25);
  const forma = () => { ctx.beginPath(); ctx.moveTo(-14, -9); ctx.lineTo(10, -9); ctx.arc(10, 0, 9, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(-14, 9); ctx.arc(-14, 0, 9, Math.PI / 2, Math.PI * 1.5); ctx.closePath(); };
  forma();
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = "rgba(120, 190, 120, .6)"; ctx.fill(); ctx.restore();
  ctx.strokeStyle = TINTA; ctx.lineWidth = 2.2; ctx.lineJoin = "round"; ctx.stroke();
  ctx.lineWidth = 1.3;                                                         // ADN enrollado
  ctx.beginPath(); ctx.moveTo(-8, 0); ctx.bezierCurveTo(-4, -6, 0, 6, 4, 0); ctx.bezierCurveTo(6, -3, 8, 3, 9, 0); ctx.stroke();
  ctx.fillStyle = TINTA; for (const [x, y] of [[-13, -4], [-11, 4], [12, -4], [13, 4], [-2, 5]]){ ctx.beginPath(); ctx.arc(x, y, 1.1, 0, Math.PI * 2); ctx.fill(); }
  ctx.beginPath(); ctx.moveTo(19, 0); ctx.bezierCurveTo(24, -6, 27, 6, 32, 0); ctx.lineWidth = 1.6; ctx.stroke();   // flagelo
  ctx.restore();
}
// Pangea: un solo continente en forma de C rodeado por el océano
function tierraPangea(cx, cy, semilla){
  const s = semilla * 41 + 3, R0 = 21;
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R0, 0, Math.PI * 2); ctx.clip();
  ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "rgba(50, 120, 210, .75)"; ctx.fillRect(cx - R0, cy - R0, 2 * R0, 2 * R0);
  ctx.fillStyle = "rgba(150, 140, 70, .9)";
  ctx.beginPath();
  ctx.moveTo(cx - 3, cy - 18); ctx.quadraticCurveTo(cx - 16, cy - 14, cx - 14, cy - 2);
  ctx.quadraticCurveTo(cx - 15, cy + 12, cx - 4, cy + 19); ctx.quadraticCurveTo(cx + 6, cy + 18, cx + 7, cy + 10);
  ctx.quadraticCurveTo(cx - 3, cy + 6, cx - 4, cy - 1); ctx.quadraticCurveTo(cx - 2, cy - 8, cx + 10, cy - 7);
  ctx.quadraticCurveTo(cx + 13, cy - 15, cx - 3, cy - 18); ctx.fill();
  ctx.restore();
  circuloMano(cx, cy, R0, s, 2.2);
}
// La Tierra de hoy: las Américas a la izquierda y Europa y África a la derecha, con el Atlántico en medio
function tierraHoy(cx, cy, semilla){
  const s = semilla * 43 + 5, R0 = 21;
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R0, 0, Math.PI * 2); ctx.clip();
  ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "rgba(50, 120, 210, .75)"; ctx.fillRect(cx - R0, cy - R0, 2 * R0, 2 * R0);
  ctx.fillStyle = "rgba(110, 160, 70, .9)";
  const mancha = pts => { ctx.beginPath(); pts.forEach(([x, y], k) => k ? ctx.lineTo(cx + x, cy + y) : ctx.moveTo(cx + x, cy + y)); ctx.closePath(); ctx.fill(); };
  mancha([[-19, -12], [-9, -16], [-6, -10], [-10, -4], [-13, -1], [-17, -4]]);           // Norteamérica
  mancha([[-11, 1], [-5, 3], [-4, 9], [-8, 17], [-11, 12], [-12, 5]]);                   // Sudamérica
  mancha([[4, -15], [12, -16], [13, -11], [7, -8], [4, -10]]);                           // Europa
  mancha([[3, -6], [12, -6], [15, 0], [11, 8], [8, 14], [6, 7], [3, 1]]);               // África
  ctx.fillStyle = "rgba(255, 255, 255, .85)";                                            // la Antártida y una nube
  ctx.beginPath(); ctx.ellipse(cx, cy + R0 - 1, 12, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  circuloMano(cx, cy, R0, s, 2.2);
}
// Las tres Tierras (azul, Pangea y la de hoy) a la altura de «Nace la Tierra», con su nombre debajo.
// Al pulsarlas se abre la ficha de su franja (océanos, Pangea, los continentes se separan).
let tierrasDibujadas = [];
function dibujarTierras(yL){
  const yc = yFila("hitos", yL) + 10, span = W / ppa;
  const fr = t => EVENTOS.find(e => e.t === t);
  const tierras = [
    // ver: a partir de qué paso de rueda aparece (ver «APARICIÓN POR PASOS DE RUEDA»)
    { año: -4.4e9,  nombre: "La Tierra azul", pintar: tierraAzul,   e: fr("Primeros océanos"), ver: verPaso(5) },
    { año: -3.5e9,  nombre: "Organismo unicelular", pintar: celula, e: fr("Vida unicelular"), ver: verPaso(6) },
    { año: -2.55e8, nombre: "Pangea",         pintar: tierraPangea, e: fr("Pangea"), ver: verPaso(15) },
  ];
  // Vecinos de la misma altura con los que no debe chocar (dibujos y textos)
  const ocupado = [];
  const xTierra = xDe(-4.54e9); ocupado.push([xTierra - 30, xTierra + 45]);           // Nace la Tierra (texto a la izquierda)
  // Dibujos de los animales de la misma altura (solo el dibujo: su texto se quita si choca con una Tierra)
  for (const t of ["Primeros reptiles", "Primeros mamíferos"]){
    const e = fr(t); if (e && span < e.verDesde){ const xa = xDe(e.año); ocupado.push([xa - 22, xa + 22]); }
  }
  if (span < 6e8){ const d = fr("Dinosaurios"), x1 = xDe(d.añoDesde), x2 = xDe(d.añoHasta);
    if (x2 - x1 > 90) ocupado.push([x2 - x1 > 520 ? x1 - 20 : x1 + (x2 - x1) * .78 - 40, x2 - x1 > 520 ? x1 + (x2 - x1) * .93 + 40 : x1 + (x2 - x1) * .78 + 40]); }
  const xAst = xDe(-6.6e7); if (span < verPaso(24)) ocupado.push([xAst - 24, xAst + 24]);  // meteorito
  for (const a of [-4.2e6, -4e5]){ const xa = xDe(a); if (span < verPaso(28)) ocupado.push([xa - 14, xa + 14]); }   // australopiteco y neandertal
  ctx.save(); ctx.font = `15px ${MARCADOR}`; ctx.textAlign = "center"; ctx.textBaseline = "top";
  let ultimo = -1e9; tierrasDibujadas = [];
  for (const t of tierras){
    if (span > t.ver) continue;
    let x = xDe(t.año);
    const w = Math.max(46, ctx.measureText(t.nombre).width + 8);
    // De lejos se pegan a la anterior: se corren un poco a la derecha para que se vean
    if (t.pintar === tierraAzul) x = Math.max(x, xTierra + 45 + w / 2 + 6);
    // Si se pega a la anterior, se corre un poco a la derecha (como mucho 170 px); si no, espera a otro zoom
    if (t.pintar !== tierraAzul){
      const x0 = x; x = Math.max(x, ultimo + w / 2 + 11);
      if (x - x0 > 170) continue;
    }
    if (t.pintar === tierraHoy){
      if (span < verPaso(24)) x = Math.max(x, xAst + 24 + w / 2 + 6);  // a la derecha del meteorito
    }
    if (x < -40 || x > W + 40) continue;
    const a = x - w / 2, b = x + w / 2;
    // el dibujo (46 px) no puede pisar a los vecinos; su nombre, si choca, se queda sin poner
    // si roza a un vecino, se prueba a moverla unos píxeles
    const choca = xx => xx - 23 < ultimo + 3 || ocupado.some(([o1, o2]) => xx - 23 < o2 + 1 && xx + 23 > o1 - 1);
    const hueco = [0, -4, 4, -8, 8, -12].map(d => x + d).find(xx => !choca(xx));
    if (hueco === undefined) continue;
    x = hueco;
    const d1 = x - 23, d2 = x + 23;
    t.pintar(x, yc, t.e ? t.e.id : 1, true);
    const a2 = x - w / 2, b2 = x + w / 2;
    const conNombre = a2 >= ultimo + 4 && !ocupado.some(([o1, o2]) => a2 < o2 && b2 > o1);
    if (conNombre){ ctx.fillStyle = TINTA; ctx.textBaseline = "bottom"; ctx.fillText(t.nombre, x, yc - 24); ctx.textBaseline = "top"; }   // nombre encima
    ultimo = conNombre ? b2 : d2;
    tierrasDibujadas.push({ x, w: 46 });
    if (t.e) zonasPer.push({ x0: Math.min(a2, d1), y0: yc - 44, x1: Math.max(b2, d2), y1: yc + 24, e: t.e });
  }
  ctx.restore();
}

// Doble corona de Egipto (pschent): la roja del Bajo Egipto rodeando a la blanca del Alto; (cx, base) = base
function coronas(cx, base, semilla){
  const s = semilla * 61 + 3;
  ctx.save(); ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.strokeStyle = TINTA; ctx.lineWidth = 2;
  // Corona blanca (alta, en forma de bolo), que asoma por arriba
  ctx.beginPath();
  ctx.moveTo(cx - 9, base - 16);
  ctx.quadraticCurveTo(cx - 11, base - 38, cx - 3, base - 46);
  ctx.quadraticCurveTo(cx + 1, base - 52, cx + 4, base - 46);
  ctx.quadraticCurveTo(cx + 11, base - 36, cx + 8, base - 16);
  ctx.closePath(); ctx.fillStyle = "#fffdf7"; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + 1, base - 49, 3, 0, Math.PI * 2); ctx.fillStyle = "#fffdf7"; ctx.fill(); ctx.stroke();
  // Corona roja: la base plana, con el saliente alto por detrás (izquierda)
  ctx.beginPath();
  ctx.moveTo(cx - 20, base);
  ctx.lineTo(cx - 20, base - 40);
  ctx.lineTo(cx - 13, base - 40);
  ctx.lineTo(cx - 13, base - 18);
  ctx.lineTo(cx + 16, base - 18);
  ctx.lineTo(cx + 18, base);
  ctx.closePath();
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = "rgba(220, 60, 50, .75)"; ctx.fill(); ctx.restore();
  ctx.stroke();
  // Espiral delante
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(cx - 6, base - 18);
  ctx.quadraticCurveTo(cx + 6, base - 28, cx + 14, base - 30);
  ctx.quadraticCurveTo(cx + 20, base - 31, cx + 18, base - 26);
  ctx.quadraticCurveTo(cx + 16, base - 23, cx + 13, base - 26);
  ctx.stroke();
  // Arena / suelo amarillo
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.strokeStyle = "rgba(255, 212, 0, .85)"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(cx - 26, base + 3); ctx.lineTo(cx + 24, base + 3); ctx.stroke(); ctx.restore();
  ctx.restore();
}

// Gran Pirámide a mano: hiladas de bloques, arena amarilla y un sol detrás; (cx, base) = centro de la base
function piramide(cx, base, semilla){
  const s = semilla * 59 + 7, w = 60, h = 58;
  // Sol detrás, arriba a la derecha
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = "rgba(255, 170, 40, .75)";
  ctx.beginPath(); ctx.arc(cx + 34, base - h + 6, 11, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  circuloMano(cx + 34, base - h + 6, 11, s, 1.6);
  // Cara iluminada y cara en sombra
  ctx.save(); ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "rgba(240, 200, 110, .85)";
  ctx.beginPath(); ctx.moveTo(cx - w, base); ctx.lineTo(cx, base - h); ctx.lineTo(cx + 8, base); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(190, 140, 70, .85)";
  ctx.beginPath(); ctx.moveTo(cx + 8, base); ctx.lineTo(cx, base - h); ctx.lineTo(cx + w, base); ctx.closePath(); ctx.fill();
  ctx.restore();
  // Contorno a mano
  raya(cx - w, base, cx, base - h, s + 1, 2.2);
  raya(cx, base - h, cx + w, base, s + 2, 2.2);
  raya(cx, base - h, cx + 8, base, s + 3, 1.8);
  // Hiladas de bloques
  for (let k = 1; k < 6; k++){
    const y = base - h * k / 6, f = 1 - k / 6;
    ctx.save(); ctx.globalAlpha *= .55;
    raya(cx - w * f + 2, y, cx + 8 * f - 1, y, s + 10 + k, 1);
    raya(cx + 8 * f + 1, y, cx + w * f - 2, y, s + 20 + k, 1);
    ctx.restore();
  }
  // Arena en la base
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.strokeStyle = "rgba(255, 212, 0, .85)"; ctx.lineWidth = 6; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(cx - w - 8, base + 2); ctx.quadraticCurveTo(cx, base - 2, cx + w + 8, base + 2); ctx.stroke(); ctx.restore();
  raya(cx - w - 10, base + 1, cx + w + 10, base + 1, s + 30, 1.6);
}

// Pirámide escalonada de América a mano: cuerpos de piedra, escalera central y, si toca, templo arriba
function escalonada(cx, base, semilla, o){
  const s = semilla * 61 + 3, w = 60, n = o.pisos, hp = o.alto / n;
  const ancho = k => w - (w - o.cima) * k / Math.max(n - 1, 1);       // medio ancho de cada cuerpo
  if (o.tumulo){                                                       // túmulo de tierra con la cima plana y árboles
    const yA = base - o.alto;
    ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = o.piedra;
    ctx.beginPath(); ctx.moveTo(cx - w, base); ctx.lineTo(cx - o.cima, yA); ctx.lineTo(cx + o.cima, yA); ctx.lineTo(cx + w, base); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(120, 100, 80, .25)";
    ctx.beginPath(); ctx.moveTo(cx + 10, base); ctx.lineTo(cx + o.cima * .4, yA); ctx.lineTo(cx + o.cima, yA); ctx.lineTo(cx + w, base); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(90, 160, 70, .8)";
    const azar = k => { const v = Math.sin(k * 12.9898 + s * 78.233) * 43758.5453; return v - Math.floor(v); };
    for (let i = 0; i < 14; i++){
      const fy = .12 + .8 * azar(i), yy = base - o.alto * fy, m = w - (w - o.cima) * fy - 5;
      ctx.beginPath(); ctx.arc(cx - m + 2 * m * azar(i + 50), yy, 2.4 + 1.4 * azar(i + 90), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    raya(cx - w, base, cx - o.cima, yA, s + 1, 2); raya(cx - o.cima, yA, cx + o.cima, yA, s + 2, 2); raya(cx + o.cima, yA, cx + w, base, s + 3, 2);
    ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.strokeStyle = o.suelo; ctx.lineWidth = 6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(cx - w - 8, base + 2); ctx.quadraticCurveTo(cx, base - 2, cx + w + 8, base + 2); ctx.stroke(); ctx.restore();
    raya(cx - w - 10, base + 1, cx + w + 10, base + 1, s + 30, 1.6);
    return;
  }
  ctx.save(); ctx.globalCompositeOperation = "multiply";
  for (let k = 0; k < n; k++){
    const a = ancho(k), y0 = base - k * hp;
    ctx.fillStyle = o.piedra; ctx.fillRect(cx - a, y0 - hp, 2 * a, hp);
    ctx.fillStyle = "rgba(120, 100, 80, .25)"; ctx.fillRect(cx + a * .35, y0 - hp, a * .65, hp);   // lado en sombra
  }
  ctx.restore();
  for (let k = 0; k < n; k++){
    const a = ancho(k), y0 = base - k * hp, y1 = y0 - hp;
    raya(cx - a, y0, cx - a, y1, s + k * 4, 1.8);
    raya(cx + a, y0, cx + a, y1, s + k * 4 + 1, 1.8);
    raya(cx - a, y1, cx + a, y1, s + k * 4 + 2, k === n - 1 ? 2 : 1.4);
  }
  // Escalera central
  const yA = base - o.alto, eb = 9, ea = 6;
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = "rgba(255, 253, 247, .9)";
  ctx.beginPath(); ctx.moveTo(cx - eb, base); ctx.lineTo(cx - ea, yA); ctx.lineTo(cx + ea, yA); ctx.lineTo(cx + eb, base); ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.fillStyle = "#fffdf7"; ctx.beginPath(); ctx.moveTo(cx - eb, base); ctx.lineTo(cx - ea, yA); ctx.lineTo(cx + ea, yA); ctx.lineTo(cx + eb, base); ctx.closePath(); ctx.fill();
  raya(cx - eb, base, cx - ea, yA, s + 50, 1.4); raya(cx + eb, base, cx + ea, yA, s + 51, 1.4);
  ctx.save(); ctx.globalAlpha *= .5;
  for (let y = base - 4; y > yA + 2; y -= 4){ const f = (base - y) / o.alto, m = eb - (eb - ea) * f; raya(cx - m + 1, y, cx + m - 1, y, s + y, .9); }
  ctx.restore();
  // Templo en la cima
  if (o.templo){
    const tw = o.cima * .8, th = 12, yT = yA;

      let cajas = null;

        const x1 = xDe(e.añoNace), x2 = xDe(e.añoMuere);
        ctx.font = `600 17px ${FUENTE}`;
        const der = t => x + 23 * 1.5 + 6 + ctx.measureText(t).width;
        const ini = Math.min(x1, x - 36);
        cajas = [
          [x - 36, der(e.corto || e.t)],                                   // 1: cara y nombre
          [ini, Math.max(x2, der(e.etiquetaFechas || e.etiqueta))],        // 2: + raya y fechas
          [ini, Math.max(x2, der(e.etiqueta))]                             // 3: + edad
        ];
        cx = cajas[0][0]; w = cajas[0][1] - cx;
      } else {
        if (e.icono === "poblado"){                          // choza grande con nombre y año al lado, como la pirámide
          ctx.font = `15px ${MARCADOR}`; const wT = ctx.measureText(e.t).width;
          ctx.font = `600 18px ${FUENTE}`; const wF = ctx.measureText(e.añoTxt).width;
          cx = x - 34; w = 34 + 40 + Math.max(wT, wF) + 6;
        }
        else if (e.icono === "piramide" || e.icono === "escalonada"){   // pirámide con el año al lado
          ctx.font = `600 18px ${FUENTE}`;
          cx = x - 72; w = 72 + 70 + ctx.measureText(e.añoTxt).width + 6;
        }
        else if (e.icono === "coronas"){                    // doble corona con el año al lado
          ctx.font = `600 18px ${FUENTE}`;
          cx = x - 26; w = 26 + 32 + ctx.measureText(e.añoTxt).width + 6;
        }
        else if (e.icono === "libro" || e.icono === "cohete"){   // dibujo con el año al lado
          ctx.font = `600 18px ${FUENTE}`;
          const izq = e.icono === "libro" ? 50 : 40, sep = e.icono === "libro" ? 52 : 34;
          cx = x - izq; w = izq + sep + ctx.measureText(e.añoTxt).width + 6;
        }
        else if (TEXTO_DEBAJO.includes(e.icono)){          // calavera o animal con el texto centrado debajo
          const L = lineasCalavera(e);
          ctx.font = `15px ${MARCADOR}`; let wm = Math.max(...L.tit.map(t => ctx.measureText(t).width));
          ctx.font = `600 15px ${FUENTE}`; wm = Math.max(wm, ...L.fec.map(t => ctx.measureText(t).width), 36);
          w = wm + 8; cx = x - w / 2;
          // De lejos solo cuenta el dibujo; el texto se pone debajo cuando hay sitio
          e._wTexto = w; w = HUMANOS.includes(e.icono) ? 26 : e.icono === "calavera" ? 34 : e.icono === "tierraHoy" ? 46 : 44; cx = x - w / 2;
        }
        else if (COSMICOS.includes(e.icono)){            // dibujo con título y fecha a la derecha
          ctx.font = `15px ${MARCADOR}`; const wT = ctx.measureText(e.t).width;
          ctx.font = `600 17px ${FUENTE}`; const wF = ctx.measureText(e.añoTxt).width;
          if (e.textoIzq){ cx = x - 34 - Math.max(wT, wF); w = x + 40 - cx; }   // texto a la izquierda del dibujo
          else { cx = x - 26; w = 26 + 42 + Math.max(wT, wF) + 8; }
        }
        else if (e.icono) w = 74;                          // dibujo con el año debajo
        else {
          ctx.font = `17px ${MARCADOR}`; const wT = ctx.measureText(e.t).width;
          ctx.font = `600 18px ${FUENTE}`; const wF = ctx.measureText(pie).width;
          w = Math.max(wT, wF) + 24;
        }
        if (cx === undefined) cx = x - w / 2;
      }
      // Personas: zona de la cara y zona del nombre (para que una cara de arriba no tape un nombre de abajo)
      const zonasP = e.cara ? { fa: x - 40, fb: x + 40, la: x + 40, lb: cx + w } : null;
      cands.push({ e, x, cx, w, pie, zp: zonasP, cajas });
    }
    // Colocación por niveles de importancia: primero el 1, luego el 2 y luego el 3.
    // Cada carril guarda los tramos ocupados. Del nivel 1 se pone todo lo que quepa;
    // los niveles 2 y 3 son «todo o nada»: o caben todos los de esa fila, o no sale ninguno
    // (ni los de niveles siguientes), y así las cosas aparecen al acercarse con sentido.
    const ocup = Array.from({ length: max }, () => []);
    const enCarril = (k, tmp) => ocup[k] ? ocup[k].concat(tmp.filter(o => o.k === k)) : [];
    const libre = (k, a, b, tmp, zp) => {
      if (enCarril(k, tmp).some(o => a < o.b + 8 && b > o.a - 8)) return false;
      if (!zp || true) return true;   // (las caras ya no tapan nombres: los nombres se dibujan encima, con borde)
      // su cara no puede quedar sobre el nombre de alguien del carril de abajo…
      if (k > 0 && enCarril(k - 1, tmp).some(o => o.zp && zp.fa < o.zp.lb && zp.fb > o.zp.la)) return false;
      // …ni su nombre bajo la cara de alguien del carril de arriba
      if (enCarril(k + 1, tmp).some(o => o.zp && zp.la < o.zp.fb && zp.lb > o.zp.fa)) return false;
      return true;
    };
    const intentar = (c, tmp) => {
      // Calaveras y animales: siempre a su altura (un solo carril); si no caben, esperan a otro zoom
      const maxK = TEXTO_DEBAJO.includes(c.e.icono) ? 1 : max;
      for (let k = 0; k < maxK; k++) if (libre(k, c.cx, c.cx + c.w, tmp, c.zp)) return { k, d: 0 };
      if (c.e.cara) return null;
      // Apartarlo un poco a la derecha (hasta 40 px; si ya se ven los trazos, hasta 200 px)
      // (los animales, calaveras y humanos nunca se apartan: salen en su fecha exacta cuando caben)
      if (maxK === 1) return null;
      const limite = W / ppa < 1800 ? 200 : 40;
      const huecos = ocup.flat().concat(tmp).map(o => o.b + 8 - c.cx).filter(d => d > 0 && d < limite).sort((p, q) => p - q);
      for (const d of huecos) for (let k = 0; k < maxK; k++) if (libre(k, c.cx + d, c.cx + d + c.w, tmp)) return { k, d };
      return null;
    };
    // Se coloca todo el timeline (no solo lo que se ve), por orden de aparición: lo de más peso
    // primero, así conserva su sitio al acercarse y lo que ya se veía no desaparece.
    const its = [], puestos = new Map();
    const prioBase = e => e.siempre ? 1e15 : e.verDesde ? 1e8 + e.verDesde : prioridadEvento(e);
    cands.forEach(c => c.p = prioBase(c.e));
    const orden = cands.slice().sort((p, q) => q.p - p.p || p.cx - q.cx);
    const tmp = [];
    // Cadena del meteorito a los humanos: se colocan en orden cronológico y, si uno no cabe todavía,
    // los posteriores esperan (así salen siempre de uno en uno, en orden, al acercarse)
    const enCadena = c => (TEXTO_DEBAJO.includes(c.e.icono) || c.e.icono === "poblado") && (c.e.paso || 0) >= 24;
    const cadena = orden.filter(enCadena);
    const todaCadena = EVENTOS.filter(e => (e.fila === fila || (FILAS[e.fila] || {}).junto === fila) && (TEXTO_DEBAJO.includes(e.icono) || e.icono === "poblado") && (e.paso || 0) >= 24).sort((p, q) => p.año - q.año);
    // Paso en que cada uno cabe en su fecha junto al anterior; nunca dos en el mismo paso
    const pasoActual = Math.log(ZOOM_BASE_AÑOS / (W / ppa)) / Math.log(PASO_RUEDA);
    let pasoPrev = -1, ePrev = null;
    const pasoCadena = new Map();
    for (const e of todaCadena){
      let n = e.paso || 0;
      if (ePrev){
        const wDib = x => HUMANOS.includes(x.icono) ? 26 : x.icono === "tierraHoy" ? 46 : x.icono === "poblado" ? 64 : 44;   // solo el dibujo (el texto sale cuando cabe)
        const necesita = (wDib(ePrev) + wDib(e)) / 2 + 14;   // px entre los dos
        const spanMax = W * Math.abs(e.año - ePrev.año) / necesita;
        n = Math.max(n, Math.ceil(Math.log(ZOOM_BASE_AÑOS / spanMax) / Math.log(PASO_RUEDA) - 1e-9), pasoPrev + 1);
      }
      pasoCadena.set(e, n); pasoPrev = n; ePrev = e;
    }
    let cadenaRota = false;
    for (const e of todaCadena){
      const c = cadena.find(x => x.e === e);
      if (!c || pasoActual + .5 < pasoCadena.get(e)){ cadenaRota = true; continue; }   // aún no toca: los siguientes esperan
      const r = cadenaRota ? null : intentar(c, tmp);
      if (r){ r.o = { k: r.k, a: c.cx + r.d, b: c.cx + r.d + c.w, zp: c.zp }; r.etapa = 1; puestos.set(c, r); ocup[r.k].push(r.o); }
      else cadenaRota = true;
    }
    for (const c of orden){
      if (enCadena(c)) continue;
      // Si cerca hay algo más antiguo (de más peso) que no ha cabido, este espera su turno
      // y no ocupa sitio: así nunca sale algo antes que lo anterior, y lo que sale ya no se va.
      const r = intentar(c, tmp);
      if (r){ r.o = { k: r.k, a: c.cx + r.d, b: c.cx + r.d + c.w, zp: c.zp }; r.etapa = 1; puestos.set(c, r); ocup[r.k].push(r.o); }
    }
    // Personas: primero se decide qué caras salen, cada una ocupando solo su cara y su nombre.
    // Después, con el sitio que sobra, cada cara (por orden de importancia) gana el máximo detalle
    // que quepa, pudiendo subir de carril: 2 = raya de vida y fechas; 3 = además la edad.
    // Nunca se quita una cara para poner fechas. Todo depende solo del zoom.
    const conCara = orden.filter(c => c.cajas && puestos.has(c));
    {
      // Se recolocan por orden de importancia: cada una con el máximo detalle posible, siempre que
      // las que vienen detrás sigan cabiendo al menos con su cara y su nombre.
      const fijos = ocup.map(l => l.filter(o => !conCara.some(c => puestos.get(c).o === o)));
      const choca = (l, a, b) => l.some(o => a < o.b + 8 && b > o.a - 8);
      const caben = (lanes, desde) => {
        const l = lanes.map(x => x.slice());
        for (let j = desde; j < conCara.length; j++){
          const [a, b] = conCara[j].cajas[0];
          let k = 0; while (k < max && choca(l[k], a, b)) k++;
          if (k === max) return false;
          l[k].push({ a, b });
        }
        return true;
      };
      const l2 = fijos.map(l => l.slice()), res = new Map();
      let ok = true;
      for (let i = 0; i < conCara.length && ok; i++){
        const c = conCara[i];
        let hecho = null;
        for (let et = 3; et >= 1 && !hecho; et--){
          const [a, b] = c.cajas[et - 1];
          for (let k = 0; k < max; k++){
            if (choca(l2[k], a, b)) continue;
            const o = { k, a, b, zp: c.zp };
            l2[k].push(o);
            if (caben(l2, i + 1)){ hecho = { k, d: 0, o, etapa: et }; break; }
            l2[k].pop();
          }
        }
        if (hecho) res.set(c, hecho); else ok = false;
      }
      if (ok){
        for (const [c, r] of res) puestos.set(c, r);
        for (let k = 0; k < max; k++) ocup[k] = l2[k];
      }
    }
    for (let pasada = 0; pasada < 3; pasada++){
      let cambio = false;
      for (const c of conCara){
        const r = puestos.get(c);
        if (r.etapa === 3) continue;
        const sin = ocup.map(l => l.filter(o => o !== r.o));
        let mejor = null;
        for (let et = 3; et > r.etapa && !mejor; et--){
          const [a, b] = c.cajas[et - 1];
          for (let k = 0; k < max; k++) if (!sin[k].some(o => a < o.b + 8 && b > o.a - 8)){ mejor = { k, a, b, et }; break; }
        }
        if (!mejor) continue;
        ocup[r.k] = ocup[r.k].filter(o => o !== r.o);
        r.o = { k: mejor.k, a: mejor.a, b: mejor.b, zp: c.zp }; r.k = mejor.k; r.etapa = mejor.et; ocup[mejor.k].push(r.o);
        cambio = true;
      }
      if (!cambio) break;
    }
    for (const c of cands){
      const r = puestos.get(c), cabe = !!r, carril = cabe ? r.k : 0, d = cabe ? r.d : 0;
      if (cabe && c.cajas){ c.cx = r.o.a; c.w = r.o.b - r.o.a; }
      its.push({ e: c.e, x: c.x + d, xLinea: c.x, yF: yF - carril * altoCarril(fila), w: c.w, cx: c.cx + d, cabe, arriba, etapa: cabe ? r.etapa : 1,
                 pie: c.pie, carril, apartado: d > 0, p: c.p, escala: fila === "libros" && carril > 0 ? ESC_LIBRO : 1 });
    }
    const usados = ocup.reduce((n, o, k) => o.length ? k + 1 : n, 1);
    return { its, usados, puestos: puestos.size };
  }
  // Si hay libros que no caben en una sola fila, se reserva sitio para la fila de libros de arriba
  // (aunque así quepan menos alturas de personas)
  // Todo o nada: la fila de arriba solo se usa si con ella caben TODOS los libros a la vista;
  // así no aparece uno lejano (Crimen y castigo) antes que otro que sigue sin caber (la Eneida).
  // Las personas tienen prioridad para apilarse; la fila de libros de arriba usa el sitio que sobre.
  const usarFilaLibros = true;
  // Si hay más de un libro a la vista, se reserva siempre el sitio de la fila de libros de arriba,
  // para que un libro que ya se veía no desaparezca cuando se apilan más personas.
  const librosVisibles = EVENTOS.filter(e => e.fila === "libros" && visib(e) && xDe(e.año) > -300 && xDe(e.año) < W + 300).length;
  // Las personas se apilan hasta el título, haya libros o no: los libros nunca les quitan sitio.
  // Los libros van encima de las personas; si ahí no caben, bajan a un hueco entre ellas o no salen.
  CARRILES.personas = Math.min(7, 1 + Math.max(0, Math.floor((yFila("personas", yBase) - 10 - finTitulo) / ALTO_CARRIL)));
  const items = [];
  // Zonas de tiempo fijas para cada zoom (tamaño potencia de 2): al acercarse, cada zona se parte
  // en dos y la zona afectada por algo que no cabe solo se encoge.
  const tramo = Math.pow(2, Math.ceil(Math.log2(W / ppa))), celda = año => Math.floor(año / tramo);
  const corteCelda = new Map();
  const marcarNoCabe = (fila, año, p) => { for (const d of [-1, 0, 1]){ const k = celda(año) + d; corteCelda.set(k, Math.max(corteCelda.get(k) || 0, p)); } };
  const bloqueado = (fila, año, p) => (corteCelda.get(celda(año)) || 0) > p * 1.001;
  const pers = colocar("personas", yFila("personas", yL));
  items.push(...pers.its);
  const extra = (pers.usados - 1) * ALTO_CARRIL;     // lo que crece la fila de personas
  for (const fila of Object.keys(FILAS)){
    if (fila === "personas" || FILAS[fila].junto) continue;
    const F = FILAS[fila];
    const sube = F.lado < 0 && F.n > FILAS.personas.n ? extra : 0;
    const yF = yFila(fila, yL) - sube;
    const its = colocar(fila, yF, fila === "libros" ? (usarFilaLibros && cabeFilaLibros(yF) ? 2 : 1) : 0).its;
    if (fila === "libros") for (const it of its) if (it.cabe && it.yF - 38 < finTitulo + 4) it.cabe = false;   // no se meten bajo el título
    items.push(...its);
  }
  // Orden común a todas las filas: lo que no cabe en una fila bloquea, cerca de él, lo más reciente
  // de todas las filas (las personas se colocan primero; para las demás se repasa al final).
  // Solo se oculta lo que de verdad no cabe en su sitio (sin arrastrar a los vecinos).
  // Libros que no caben en su fila: bajan al primer hueco libre entre las alturas de personas
  // de su tramo, empezando por arriba y siempre por encima de las personas que haya allí.
  // Solo depende del zoom (se mira toda la línea), así que al desplazarse no cambia.
  const cajaY = it => it.e.icono === "libro" ? [it.yF - 38, it.yF + 66]
                    : it.e.cara ? [it.yF - 4, it.yF + 50]
                    : [it.yF - 10, it.yF + ALTO_TARJETA + 10];
  const sinSitio = items.filter(it => !it.cabe && it.e.icono === "libro" && visib(it.e)).sort((p, q) => q.p - p.p);
  for (const it of sinSitio){
    const xa = it.cx - 8, xb = it.cx + it.w + 8;
    const cerca = items.filter(o => o.cabe && o !== it && o.cx < xb && o.cx + o.w > xa);
    // Por encima de las personas de su tramo (y de la línea)
    let tope = yL - 14;
    for (const o of cerca) if (o.e.cara) tope = Math.min(tope, cajaY(o)[0] - 6);
    for (let y = Math.max(it.yF, finTitulo + 44); y + 66 <= tope; y += 4){   // nunca bajo el título
      if (cerca.some(o => { const [a1, b1] = cajaY(o); return y - 38 < b1 + 4 && y + 66 > a1 - 4; })) continue;
      it.cabe = true; it.yF = y; it.escala = 1; it.carril = 1;
      break;
    }
  }
  // Lo que no cabe no se dibuja (ni puntos): aparecerá al acercarse
  for (let i = items.length - 1; i >= 0; i--) if (!items[i].cabe) items.splice(i, 1);
  const h = ALTO_TARJETA;
  // Al alejarse mucho los eventos se desvanecen (entre 20.000 y 60.000 años en pantalla);
  // los periodos aguantan más.
  const visibilidad = Math.min(1, Math.max(0, (60000 - W / ppa) / 40000));
  zonas = [];
  // Los eventos con "siempre" (como la muerte del Sol) no se desvanecen
  for (let i = items.length - 1; i >= 0; i--) if (!visib(items[i].e)) items.splice(i, 1);
  if (!items.length) return;
  ctx.save();
  // 2) Trazos finos de la línea a cada tarjeta (por debajo de todo).
  //    Solo al acercarse: aparecen poco a poco entre 2.000 y 1.000 años en pantalla.
  const añosVisibles = W / ppa;
  const verTrazos = Math.min(1, Math.max(0, (2000 - añosVisibles) / 1000));
  ctx.save(); ctx.globalAlpha *= .35 * verTrazos;
  for (const it of items){
    if (!verTrazos && !it.apartado) continue;
    ctx.save(); if (!verTrazos) ctx.globalAlpha = .35;
    const yB = it.cabe ? (it.arriba ? it.yF + h : it.yF) : it.yF + h / 2;
    raya(it.xLinea ?? it.x, it.arriba ? yL - 6 : yL + 6, it.x, yB, it.e.id + .9, 1, 1);   // un solo trazo fino
    ctx.restore();
  }
  ctx.restore();
  // 3) Puntos en la línea, papelitos con cinta y puntos de los que no caben
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  // Primero los puntos de los que no caben, para que los dibujos queden por encima
  items.sort((a, b) => (a.cabe ? 1 : 0) - (b.cabe ? 1 : 0));
  // Animales con texto debajo: el texto solo se pone si no pisa a los vecinos de su fila
  const sinTexto = new Set();
  for (const it of items){
    if (!it.cabe || !it.e._wTexto) continue;
    const vec = items.filter(o => o !== it && o.cabe && o.yF === it.yF).map(o => ({ x: o.x, w: o.e._wTexto || o.w }));
    if (it.e.fila === "hitos") vec.push(...tierrasDibujadas);   // las Tierras van a la misma altura
    if (vec.some(o => Math.abs(o.x - it.x) < it.e._wTexto / 2 + o.w / 2 + 6)) sinTexto.add(it);
  }
  for (const it of items){
    ctx.globalAlpha = visib(it.e);
    ctx.fillStyle = TINTA;
    ctx.beginPath(); ctx.arc(it.xLinea ?? it.x, yL, 3.5, 0, Math.PI * 2); ctx.fill();
    if (!it.cabe){
      ctx.beginPath(); ctx.arc(it.x, it.yF + h / 2, 4, 0, Math.PI * 2); ctx.fill();
      continue;
    }
    if (it.e.resumen){
      const td = TEXTO_DEBAJO.includes(it.e.icono), sube = td ? 36 + (it.e.fila === "personas" ? 50 : 0) : 0;
      zonas.push({ x0: it.cx, y0: it.yF - 14 - sube, x1: it.cx + it.w, y1: it.yF + h + 22 - (td && it.e.fila === "personas" ? 50 : 0), e: it.e });
    }
    if (it.e.cara){
      tramoVida(it, it.yF + h / 2 - 4);
      continue;
    }
    if (it.e.icono){
      ctx.save();
      if (it.escala !== 1){                         // fila de libros de arriba: un poco más pequeños
        const cy = it.yF + 12;
        ctx.translate(it.x, cy); ctx.scale(it.escala, it.escala); ctx.translate(-it.x, -cy);
      }
      if (it.e.icono === "bombilla") bombilla(it.x, it.yF + 16, it.e.id);
      if (it.e.icono === "rollo")    rolloImpreso(it.x, it.yF + 20, it.e.id);
      if (it.e.icono === "librito")  librito(it.x, it.yF + 20, it.e.id);
      if (it.e.icono === "prensa")   prensa(it.x, it.yF + 20, it.e.id);
      if (it.e.icono === "piramide") piramide(it.x, it.yF + 62, it.e.id);
      if (it.e.icono === "poblado"){ ctx.save(); ctx.translate(it.x, it.yF + 62); ctx.scale(1.6, 1.6); choza(0, 0); ctx.restore(); }
      if (it.e.icono === "escalonada") escalonada(it.x, it.yF + 62, it.e.id, it.e.escalonada);
      if (it.e.icono === "coronas")  coronas(it.x, it.yF + 26, it.e.id);
      if (it.e.icono === "cohete")   cohete(it.x, it.yF + 18, it.e.id);
      if (it.e.icono === "libro")    libro(it.x, it.yF + 12, it.e);
      if (it.e.icono === "sol")      solRojo(it.x, it.yF + 10, it.e.id);
      if (it.e.icono === "tierra")   tierraNace(it.x, it.yF + 10, it.e.id);
      if (it.e.icono === "tierraAzul") tierraAzul(it.x, it.yF + 10, it.e.id, true);
      if (it.e.icono === "bigbang")  bigBang(it.x, it.yF + 10, it.e.id);
      if (it.e.icono === "estrellas") primerasEstrellas(it.x, it.yF + 10, it.e.id);
      if (it.e.icono === "galaxia")  galaxia(it.x, it.yF + 10, it.e.id);
      if (it.e.icono === "solJoven") solJoven(it.x, it.yF + 10, it.e.id);
      // Los de la fila de arriba (las extinciones) suben 50 px para que su texto no pise la fila de los animales
      const subeTD = it.e.fila === "personas" && TEXTO_DEBAJO.includes(it.e.icono) ? 50 : 0;
      if (it.e.icono === "calavera") calavera(it.x, it.yF - 18 - subeTD, it.e.id);
      if (it.e.icono === "asteroide") asteroide(it.x, it.yF - 18 - subeTD, it.e.id);
      if (it.e.icono === "tierraHoy") tierraHoy(it.x, it.yF - 14 - subeTD, it.e.id);
      if (it.e.icono === "trilobites") trilobites(it.x, it.yF - 18 - subeTD);
      if (it.e.icono === "anfibio")  anfibio(it.x, it.yF - 4 - subeTD);
      if (it.e.icono === "reptil")   reptil(it.x, it.yF - 4 - subeTD);
      if (it.e.icono === "mamifero") mamifero(it.x, it.yF - 4 - subeTD);
      if (it.e.icono === "primate")  primate(it.x, it.yF - 4 - subeTD);
      if (it.e.icono === "mono")     mono(it.x, it.yF - 4 - subeTD);
      if (it.e.icono === "mamut")    mamut(it.x, it.yF - 4 - subeTD);
      if (it.e.icono === "choza")    choza(it.x, it.yF - 4 - subeTD);
      if (HUMANOS.includes(it.e.icono)) ({ australopiteco, erectus, neandertal, sapiens })[it.e.icono](it.x, it.yF + 2 - subeTD);
      ctx.fillStyle = "#555"; ctx.textAlign = "center";
      ctx.font = `600 18px ${FUENTE}`;
      if (it.e.icono === "libro"){ ctx.textAlign = "left"; ctx.fillText(it.e.añoTxt, it.x + 52, it.yF + 42); }
      else if (it.e.icono === "coronas"){ ctx.textAlign = "left"; ctx.fillText(it.e.añoTxt, it.x + 30, it.yF + 10); }
      else if (it.e.icono === "poblado"){
        ctx.textAlign = "left"; ctx.fillStyle = TINTA; ctx.font = `15px ${MARCADOR}`; ctx.fillText(it.e.t, it.x + 40, it.yF + 18);
        ctx.fillStyle = "#555"; ctx.font = `600 18px ${FUENTE}`; ctx.fillText(it.e.añoTxt, it.x + 40, it.yF + 36);
      }
      else if (it.e.icono === "piramide" || it.e.icono === "escalonada"){ ctx.textAlign = "left"; ctx.fillText(it.e.añoTxt, it.x + 70, it.yF + 34); }
      else if (it.e.icono === "cohete"){ ctx.textAlign = "left"; ctx.fillText(it.e.añoTxt, it.x + 34, it.yF + 32); }
      else if (TEXTO_DEBAJO.includes(it.e.icono)){
        if (sinTexto.has(it)){ ctx.restore(); ctx.textAlign = "left"; continue; }
        const L = lineasCalavera(it.e); let y = it.yF + 8 - (it.e.fila === "personas" ? 50 : 0);
        ctx.textAlign = "center"; ctx.textBaseline = "top";
        ctx.fillStyle = TINTA; ctx.font = `15px ${MARCADOR}`;
        for (const t of L.tit){ ctx.fillText(t, it.x, y); y += 17; }
        ctx.fillStyle = "#555"; ctx.font = `600 15px ${FUENTE}`;
        for (const t of L.fec){ ctx.fillText(t, it.x, y); y += 17; }
      }
      else if (COSMICOS.includes(it.e.icono)){
        const izq = it.e.textoIzq, xt = izq ? it.x - 34 : it.x + 42;
        ctx.textAlign = izq ? "right" : "left"; ctx.textBaseline = "bottom";
        ctx.fillStyle = TINTA; ctx.font = `15px ${MARCADOR}`; ctx.fillText(it.e.t, xt, it.yF + 9);
        ctx.fillStyle = "#555"; ctx.font = `600 17px ${FUENTE}`; ctx.fillText(it.e.añoTxt, xt, it.yF + 28);
        ctx.textBaseline = "top";
      }
      else ctx.fillText(it.e.añoTxt, it.x, it.yF + 58);
      ctx.restore();
      ctx.textAlign = "left";
      continue;
    }
    const r = aleatorio(it.e.id * 31 + 7);
    ctx.save();
    ctx.translate(it.x, it.yF + h / 2);
    ctx.rotate((r() - .5) * 0.07);                 // cada papel un poco torcido
    const x0 = -it.w / 2, y0 = -h / 2;
    // Papel con sombra suave
    ctx.shadowColor = "rgba(0,0,0,.16)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
    ctx.fillStyle = "#fffdf7"; ctx.fillRect(x0, y0, it.w, h);
    ctx.shadowColor = "transparent";
    // Cinta de carrocero arriba
    ctx.save(); ctx.translate((r() - .5) * it.w * .3, y0); ctx.rotate((r() - .5) * 0.5);
    ctx.fillStyle = "rgba(222,205,160,.82)"; ctx.fillRect(-22, -8, 44, 15);
    ctx.restore();
    // Texto: título a rotulador y fecha a mano
    ctx.fillStyle = TINTA;
    ctx.font = `17px ${MARCADOR}`; ctx.fillText(it.e.t, x0 + 12, y0 + 7);
    ctx.fillStyle = "#555";
    ctx.font = `600 18px ${FUENTE}`; ctx.fillText(it.pie, x0 + 12, y0 + 28);
    ctx.restore();
  }
  dibujarNombres();                                // nombres de las personas, por encima de todo
  ctx.restore();                                   // fin del desvanecido
  ctx.fillStyle = TINTA; ctx.textAlign = "center";
}

function formatoZoom(z){
  const p = z * 100;
  if (p >= 10000) return Math.round(p / 1000).toLocaleString("es-ES") + "k%";
  if (p >= 10) return Math.round(p).toLocaleString("es-ES") + "%";
  if (p >= 1) return p.toFixed(1).replace(".", ",") + "%";
  return p.toLocaleString("es-ES", { maximumSignificantDigits: 2 }) + "%";
}

// --- Redibujar solo cuando hace falta ---
let pendiente = false;
function pedir(){ if (!pendiente){ pendiente = true; requestAnimationFrame(() => { pendiente = false; dibujar(); }); } }

// --- Zoom alrededor de un punto ---
function zoomEn(x, factor){
  const a = añoDe(x);
  ppa = Math.min(PPA_MAX, Math.max(ppaMin(), ppa * factor));
  centro = a - (x - W / 2) / ppa;
  pedir();
}

cv.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.shiftKey && !e.ctrlKey){ centro += (e.deltaY || e.deltaX) / ppa; pedir(); return; }
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && !e.ctrlKey){ centro += e.deltaX / ppa; pedir(); return; }
  const k = e.ctrlKey ? 0.012 : 0.0018;      // pellizco del trackpad o rueda
  zoomEn(e.clientX, Math.exp(-e.deltaY * k));
}, { passive: false });

// Arrastrar con ratón o un dedo; pellizcar con dos dedos
const punteros = new Map();
let pellizco = null;
let inicioToque = null;
const zonaEn = (x, y) => zonas.concat(zonasPer, zonasGeo).find(z => x >= z.x0 && x <= z.x1 && y >= z.y0 && y <= z.y1);
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
  inicioToque = punteros.size === 1 ? { x: e.clientX, y: e.clientY } : null;
  cv.classList.add("arrastrando");
  if (punteros.size === 2){
    const [p1, p2] = [...punteros.values()];
    pellizco = { d: Math.hypot(p2.x - p1.x, p2.y - p1.y) };
  }
});
cv.addEventListener("pointermove", e => {
  const prev = punteros.get(e.pointerId);
  if (!prev){ cv.style.cursor = zonaEn(e.clientX, e.clientY) ? "pointer" : ""; return; }
  const act = { x: e.clientX, y: e.clientY };
  if (punteros.size === 1){
    centro -= (act.x - prev.x) / ppa;
    despY += act.y - prev.y;
    punteros.set(e.pointerId, act); pedir();
  } else if (punteros.size === 2 && pellizco){
    punteros.set(e.pointerId, act);
    const [p1, p2] = [...punteros.values()];
    const d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    if (d > 0 && pellizco.d > 0) zoomEn((p1.x + p2.x) / 2, d / pellizco.d);
    pellizco.d = d;
  }
});
const soltar = e => {
  // Clic sin arrastrar sobre un evento: abrir su resumen
  if (e.type === "pointerup" && inicioToque && punteros.size === 1 &&
      Math.hypot(e.clientX - inicioToque.x, e.clientY - inicioToque.y) < 6){
    const z = zonaEn(e.clientX, e.clientY);
    z ? abrirNota(z.e, e.clientX, e.clientY) : cerrarNota();
  }
  punteros.delete(e.pointerId);
  if (punteros.size < 2) pellizco = null;
  if (!punteros.size) cv.classList.remove("arrastrando");
};
cv.addEventListener("pointerup", soltar);
cv.addEventListener("pointercancel", soltar);

// --- Nota con el resumen ---
const nota = document.getElementById("nota");
function abrirNota(ev, x, y){
  document.getElementById("notaT").textContent = ev.t;
  document.getElementById("notaF").textContent = ev.txt + (ev.sub ? " · " + ev.sub : "");
  document.getElementById("notaR").textContent = ev.resumen;
  const mas = document.getElementById("notaMas");
  mas.style.display = ev.detalle ? "" : "none";
  mas.onclick = () => abrirDetalle(ev);
  nota.classList.add("abierta");
  const r = nota.getBoundingClientRect();
  const left = Math.min(Math.max(16, x - r.width / 2), W - r.width - 16);
  const top = y + 24 + r.height < H - 16 ? y + 24 : Math.max(16, y - r.height - 24);
  nota.style.left = left + "px"; nota.style.top = top + "px";
}
function cerrarNota(){ nota.classList.remove("abierta"); }

// Dos cintas de carrocero por foto, distintas en cada una: el tipo, el sitio y el giro salen
// del nombre de la foto (siempre igual para la misma foto, distinto entre fotos)
const CINTAS = [                                 // ancho en px y giro propio de la imagen
  { w: 150, ar: 300 / 109 }, { w: 112, ar: 220 / 110 }, { w: 165, ar: 340 / 59 },
  { w: 150, ar: 300 / 69 },  { w: 120, ar: 240 / 149 }, { w: 92, ar: 180 / 130 }
];
const SITIOS = {                                  // dónde va y cuánto se gira cada trozo
  arriba:   (w, h) => ({ top: -h * .45 + "px", left: "50%", marginLeft: -w / 2 + "px", g: 0 }),
  abajo:    (w, h) => ({ bottom: -h * .45 + "px", left: "50%", marginLeft: -w / 2 + "px", g: 0 }),
  arribaIz: (w, h) => ({ top: -h * .2 + "px", left: -w * .32 + "px", g: -40 }),
  arribaDe: (w, h) => ({ top: -h * .2 + "px", right: -w * .32 + "px", g: 40 }),
  abajoIz:  (w, h) => ({ bottom: -h * .2 + "px", left: -w * .32 + "px", g: 40 }),
  abajoDe:  (w, h) => ({ bottom: -h * .2 + "px", right: -w * .32 + "px", g: -40 })
};
const PAREJAS = [["arriba", "abajoDe"], ["arribaIz", "abajoDe"], ["arribaDe", "abajoIz"], ["arriba", "abajo"], ["arribaIz", "arribaDe"], ["arriba", "abajoIz"]];
function ponerCintas(fig, clave){
  let h = 0; for (const ch of String(clave)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const r = () => (h = (h * 1103515245 + 12345) >>> 0) / 4294967296;
  const pareja = PAREJAS[Math.floor(r() * PAREJAS.length)];
  const t1 = Math.floor(r() * 6); let t2 = Math.floor(r() * 5); if (t2 >= t1) t2++;
  fig.style.setProperty("--giro", ((r() < .5 ? -1 : 1) * (1.5 + r() * 2.5)).toFixed(1) + "deg");
  [t1, t2].forEach((t, k) => {
    const c = CINTAS[t], w = c.w, alto = w / c.ar, pos = SITIOS[pareja[k]](w, alto);
    const el = document.createElement("span"); el.className = "cinta";
    el.style.width = w + "px"; el.style.height = alto + "px";
    el.style.backgroundImage = `var(--cinta${t + 1})`;

    fig.append(el);
  });
}

(function(){

  function lget(k){try{return localStorage.getItem(k);}catch(e){return null;}}

  if(/[?&]contar\b/.test(q)){lset("hi_nocontar",null);}

  if(/[?&](no)?contar\b/.test(q)){
    var t=document.createElement("div");
    t.textContent=nocontar?"Este navegador ya no cuenta visitas":"Este navegador vuelve a contar visitas";
    t.style.cssText="position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1c1a17;color:#f2ead8;font:600 13px system-ui,sans-serif;padding:9px 14px;border-radius:6px;z-index:99;box-shadow:0 4px 12px rgba(0,0,0,.3)";
    document.addEventListener("DOMContentLoaded",function(){document.body.appendChild(t);setTimeout(function(){t.remove();},4000);});
  }
  // Globo: la visita se registra una vez por sesion (/visit) y nunca si el navegador esta marcado. Contador: suma en cada carga salvo marcado.
  var ruta=(nocontar||sget("hi_visita"))?"/points":"/visit";
  var url=API+ruta+"?"+(nocontar?"get":"hit")+"=historia";
  var ctl=("AbortController" in window)?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort();},5000);
  window.HI={nocontar:nocontar,resp:fetch(url,{cache:"no-store",signal:ctl?ctl.signal:undefined})
    .then(function(r){clearTimeout(to);if(!r.ok)throw 0;return r.json();})
    .then(function(j){if(ruta==="/visit")sset("hi_visita","1");return j;},function(e){clearTimeout(to);throw e;})};
})();

    function puntos(pts){
      pts=(pts||[]).slice();
      if(yo&&!pts.some(esYo))pts.push({lat:yo.lat,lon:yo.lon,c:"",p:""});
      g.pointsData(pts);
      g.ringsData(yo?[yo]:[]);
    }
    datos.then(puntos);
    ubic.then(function(u){
      datos.then(puntos);
      if(u)g.pointOfView({lat:u.lat,lng:u.lon,altitude:1.75},1200);
    });
  }).catch(function(){el.style.display="none";});
})();
</script>
