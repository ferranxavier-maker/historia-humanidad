  ctx.save();
  // 2) Trazos finos de la línea a cada tarjeta (por debajo de todo).
  //    Solo al acercarse: aparecen poco a poco entre 2.000 y 1.000 años en pantalla.
  const añosVisibles = W / ppa;
  const verTrazos = Math.min(1, Math.max(0, (2000 - añosVisibles) / 1000));
  ctx.save(); ctx.globalAlpha *= .35 * verTrazos;
  for (const it of items){
    if (!verTrazos && !it.apartado) continue;
    ctx.save(); if (!verTrazos) ctx.globalAlpha = .35;
    const yB = it.cabe ? (it.arriba ? it.yF + h : it.yF) : it.yF + h / 2;
    raya(it.xLinea ?? it.x, it.arriba ? yL - 6 : yL + 6, it.x, yB, it.e.id + .9, 1, 1);   // un solo trazo fino
    ctx.restore();
  }
  ctx.restore();
  // 3) Puntos en la línea, papelitos con cinta y puntos de los que no caben
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  // Primero los puntos de los que no caben, para que los dibujos queden por encima
  items.sort((a, b) => (a.cabe ? 1 : 0) - (b.cabe ? 1 : 0));
  for (const it of items){
    ctx.globalAlpha = visib(it.e);
    ctx.fillStyle = TINTA;
    ctx.beginPath(); ctx.arc(it.xLinea ?? it.x, yL, 3.5, 0, Math.PI * 2); ctx.fill();
    if (!it.cabe){
      ctx.beginPath(); ctx.arc(it.x, it.yF + h / 2, 4, 0, Math.PI * 2); ctx.fill();
      continue;
    }
    if (it.e.resumen) zonas.push({ x0: it.cx, y0: it.yF - 14, x1: it.cx + it.w, y1: it.yF + h + 22, e: it.e });
    if (it.e.cara){
      tramoVida(it, it.yF + h / 2 - 4);
      continue;
    }
    if (it.e.icono){
      ctx.save();
      if (it.escala !== 1){                         // fila de libros de arriba: un poco más pequeños
        const cy = it.yF + 12;
        ctx.translate(it.x, cy); ctx.scale(it.escala, it.escala); ctx.translate(-it.x, -cy);
      }
      if (it.e.icono === "bombilla") bombilla(it.x, it.yF + 16, it.e.id);
      if (it.e.icono === "piramide") piramide(it.x, it.yF + 62, it.e.id);
      if (it.e.icono === "coronas")  coronas(it.x, it.yF + 26, it.e.id);
      if (it.e.icono === "cohete")   cohete(it.x, it.yF + 18, it.e.id);
      if (it.e.icono === "libro")    libro(it.x, it.yF + 12, it.e);
      if (it.e.icono === "sol")      solRojo(it.x, it.yF + 10, it.e.id);
      if (it.e.icono === "tierra")   tierraNace(it.x, it.yF + 10, it.e.id);
      if (it.e.icono === "bigbang")  bigBang(it.x, it.yF + 10, it.e.id);
      if (it.e.icono === "estrellas") primerasEstrellas(it.x, it.yF + 10, it.e.id);
      if (it.e.icono === "galaxia")  galaxia(it.x, it.yF + 10, it.e.id);
      if (it.e.icono === "solJoven") solJoven(it.x, it.yF + 10, it.e.id);
      if (it.e.icono === "asteroide") asteroide(it.x, it.yF + 12, it.e.id);
      if (it.e.icono === "calavera") calavera(it.x, it.yF + 12, it.e.id);
      ctx.fillStyle = "#555"; ctx.textAlign = "center";
      ctx.font = `600 18px ${FUENTE}`;
      if (it.e.icono === "libro"){ ctx.textAlign = "left"; ctx.fillText(it.e.añoTxt, it.x + 52, it.yF + 42); }
      else if (it.e.icono === "coronas"){ ctx.textAlign = "left"; ctx.fillText(it.e.añoTxt, it.x + 30, it.yF + 10); }
      else if (it.e.icono === "piramide"){ ctx.textAlign = "left"; ctx.fillText(it.e.añoTxt, it.x + 70, it.yF + 34); }
      else if (it.e.icono === "cohete"){ ctx.textAlign = "left"; ctx.fillText(it.e.añoTxt, it.x + 34, it.yF + 32); }
      else if (COSMICOS.includes(it.e.icono)){
        ctx.textAlign = "left"; ctx.textBaseline = "bottom";
        ctx.fillStyle = TINTA; ctx.font = `15px ${MARCADOR}`; ctx.fillText(it.e.t, it.x + 42, it.yF + 9);
        ctx.fillStyle = "#555"; ctx.font = `600 17px ${FUENTE}`; ctx.fillText(it.e.añoTxt, it.x + 42, it.yF + 28);
        ctx.textBaseline = "top";
      }
      else ctx.fillText(it.e.añoTxt, it.x, it.yF + 58);
      ctx.restore();
      ctx.textAlign = "left";
      continue;
    }
    const r = aleatorio(it.e.id * 31 + 7);
    ctx.save();
    ctx.translate(it.x, it.yF + h / 2);
    ctx.rotate((r() - .5) * 0.07);                 // cada papel un poco torcido
    const x0 = -it.w / 2, y0 = -h / 2;
    // Papel con sombra suave
    ctx.shadowColor = "rgba(0,0,0,.16)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
    ctx.fillStyle = "#fffdf7"; ctx.fillRect(x0, y0, it.w, h);
    ctx.shadowColor = "transparent";
    // Cinta de carrocero arriba
    ctx.save(); ctx.translate((r() - .5) * it.w * .3, y0); ctx.rotate((r() - .5) * 0.5);
    ctx.fillStyle = "rgba(222,205,160,.82)"; ctx.fillRect(-22, -8, 44, 15);
    ctx.restore();
    // Texto: título a rotulador y fecha a mano
    ctx.fillStyle = TINTA;
    ctx.font = `17px ${MARCADOR}`; ctx.fillText(it.e.t, x0 + 12, y0 + 7);
    ctx.fillStyle = "#555";
    ctx.font = `600 18px ${FUENTE}`; ctx.fillText(it.pie, x0 + 12, y0 + 28);
    ctx.restore();
  }
  dibujarNombres();                                // nombres de las personas, por encima de todo
  ctx.restore();                                   // fin del desvanecido
  ctx.fillStyle = TINTA; ctx.textAlign = "center";
}

function formatoZoom(z){
  const p = z * 100;
  if (p >= 10000) return Math.round(p / 1000).toLocaleString("es-ES") + "k%";
  if (p >= 10) return Math.round(p).toLocaleString("es-ES") + "%";
  if (p >= 1) return p.toFixed(1).replace(".", ",") + "%";
  return p.toLocaleString("es-ES", { maximumSignificantDigits: 2 }) + "%";
}

// --- Redibujar solo cuando hace falta ---
let pendiente = false;
function pedir(){ if (!pendiente){ pendiente = true; requestAnimationFrame(() => { pendiente = false; dibujar(); }); } }

// --- Zoom alrededor de un punto ---
function zoomEn(x, factor){
  const a = añoDe(x);
  ppa = Math.min(PPA_MAX, Math.max(ppaMin(), ppa * factor));
  centro = a - (x - W / 2) / ppa;
  pedir();
}

cv.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.shiftKey && !e.ctrlKey){ centro += (e.deltaY || e.deltaX) / ppa; pedir(); return; }
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && !e.ctrlKey){ centro += e.deltaX / ppa; pedir(); return; }
  const k = e.ctrlKey ? 0.012 : 0.0018;      // pellizco del trackpad o rueda
  zoomEn(e.clientX, Math.exp(-e.deltaY * k));
}, { passive: false });

// Arrastrar con ratón o un dedo; pellizcar con dos dedos
const punteros = new Map();
let pellizco = null;
let inicioToque = null;
const zonaEn = (x, y) => zonas.concat(zonasPer, zonasGeo).find(z => x >= z.x0 && x <= z.x1 && y >= z.y0 && y <= z.y1);
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
  inicioToque = punteros.size === 1 ? { x: e.clientX, y: e.clientY } : null;
  cv.classList.add("arrastrando");
  if (punteros.size === 2){
    const [p1, p2] = [...punteros.values()];
    pellizco = { d: Math.hypot(p2.x - p1.x, p2.y - p1.y) };
  }
});
cv.addEventListener("pointermove", e => {
  const prev = punteros.get(e.pointerId);
  if (!prev){ cv.style.cursor = zonaEn(e.clientX, e.clientY) ? "pointer" : ""; return; }
  const act = { x: e.clientX, y: e.clientY };
  if (punteros.size === 1){
    centro -= (act.x - prev.x) / ppa;
    despY += act.y - prev.y;
    punteros.set(e.pointerId, act); pedir();
  } else if (punteros.size === 2 && pellizco){
    punteros.set(e.pointerId, act);
    const [p1, p2] = [...punteros.values()];
    const d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    if (d > 0 && pellizco.d > 0) zoomEn((p1.x + p2.x) / 2, d / pellizco.d);
    pellizco.d = d;
  }
});
const soltar = e => {
  // Clic sin arrastrar sobre un evento: abrir su resumen
  if (e.type === "pointerup" && inicioToque && punteros.size === 1 &&
      Math.hypot(e.clientX - inicioToque.x, e.clientY - inicioToque.y) < 6){
    const z = zonaEn(e.clientX, e.clientY);
    z ? abrirNota(z.e, e.clientX, e.clientY) : cerrarNota();
  }
  punteros.delete(e.pointerId);
  if (punteros.size < 2) pellizco = null;
  if (!punteros.size) cv.classList.remove("arrastrando");
};
cv.addEventListener("pointerup", soltar);
cv.addEventListener("pointercancel", soltar);

// --- Nota con el resumen ---
const nota = document.getElementById("nota");
function abrirNota(ev, x, y){
  document.getElementById("notaT").textContent = ev.t;
  document.getElementById("notaF").textContent = ev.txt + (ev.sub ? " · " + ev.sub : "");
  document.getElementById("notaR").textContent = ev.resumen;
  const mas = document.getElementById("notaMas");
  mas.style.display = ev.detalle ? "" : "none";
  mas.onclick = () => abrirDetalle(ev);
  nota.classList.add("abierta");
  const r = nota.getBoundingClientRect();
  const left = Math.min(Math.max(16, x - r.width / 2), W - r.width - 16);
  const top = y + 24 + r.height < H - 16 ? y + 24 : Math.max(16, y - r.height - 24);
  nota.style.left = left + "px"; nota.style.top = top + "px";
}
function cerrarNota(){ nota.classList.remove("abierta"); }

// --- Subpágina "quiero saber más" ---
const det = document.getElementById("detalle");
const slug = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function abrirDetalle(ev, sinHistorial){
  cerrarNota();
  document.getElementById("detT").textContent = ev.t;
  document.getElementById("detF").textContent = ev.txt + (ev.sub ? " · " + ev.sub : "");
  const cuerpo = document.getElementById("detCuerpo"); cuerpo.innerHTML = "";
  for (const sec of ev.detalle){
    const h = document.createElement("h2"); h.textContent = sec.h;
    const p = document.createElement("p"); p.className = "t"; p.textContent = sec.p;
    cuerpo.append(h);
    if (sec.foto){                               // foto real, pegada como en un álbum
      const fig = document.createElement("figure"); fig.className = "foto";
      const img = document.createElement("img");
      img.src = sec.foto.src; img.alt = sec.foto.alt || sec.h; img.loading = "lazy";
      const marco = document.createElement("div"); marco.className = "marco"; marco.append(img);
      fig.append(marco); cuerpo.append(fig);
      if (sec.foto.credito){                     // el crédito solo sale al pulsar la foto
        const cr = document.createElement("span"); cr.className = "credito"; cr.textContent = "Foto: " + sec.foto.credito;
        fig.append(cr); fig.title = "Pulsa para ver el autor";
        fig.onclick = () => fig.classList.toggle("ver");
      }
    }
    cuerpo.append(p);
  }
  det.classList.add("abierta"); det.scrollTop = 0;
  // Enlace propio (#nombre-del-evento) y el botón "atrás" del navegador cierra la subpágina
  // (en algunas vistas previas el navegador no deja tocar el historial: entonces se ignora)
  if (!sinHistorial){ try { history.pushState({ detalle: ev.id }, "", "#" + slug(ev.t)); historialOk = true; } catch (_) { historialOk = false; } }
}
let historialOk = false;
function cerrarDetalle(){ det.classList.remove("abierta"); }
document.getElementById("detVolver").onclick = () => {
  if (historialOk && history.state && history.state.detalle !== undefined){ history.back(); return; }
  cerrarDetalle();
  try { if (location.hash) history.replaceState(null, "", location.pathname + location.search); } catch (_) {}
};
window.addEventListener("popstate", () => {
  const ev = EVENTOS.concat(GEO).find(e => e.detalle && "#" + slug(e.t) === location.hash);
  ev ? abrirDetalle(ev, true) : cerrarDetalle();
});
// Si se entra con un enlace directo (#adolf-hitler, por ejemplo), abrir esa subpágina
{ const ev = EVENTOS.concat(GEO).find(e => e.detalle && "#" + slug(e.t) === location.hash); if (ev) abrirDetalle(ev, true); }
document.getElementById("cerrarNota").onclick = cerrarNota;
window.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (det.classList.contains("abierta")) document.getElementById("detVolver").click(); else cerrarNota();
});

// Botones
document.getElementById("mas").onclick = () => zoomEn(W / 2, 1.6);
if (window.innerWidth <= 600) document.getElementById("cats").open = false;   // en el móvil, plegado
for (const c of document.querySelectorAll("#cats input[data-fila]")){
  c.checked = filasActivas.has(c.dataset.fila);
  c.onchange = () => {
    if (c.checked) filasActivas.add(c.dataset.fila); else filasActivas.delete(c.dataset.fila);
    aplicarFilas(); pedir();
  };
}
document.getElementById("menos").onclick = () => zoomEn(W / 2, 1 / 1.6);
document.getElementById("nivel").onclick = () => { vistaInicial(); pedir(); };

// Teclado: + / - / 0 y flechas
window.addEventListener("keydown", e => {
  if (e.key === "+" || e.key === "=") zoomEn(W / 2, 1.4);
  else if (e.key === "-") zoomEn(W / 2, 1 / 1.4);
  else if (e.key === "0"){ vistaInicial(); pedir(); }
  else if (e.key === "ArrowRight"){ centro += 120 / ppa; pedir(); }
  else if (e.key === "ArrowLeft"){ centro -= 120 / ppa; pedir(); }
});

window.addEventListener("resize", () => {
  const z = ppa / ppaInicial; tamaño(); ppaInicial = W / 5000; ppa = ppaInicial * z; pedir();
});

tamaño(); vistaInicial(); dibujar();
// Redibujar cuando cargue la tipografía
if (document.fonts) document.fonts.ready.then(pedir);
</script>
