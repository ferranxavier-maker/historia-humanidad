      { h: "No la hicieron esclavos", p: "Junto a las pirámides se excavó un poblado de trabajadores, con panaderías, cervecerías y cementerios propios. Los obreros estaban organizados en cuadrillas con nombres, comían carne con regularidad y recibían atención médica: hay esqueletos con fracturas curadas. Muchos serían trabajadores permanentes, con campesinos que se turnaban en la obra." },
      { h: "El conjunto de Guiza", p: "Junto a la de Keops están la pirámide de su hijo Kefrén (Jafra), que parece más alta porque está en un terreno más elevado, y la de Micerino (Menkaura), mucho más pequeña, además de pirámides menores de reinas, templos y la Gran Esfinge, atribuida normalmente a Kefrén. Todo el conjunto es Patrimonio de la Humanidad desde 1979." }
    ] },
  // Personas: nace + f (muerte) → tramo de su vida con su cara en medio
  { f: "-13800000000", fila: "hitos", t: "El Big Bang", icono: "bigbang", nivel: 1, siempre: true,
    fechaTxt: "hace c. 13.800 millones de años",
    resumen: "Hace unos 13.800 millones de años, todo el universo observable estaba concentrado en un estado extremadamente caliente y denso, y empezó a expandirse y enfriarse. No fue una explosión en un punto del espacio, sino la expansión del propio espacio, que sigue hasta hoy. De ahí salieron, con el tiempo, los átomos, las estrellas, las galaxias y, mucho después, el Sol y la Tierra.",
    detalle: [
      { h: "¿Qué fue?", p: "El Big Bang («gran explosión») no fue una explosión de materia en un espacio vacío, sino el inicio de la expansión del propio espacio. Al principio, todo lo que hoy forma el universo observable estaba a una temperatura y una densidad enormes. Al expandirse, el universo se fue enfriando, y eso permitió que se formaran, por orden, las partículas, los núcleos de los átomos, los átomos y, mucho después, las estrellas y las galaxias." },
      { h: "Cómo lo sabemos: el universo se expande", p: "En 1927, el sacerdote y físico belga Georges Lemaître propuso que el universo se expandía y que, yendo hacia atrás, debía de haber empezado en un «átomo primigenio». En 1929, Edwin Hubble mostró que las galaxias lejanas se alejan de nosotros, y más deprisa cuanto más lejos están. El nombre de Big Bang se lo puso en 1949, medio en broma, el astrónomo Fred Hoyle, que no creía en la teoría." },
      { h: "El eco del Big Bang", p: "En 1965, Arno Penzias y Robert Wilson detectaron por casualidad un ruido de microondas que llegaba de todas las direcciones del cielo: el fondo cósmico de microondas, la luz que quedó libre cuando el universo tenía unos 380.000 años y se hizo transparente. Fue la gran confirmación del Big Bang, y les valió el Nobel de Física en 1978. Satélites como COBE, WMAP y Planck lo han medido con muchísima precisión." },
      { h: "Los primeros minutos", p: "En los tres primeros minutos se formaron los núcleos de los elementos más ligeros: sobre todo hidrógeno y helio, con algo de litio. Las proporciones que predice la teoría coinciden con las que observamos hoy en el universo, otra de sus grandes pruebas. Los elementos más pesados, como el carbono, el oxígeno o el hierro de nuestro cuerpo, se fabricaron mucho después, dentro de las estrellas." },
      { h: "Estrellas y galaxias", p: "Tras unos cientos de millones de años de oscuridad, la gravedad juntó el gas en nubes que se encendieron como las primeras estrellas, y estas se agruparon en galaxias. El telescopio espacial James Webb, lanzado en 2021, está observando galaxias que ya existían cuando el universo tenía unos pocos cientos de millones de años." },
      { h: "Lo que aún no sabemos", p: "La teoría describe muy bien la evolución del universo desde una fracción de segundo después del inicio, pero no qué pasó exactamente en el primer instante ni si hubo un «antes». Tampoco sabemos qué son la materia oscura y la energía oscura, que juntas forman alrededor del 95 % del universo. La cifra de 13.800 millones de años sale sobre todo de las medidas del fondo cósmico de microondas." }
    ] },
  { f: "-13600000000", fila: "personas", t: "Primeras estrellas", icono: "estrellas", nivel: 1, siempre: true,
    fechaTxt: "hace c. 13.600 millones de años",
    resumen: "Unos 100 a 200 millones de años después del Big Bang, la gravedad juntó el gas de hidrógeno y helio en nubes que se encendieron como las primeras estrellas. Eran enormes, de decenas a cientos de veces la masa del Sol, muy calientes y de vida muy corta. Al morir, muchas en explosiones, sembraron el universo de los primeros elementos pesados.",
    detalle: [
      { h: "La edad oscura", p: "Tras el Big Bang, cuando el universo se enfrió lo suficiente para formar átomos, quedó lleno de gas de hidrógeno y helio, pero sin nada que brillara: es lo que se llama la «edad oscura» del universo. Durante unos cien millones de años, la gravedad fue juntando poco a poco el gas en las zonas algo más densas." },
      { h: "Se encienden las luces", p: "Cuando esas nubes se hicieron lo bastante densas y calientes, en su centro empezó la fusión nuclear: nacieron las primeras estrellas, hace unos 13.600 millones de años (la fecha exacta no se conoce). Los astrónomos las llaman estrellas de población III." },
      { h: "Gigantes de vida corta", p: "Como no había elementos pesados que ayudaran a enfriar el gas, las nubes no se fragmentaban fácilmente y las estrellas que nacían eran enormes: según los modelos, de decenas a cientos de veces la masa del Sol. Cuanto más grande es una estrella, más deprisa consume su combustible: vivían solo unos pocos millones de años." },
      { h: "Las fábricas de elementos", p: "En su interior fabricaron por primera vez elementos como el carbono, el oxígeno o el hierro, y al morir, a menudo como supernovas, los esparcieron por el espacio. Con ese material se formaron las siguientes generaciones de estrellas, y mucho después, el Sol, la Tierra y nosotros: estamos hechos de polvo de estrellas." },
      { h: "Nunca las hemos visto", p: "Ninguna estrella de primera generación se ha observado directamente: están demasiado lejos y hace mucho que murieron. Sabemos de ellas por la teoría y por sus huellas en las estrellas más viejas que conocemos, que tienen muy pocos elementos pesados. El telescopio espacial James Webb las está buscando en las galaxias más lejanas." }
    ] },
  { f: "-13500000000", fila: "libros", t: "Vía Láctea", icono: "galaxia", nivel: 1, siempre: true,
    fechaTxt: "hace c. 13.500 millones de años",
    resumen: "Nuestra galaxia empezó a formarse muy pronto: sus estrellas más antiguas tienen unos 13.500 millones de años. Después fue creciendo durante miles de millones de años, absorbiendo galaxias más pequeñas, y formó el disco y los brazos espirales que vemos hoy. Tiene entre 100.000 y 400.000 millones de estrellas, y el Sol es una de ellas.",
    detalle: [
      { h: "Nuestra galaxia", p: "La Vía Láctea es una galaxia espiral barrada de unos 100.000 años luz de diámetro, con entre 100.000 y 400.000 millones de estrellas. Su nombre viene de la mitología griega: la franja blanquecina que cruza el cielo nocturno sería leche derramada por la diosa Hera. Lo que vemos en realidad es el disco de la galaxia, de canto, desde dentro." },
      { h: "Un nacimiento muy temprano", p: "Las estrellas más antiguas de la Vía Láctea, que están sobre todo en el halo y en los cúmulos globulares que la rodean, tienen unos 13.000 a 13.500 millones de años: nuestra galaxia ya estaba formándose pocos cientos de millones de años después del Big Bang." },
      { h: "Creció comiéndose a otras", p: "Las galaxias crecen fusionándose. Gracias al satélite Gaia, de la Agencia Espacial Europea, se descubrió en 2018 que hace unos 10.000 millones de años la Vía Láctea absorbió una galaxia bastante grande, llamada Gaia-Encélado; todavía se ven sus estrellas moviéndose de forma distinta. Hoy sigue engullendo galaxias pequeñas, como la galaxia enana de Sagitario." },
      { h: "El agujero negro del centro", p: "En el centro de la Vía Láctea hay un agujero negro supermasivo, Sagitario A*, de unos 4 millones de veces la masa del Sol. Reinhard Genzel y Andrea Ghez recibieron el Nobel de Física en 2020 por demostrar su existencia siguiendo las órbitas de las estrellas cercanas, y en 2022 el Event Horizon Telescope publicó la primera imagen de su sombra." },
      { h: "Dónde estamos", p: "El Sol está a unos 26.000 años luz del centro, en un brazo menor, el brazo de Orión, y tarda unos 230 millones de años en dar una vuelta completa a la galaxia. Dentro de unos 4.500 millones de años, la Vía Láctea chocará y se fusionará con su vecina, la galaxia de Andrómeda." }
    ] },
  { f: "-4567000000", fila: "personas", t: "Nace el Sol", icono: "solJoven", nivel: 1, siempre: true, paso: 1,
    fechaTxt: "hace c. 4.600 millones de años",
    resumen: "El Sol nació hace unos 4.600 millones de años, cuando una nube de gas y polvo de la Vía Láctea se contrajo por su propia gravedad. En el centro se encendió la fusión nuclear y alrededor quedó un disco de material del que, en pocas decenas de millones de años, se formaron los planetas, entre ellos la Tierra. Es una estrella de segunda o tercera generación: contiene restos de estrellas anteriores.",
    detalle: [
      { h: "Una nube que se contrae", p: "Hace unos 4.600 millones de años, en un brazo de la Vía Láctea, una nube de gas y polvo empezó a contraerse, quizá empujada por la onda de choque de una supernova cercana. Al encogerse, giraba cada vez más deprisa y se aplanaba en forma de disco, con la mayor parte de la materia concentrada en el centro." },
      { h: "Se enciende", p: "En el centro, la presión y la temperatura subieron hasta que el hidrógeno empezó a fusionarse en helio: nació el Sol. La edad se calcula con mucha precisión gracias a los granos más antiguos de algunos meteoritos, que tienen unos 4.567 millones de años y se consideran los primeros sólidos del sistema solar." },
      { h: "Hecho de restos de estrellas", p: "El Sol no es una estrella de primera generación: además de hidrógeno y helio contiene pequeñas cantidades de elementos más pesados, como carbono, oxígeno o hierro, que solo pudieron fabricarse dentro de estrellas anteriores que ya habían muerto. Lo mismo vale para la Tierra y para nosotros." },
      { h: "El disco de los planetas", p: "Del disco que quedó alrededor del Sol nacieron los planetas: cerca, donde hacía calor, los rocosos (Mercurio, Venus, la Tierra y Marte); más lejos, donde el hielo podía existir, los gigantes de gas y hielo (Júpiter, Saturno, Urano y Neptuno). Los restos que sobraron son los asteroides y los cometas." },
      { h: "Una estrella corriente", p: "El Sol es una estrella bastante normal, una enana amarilla. Contiene más del 99 % de la masa de todo el sistema solar, y su luz tarda unos 8 minutos y 20 segundos en llegar a la Tierra. Está más o menos a mitad de su vida: le quedan unos 5.000 millones de años antes de convertirse en una gigante roja." }
    ] },
  { f: "-539000000", fila: "hitos", t: "Animales con concha", icono: "trilobites", nivel: 1, paso: 12,
    fechaTxt: "hace c. 539 millones de años",
    resumen: "Hace unos 539 millones de años, al principio del Cámbrico, aparecieron en pocos millones de años casi todos los grandes grupos de animales actuales: la explosión cámbrica. Muchos tenían ya conchas, caparazones y ojos. Los más típicos eran los trilobites. Todo estaba en el mar.",
    detalle: [
      { h: "La explosión cámbrica", p: "En unos 20 o 25 millones de años, muy poco en geología, aparecieron los antepasados de los artrópodos, los moluscos, los gusanos, los equinodermos y los primeros cordados, de donde venimos los vertebrados. Las fechas son aproximadas." },
      { h: "Conchas y caparazones", p: "Las partes duras (conchas, caparazones, espinas) servían de protección frente a los primeros depredadores. Además se fosilizan bien, y por eso a partir de aquí el registro fósil se vuelve mucho más rico." },
      { h: "Los trilobites", p: "Artrópodos marinos con el cuerpo dividido en tres lóbulos a lo largo, de ahí su nombre. Hubo miles de especies y vivieron unos 270 millones de años, hasta la extinción del Pérmico." },
      { h: "Burgess Shale y Chengjiang", p: "En estos yacimientos de Canadá y China se conservan hasta las partes blandas de los animales del Cámbrico, algo excepcional." }
    ] },
  { f: "-375000000", fila: "hitos", t: "Primeros anfibios", icono: "anfibio", nivel: 1, paso: 14,
    fechaTxt: "hace c. 375 millones de años",
    resumen: "En el Devónico, hace unos 375 millones de años (fecha aproximada), algunos peces con aletas carnosas desarrollaron patas y empezaron a salir del agua. De ellos vienen los anfibios y, después, todos los vertebrados terrestres, incluidos nosotros.",
    detalle: [
      { h: "De aleta a pata", p: "Tiktaalik, de hace unos 375 millones de años, era un pez con cuello, pulmones y aletas con huesos parecidos a los de un brazo. Poco después, animales como Acanthostega e Ichthyostega ya tenían patas con dedos, aunque seguían viviendo sobre todo en el agua." },
      { h: "Atados al agua", p: "Los anfibios respiran en parte por la piel y ponen huevos sin cáscara, que se secan fuera del agua. Por eso tienen que volver a ella para reproducirse, como las ranas y las salamandras actuales." },
      { h: "El Carbonífero", p: "En los bosques pantanosos del Carbonífero hubo anfibios de varios metros de largo." }
    ] },
  { f: "-312000000", fila: "hitos", t: "Primeros reptiles", icono: "reptil", nivel: 1, paso: 14,
    fechaTxt: "hace c. 312 millones de años",
    resumen: "Hace unos 312 millones de años, en el Carbonífero, aparecieron los primeros reptiles, pequeños animales parecidos a lagartijas. Su gran novedad fue el huevo con cáscara, que les permitió reproducirse lejos del agua. De ellos salieron más tarde los dinosaurios.",
    detalle: [
      { h: "Hylonomus", p: "Uno de los reptiles más antiguos que se conocen. Medía unos 20 centímetros y se encontró en Nueva Escocia (Canadá), dentro de troncos fósiles de árboles del Carbonífero." },
      { h: "El huevo con cáscara", p: "El huevo amniota tiene membranas y una cáscara que protegen al embrión y evitan que se seque. Con él, los vertebrados pudieron colonizar del todo la tierra firme." },
      { h: "Sus descendientes", p: "De los primeros reptiles salieron los dinosaurios, las aves, los cocodrilos, las tortugas, los lagartos y las serpientes. De un grupo cercano salieron los antepasados de los mamíferos." }
    ] },
  { f: "-205000000", fila: "hitos", t: "Primeros mamíferos", icono: "mamifero", nivel: 1, paso: 15,
    fechaTxt: "hace c. 205 millones de años",
    resumen: "Los primeros mamíferos, o sus parientes más cercanos, aparecieron a finales del Triásico, más o menos a la vez que los primeros dinosaurios. Eran pequeños, del tamaño de una musaraña, y probablemente nocturnos. Morganucodon, de hace unos 205 millones de años, es uno de los más conocidos. Las fechas son aproximadas.",
    detalle: [
      { h: "De los «reptiles mamiferoides»", p: "Los mamíferos vienen de los cinodontos, un grupo de animales del Pérmico y el Triásico que ya tenían rasgos de mamífero, como dientes de distintos tipos y, probablemente, pelo." },
      { h: "Pequeños y de noche", p: "Durante los más de 150 millones de años que dominaron los dinosaurios, casi todos los mamíferos fueron pequeños. Se cree que muchos eran nocturnos, lo que favoreció un buen oído, un buen olfato y la sangre caliente." },
      { h: "Leche y pelo", p: "Lo que define a un mamífero es que las crías se alimentan con leche y que tienen pelo, además de tres huesecillos en el oído medio, que vienen de huesos de la mandíbula de sus antepasados." },
      { h: "Su gran oportunidad", p: "Tras el asteroide de hace 66 millones de años, con los grandes dinosaurios desaparecidos, los mamíferos se diversificaron y se hicieron grandes. De ellos venimos los humanos." }
    ] },
  { f: "-56000000", fila: "hitos", t: "Primeros primates", icono: "primate", nivel: 1, paso: 25,
    fechaTxt: "hace c. 56 millones de años",
    resumen: "Tras la desaparición de los grandes dinosaurios, entre los mamíferos que se diversificaron estaban los primeros primates: pequeños animales de los árboles, parecidos a los lémures actuales, con manos que agarraban y ojos mirando hacia delante. Los primeros seguros tienen unos 56 millones de años; puede que el grupo sea algo más antiguo.",
    detalle: [
      { h: "Hechos para los árboles", p: "Manos y pies con dedos que agarran, uñas en lugar de garras y ojos al frente para calcular distancias al saltar de rama en rama. Son rasgos que seguimos teniendo nosotros." },
      { h: "Sus parientes de hoy", p: "Los lémures de Madagascar y los loris de Asia y África son los primates actuales más parecidos a aquellos primeros." }
    ] },
  { f: "-40000000", fila: "hitos", t: "Primates superiores", icono: "mono", nivel: 1, paso: 27,
    fechaTxt: "hace c. 40 millones de años",
    resumen: "Los primates superiores o antropoides (monos y simios) aparecieron hace unos 40 millones de años, probablemente en Asia o en África (fecha aproximada). Tenían el cerebro más grande y eran de vida diurna. De ellos salieron los monos de América, los de África y Asia y, hace unos 25 millones de años, los simios, el grupo al que pertenecemos.",
    detalle: [
      { h: "Monos y simios", p: "Los monos suelen tener cola; los simios (gibones, orangutanes, gorilas, chimpancés y humanos) no la tienen y tienen un cerebro mayor." },
      { h: "Nuestros primos", p: "Los parientes vivos más cercanos de los humanos son los chimpancés y los bonobos. Nuestros linajes se separaron hace unos 6 o 7 millones de años." }
    ] },
  { f: "-5000000", fila: "hitos", t: "Mamuts", icono: "mamut", nivel: 1, paso: 28,
    fechaTxt: "hace c. 5 millones de años",
    resumen: "Los mamuts aparecieron hace unos 5 millones de años en África (fecha aproximada) y desde allí se extendieron por Eurasia y América. El mamut lanudo, adaptado al frío de las glaciaciones, surgió hace unos 400.000 a 200.000 años. Casi todos desaparecieron hace unos 10.000 años.",
    detalle: [
      { h: "Parientes de los elefantes", p: "Eran proboscídeos, como los elefantes actuales, y su pariente vivo más cercano es el elefante asiático. Los primeros mamuts vivían en climas templados; con el tiempo, algunas especies se adaptaron al frío." },
      { h: "El mamut lanudo", p: "Tenía pelo largo y espeso, orejas pequeñas, una capa de grasa bajo la piel y unos colmillos curvados que podían superar los 4 metros. Vivía en la estepa helada de Europa, Asia y Norteamérica durante las glaciaciones." },
      { h: "Con los humanos", p: "Convivió con los neandertales y con el Homo sapiens, que los cazaban y aprovechaban su carne, su piel, sus huesos y sus colmillos. Aparecen pintados en cuevas como Rouffignac, en Francia." },
      { h: "Los últimos", p: "Casi todos desaparecieron hace unos 10.000 años, al final de la última glaciación, probablemente por el cambio de clima y la caza. Una población aislada sobrevivió en la isla de Wrangel, en el Ártico ruso, hasta hace unos 4.000 años." }
    ] },
  { f: "-4200000", fila: "hitos", t: "Australopithecus", icono: "australopiteco", nivel: 1, paso: 28, ficha: "Australopithecus",
    fechaTxt: "hace c. 4,2 millones de años" },
  { f: "-3000000", fila: "hitos", t: "La Tierra hoy", icono: "tierraHoy", nivel: 1, paso: 28, ficha: "Los continentes se separan",
    fechaTxt: "hace c. 3 millones de años" },
  { f: "-1900000", fila: "hitos", t: "Homo erectus", icono: "erectus", nivel: 1, paso: 29, ficha: "Homo erectus",
    fechaTxt: "hace c. 1,9 millones de años" },
  { f: "-400000", fila: "hitos", t: "Neandertales", icono: "neandertal", nivel: 1, paso: 39, ficha: "Neandertales",
    fechaTxt: "hace c. 400.000 años" },
  { f: "-300000", fila: "hitos", t: "Homo sapiens", icono: "sapiens", nivel: 1, paso: 31, ficha: "Homo sapiens",
    fechaTxt: "hace c. 300.000 años" },
  { f: "-12500", fila: "inventos", t: "Natufienses", icono: "poblado", nivel: 1, paso: 33,
    fechaTxt: "c. 12.500 a.C.",
    resumen: "La cultura natufiense, en el Levante (actuales Israel, Palestina, Jordania, Siria y Líbano), entre el 12.500 y el 9.500 a.C. aproximadamente, levantó algunos de los primeros poblados estables. Vivían todo el año en aldeas, pero aún no cultivaban: recogían cereales silvestres. Fueron la transición entre los cazadores-recolectores nómadas y los primeros agricultores.",
    detalle: [
      { h: "Aldeas antes de la agricultura", p: "Vivían en casas redondas semienterradas con base de piedra, agrupadas en aldeas como Ain Mallaha (Eynan), en el norte de Israel. Es uno de los primeros casos conocidos de gente que deja de ser nómada sin ser todavía agricultora." },
      { h: "Cereales silvestres", p: "Recogían trigo y cebada salvajes con hoces de hojas de sílex y los molían con morteros y manos de piedra. Esa forma de vida preparó el paso a la agricultura del Neolítico en el Creciente Fértil." },
      { h: "El pan más antiguo", p: "En Shubayqa 1 (Jordania) se encontraron restos carbonizados de pan de hace unos 14.400 años, de antes de que existiera la agricultura." },
      { h: "Tumbas y perros", p: "Enterraban a sus muertos dentro de las casas o junto a ellas, a veces con adornos de conchas. En una tumba de Ain Mallaha apareció una persona enterrada con un cachorro, uno de los primeros indicios de perro doméstico." },
      { h: "Lo que vino después", p: "Con el frío brusco del Dryas Reciente, hacia el 10.900 a.C., algunos grupos volvieron a moverse más. Sus descendientes fueron los primeros agricultores del Neolítico." }
    ] },
  { f: "-445000000", fila: "personas", t: "Extinción del Ordovícico", icono: "calavera", nivel: 1, paso: 13,
    fechaTxt: "hace c. 445 millones de años",
    resumen: "La primera de las cinco grandes extinciones. Hace unos 445 millones de años, una glaciación enfrió el planeta, bajó el nivel del mar y secó las plataformas marinas donde vivía casi toda la vida, que entonces estaba en el mar. Desapareció en torno al 85 % de las especies.",
    detalle: [
      { h: "Qué pasó", p: "A finales del Ordovícico, el supercontinente Gondwana estaba sobre el polo sur y se cubrió de hielo. El agua quedó atrapada en los glaciares, el nivel del mar bajó y los mares poco profundos, llenos de trilobites, braquiópodos y otros animales marinos, se secaron o se enfriaron. Cuando el hielo se fundió, el cambio brusco provocó una segunda oleada de extinciones." },
      { h: "Las cinco grandes", p: "Los paleontólogos hablan de cinco grandes extinciones masivas: la del Ordovícico (hace c. 445 millones de años), la del Devónico tardío (c. 372), la del Pérmico (252), la del Triásico (201) y la del Cretácico (66), la del asteroide. Muchos científicos creen que hoy, por la acción humana, podría estar empezando una sexta." }
    ] },
  { f: "-372000000", fila: "personas", t: "Extinción del Devónico", icono: "calavera", nivel: 1, paso: 14,
    fechaTxt: "hace c. 372 millones de años",
    resumen: "La segunda gran extinción, a finales del Devónico, hace unos 372 millones de años. Afectó sobre todo a la vida marina: desaparecieron los grandes arrecifes y muchos peces acorazados. Fue un proceso largo, quizá de varios millones de años, y sus causas no están claras.",
    detalle: [
      { h: "Una crisis en los mares", p: "Se perdió en torno al 75 % de las especies. Los grandes arrecifes, formados entonces por corales y esponjas, prácticamente desaparecieron, y con ellos muchos peces placodermos, peces con armadura como el enorme Dunkleosteus. Los mares se quedaron en muchos lugares sin oxígeno." },
      { h: "¿Por qué?", p: "No se sabe con certeza. Entre las hipótesis están los cambios de clima, grandes erupciones volcánicas y, curiosamente, la expansión de los primeros bosques: al aparecer las plantas con raíces profundas, aumentó la erosión de los suelos y llegaron muchos nutrientes al mar, lo que pudo provocar zonas sin oxígeno." }
    ] },
  { f: "-251902000", fila: "personas", t: "Extinción del Pérmico", icono: "calavera", nivel: 1, paso: 15,
    fechaTxt: "hace 252 millones de años",
    resumen: "La mayor extinción de la historia de la Tierra, hace 252 millones de años, al final del Pérmico. Desapareció en torno al 90 % de las especies marinas y alrededor del 70 % de los vertebrados terrestres; por eso se la llama «la Gran Mortandad». La causa principal fueron gigantescas erupciones volcánicas en Siberia.",
    detalle: [
      { h: "Los traps siberianos", p: "Durante unos cientos de miles de años, enormes erupciones en lo que hoy es Siberia cubrieron millones de kilómetros cuadrados de lava. Liberaron cantidades inmensas de dióxido de carbono y otros gases, que calentaron el planeta varios grados, acidificaron los océanos y dejaron grandes zonas del mar sin oxígeno." },
      { h: "La Gran Mortandad", p: "Es la única extinción masiva que afectó gravemente incluso a los insectos. Desaparecieron los últimos trilobites, que habían vivido casi 300 millones de años. La vida tardó millones de años en recuperarse." },
      { h: "Lo que vino después", p: "De los supervivientes salieron los grupos que dominarían el Mesozoico: en el Triásico aparecieron los primeros dinosaurios y los primeros mamíferos. Con esta extinción termina la era Paleozoica y empieza la Mesozoica." }
    ] },
  { f: "-201400000", fila: "personas", t: "Extinción del Triásico", icono: "calavera", nivel: 1, paso: 15,
    fechaTxt: "hace c. 201 millones de años",
    resumen: "La cuarta gran extinción, al final del Triásico, hace unos 201 millones de años. Coincidió con grandes erupciones volcánicas cuando Pangea empezaba a partirse y nacía el océano Atlántico. Desapareció en torno al 75 % de las especies, y los dinosaurios, que sobrevivieron, se quedaron sin muchos de sus competidores.",
    detalle: [
      { h: "Pangea se rompe", p: "La extinción coincide con las erupciones de la llamada Provincia Magmática del Atlántico Central, ligadas a la ruptura de Pangea. Sus restos se encuentran hoy repartidos entre América, África y Europa. Los gases volcánicos cambiaron el clima y la química de los océanos." },
      { h: "La oportunidad de los dinosaurios", p: "Desaparecieron muchos grupos de reptiles grandes emparentados con los cocodrilos, que hasta entonces competían con los dinosaurios. Tras la extinción, los dinosaurios se convirtieron en los animales terrestres dominantes durante todo el Jurásico y el Cretácico." }
    ] },
  { f: "-66000000", fila: "hitos", t: "Asteroide de Chicxulub", icono: "asteroide", nivel: 1, paso: 24,
    fechaTxt: "hace 66 millones de años",
    resumen: "Hace 66 millones de años, un asteroide de unos 10 kilómetros chocó contra la Tierra en la actual península de Yucatán (México). El impacto, los incendios y los años de oscuridad y frío que siguieron provocaron la extinción de alrededor del 75 % de las especies, entre ellas todos los dinosaurios no voladores. Tras ella, los mamíferos se extendieron y diversificaron.",
    detalle: [
      { h: "El impacto", p: "El asteroide, de unos 10 kilómetros de diámetro, chocó a decenas de kilómetros por segundo contra un mar poco profundo frente a la costa de Yucatán. Liberó una energía equivalente a miles de millones de bombas atómicas, abrió un cráter de unos 180 kilómetros de ancho y provocó tsunamis gigantescos y terremotos en todo el planeta." },
      { h: "El invierno de impacto", p: "Una enorme cantidad de roca vaporizada, hollín de los incendios y gases de azufre llegó a la atmósfera y tapó la luz del Sol durante años. Las plantas dejaron de hacer la fotosíntesis, las temperaturas cayeron y las cadenas alimentarias se hundieron, tanto en tierra como en el mar." },
      { h: "Cómo se descubrió", p: "En 1980, el físico Luis Álvarez y su hijo, el geólogo Walter Álvarez, encontraron en rocas de Gubbio (Italia), justo en el límite entre el Cretácico y el Paleógeno, una fina capa de arcilla con muchísimo iridio, un metal raro en la superficie de la Tierra pero abundante en los asteroides. Propusieron que un impacto había causado la extinción. El cráter, enterrado bajo sedimentos, se identificó a principios de los años noventa." },
      { h: "¿Solo el asteroide?", p: "En la misma época había enormes erupciones volcánicas en la India, las de los traps del Decán, que también alteraron el clima. Se ha discutido mucho qué papel tuvieron, pero la mayoría de los especialistas consideran que el impacto fue la causa principal de la extinción." },
      { h: "Lo que vino después", p: "Con los grandes dinosaurios fuera de juego, los mamíferos, que hasta entonces eran sobre todo pequeños, ocuparon los nichos vacíos y se diversificaron muchísimo. Sin aquel asteroide, probablemente nuestra rama de primates, y por tanto nosotros, no habría existido." }
    ] },
  { f: "-4540000000", fila: "hitos", t: "Nace la Tierra", icono: "tierra", nivel: 1, siempre: true, paso: 2, textoIzq: true,
    fechaTxt: "hace c. 4.540 millones de años",
    resumen: "La Tierra se formó hace unos 4.540 millones de años (con un margen de unos 50 millones), a partir del disco de gas y polvo que rodeaba al Sol recién nacido. Al principio era una bola de roca fundida, bombardeada por meteoritos. Poco después, el choque con un cuerpo del tamaño de Marte, al que se llama Tea, lanzó al espacio los restos con los que se formó la Luna.",
    detalle: [
      { h: "Del polvo a un planeta", p: "Hace unos 4.600 millones de años, una nube de gas y polvo se contrajo y dio lugar al Sol. A su alrededor quedó un disco de material en el que los granos de polvo fueron chocando y pegándose: primero piedras, luego rocas de kilómetros y, en unas decenas de millones de años, planetas. Así se formó la Tierra, junto con el resto de planetas rocosos." },
      { h: "Un infierno de lava", p: "La joven Tierra estaba tan caliente, por los impactos y la radiactividad de su interior, que su superficie era un océano de magma. Los materiales más pesados, como el hierro, se hundieron hacia el centro y formaron el núcleo; los más ligeros quedaron arriba y, al enfriarse, formaron la primera corteza. A esta primera etapa se la llama eón Hádico, por Hades, el inframundo griego." },
      { h: "El choque que creó la Luna", p: "La explicación más aceptada es que, pocas decenas de millones de años después de formarse, la Tierra chocó con un planeta del tamaño de Marte, al que se ha llamado Tea. El impacto fundió buena parte de ambos y lanzó al espacio una enorme nube de restos que acabó uniéndose en la Luna. Las rocas que trajeron las misiones Apolo, muy parecidas a las de la Tierra, apoyan esta idea." },
      { h: "¿Cómo sabemos su edad?", p: "Por la desintegración radiactiva de elementos como el uranio, que se transforma en plomo a un ritmo conocido. En 1956, el geoquímico Clair Patterson calculó, a partir de meteoritos, una edad de unos 4.550 millones de años, muy cerca de la que se acepta hoy. Los minerales terrestres más antiguos que se conocen, unos pequeños cristales de circón de Jack Hills (Australia), tienen unos 4.400 millones de años." },
      { h: "Agua y vida", p: "Al enfriarse la Tierra, el vapor de agua de la atmósfera se condensó y llovió durante muchísimo tiempo hasta formar los océanos; parte del agua pudo llegar también en meteoritos y cometas. Las pruebas más antiguas aceptadas de vida, microorganismos y estructuras como los estromatolitos, tienen unos 3.500 millones de años, y algunas pistas podrían ser aún más antiguas." }
    ] },
  { f: "5000002026", fila: "hitos", t: "La muerte del Sol", icono: "sol", nivel: 1, siempre: true,
    fechaTxt: "dentro de c. 5.000 millones de años",
    resumen: "Dentro de unos 5.000 millones de años, el Sol agotará el hidrógeno de su núcleo y se hinchará hasta convertirse en una gigante roja, tragándose Mercurio y Venus y, probablemente, la Tierra. Después expulsará sus capas exteriores y quedará como una enana blanca que se irá apagando poco a poco. Pero la Tierra dejará de ser habitable mucho antes, dentro de unos 1.000 millones de años.",
    detalle: [
      { h: "El Sol, hoy", p: "El Sol tiene unos 4.600 millones de años y está más o menos a mitad de su vida «normal». En su núcleo, a unos 15 millones de grados, fusiona hidrógeno y lo convierte en helio, y esa energía es la que nos llega como luz y calor." },
      { h: "Cada vez brilla más", p: "A medida que en su núcleo se acumula helio, el Sol se va calentando y brillando más: aproximadamente un 10 % más cada 1.000 millones de años. Dentro de unos 1.000 millones de años, ese calor extra hará que los océanos empiecen a evaporarse y la Tierra dejará de ser habitable, mucho antes del final del propio Sol. Las estimaciones exactas varían según los modelos." },
      { h: "La gigante roja", p: "Dentro de unos 5.000 millones de años se le acabará el hidrógeno del núcleo. El núcleo se contraerá y calentará, y las capas exteriores se hincharán enormemente: el Sol se convertirá en una gigante roja, entre 100 y 200 veces más grande que ahora, y miles de veces más luminoso. Mercurio y Venus serán engullidos." },
      { h: "¿Y la Tierra?", p: "No está del todo claro. Al hincharse, el Sol perderá masa y su gravedad será menor, así que las órbitas de los planetas se alejarán. Pero la fricción con las capas exteriores del Sol y las fuerzas de marea podrían frenar a la Tierra y arrastrarla hacia dentro. Muchos estudios concluyen que lo más probable es que acabe engullida; en cualquier caso, quedaría convertida en una roca calcinada." },
      { h: "Nebulosa planetaria y enana blanca", p: "Tras una fase en la que quemará helio, el Sol expulsará sus capas exteriores, que formarán una nube de gas brillante, una nebulosa planetaria, durante unas decenas de miles de años. En el centro quedará el núcleo desnudo: una enana blanca del tamaño de la Tierra pero con más de la mitad de la masa actual del Sol, tan densa que una cucharada pesaría toneladas. Sin combustible, se irá enfriando lentamente durante muchísimo tiempo." },

const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
// Fecha → año con decimales (para colocarlo en la línea) y texto a mostrar
function leerFecha(f){
  const neg = f.startsWith("-");
  const [a, m, d] = (neg ? f.slice(1) : f).split("-").map(Number);
  const año = neg ? -a : a;
  const frac = m ? ((m - 1) + (d ? (d - 1) / 31 : 0)) / 12 : 0.5;
  const txtA = neg ? `${a.toLocaleString("es-ES")} a.C.` : String(a);
  const txt = d ? `${d} ${MESES[m - 1]} ${txtA}` : m ? `${MESES[m - 1]} ${txtA}` : txtA;
  return { año: año + frac, txt };
}
EVENTOS.forEach((e, i) => {
  Object.assign(e, leerFecha(e.f)); e.id = i;
  if (e.desde){                                  // periodo: de "desde" a "f"
    const d = leerFecha(e.desde);
    e.añoDesde = d.año; e.añoHasta = e.año;
    if (e.desvanece) e.añoDesvanece = leerFecha(e.desvanece).año;
    if (e.solidoDesde) e.añoSolido = leerFecha(e.solidoDesde).año;   // inicio difuso: se aclara hacia "desde"
    const soloAño = f => f.startsWith("-") ? f.slice(1).split("-")[0] + " a.C." : f.split("-")[0] + (e.desde.startsWith("-") ? " d.C." : "");
    e.txt = e.fechas || `${soloAño(e.desde)} – ${soloAño(e.f)}`;   // "fechas": texto propio si hace falta
    e.año = (e.añoDesde + e.añoHasta) / 2;
  }
  if (e.nace){                                   // persona: tramo de vida
    const n = leerFecha(e.nace);
    e.añoNace = n.año; e.añoMuere = e.año;
    const c = e.aprox ? "c. " : "", cN = (e.aprox || e.aproxNace) ? "c. " : "";
    const dC = (txt, f) => (n.txt.includes("a.C.") && !f.startsWith("-") ? txt + " d.C." : txt);
    e.txt = `${cN}${n.txt} – ${c}${dC(e.txt, e.f)}`;
    // Años cortos para la etiqueta del tramo
    const soloAño = f => f.startsWith("-") ? f.slice(1).split("-")[0] + " a.C." : f.split("-")[0];
    const quitaAC = s => (s.endsWith(" a.C.") && e.f.startsWith("-") ? s.slice(0, -5) : s);  // "470–399 a.C."
    e.etiqueta = `${e.corto || e.t} · ${cN}${quitaAC(soloAño(e.nace))}–${c}${dC(soloAño(e.f), e.f)}`;
    e.año = (e.añoNace + e.añoMuere) / 2;        // la cara va en medio de su vida
    // Años que vivió (sin año 0: del 4 a.C. al 30 d.C. van 33 años)
    const partes = f => { const neg = f.startsWith("-"); const [y, m, d] = (neg ? f.slice(1) : f).split("-").map(Number); return { y: neg ? -y : y, m, d }; };
    const N = partes(e.nace), M = partes(e.f);
    let edad = M.y - N.y - (N.y < 0 && M.y > 0 ? 1 : 0);
    if (N.m && M.m && (M.m < N.m || (M.m === N.m && (M.d || 1) < (N.d || 1)))) edad--;
    if (e.reinado){                               // faraones: el tramo es su reinado, no su vida
      // (de casi ninguno se sabe cuándo nació: entre paréntesis, los años que reinó)
      // Entre paréntesis, lo que vivió (estimado por su momia o por las fuentes); si no se sabe, se dice
      // Si se conoce lo que vivió, va entre paréntesis como en los demás personajes; si no, nada
      e.edad = e.vivio || "";

      e.etiqueta = e.etiqueta.replace(" · ", " · reinó ");
      e.etiquetaFechas = e.etiqueta;
      e.etiqueta += par;
      e.txt = "reinó " + e.txt + par;
    } else {
      e.edad = e.vivio || `${cN || c ? "c. " : ""}${edad} años`;   // "vivio": edad propia si la fecha no basta
      e.txt += ` (${e.edad})`;
      e.etiquetaFechas = e.etiqueta;
      e.etiqueta += ` (${e.edad})`;
    }
  }
  if (!e.nace && !e.desde){                      // año corto para los iconos ("1866", "c. 750 a.C.")
    const c = e.aprox ? "c. " : "";
    e.añoTxt = c + (e.f.startsWith("-") ? e.f.slice(1).split("-")[0] + " a.C." : e.f.split("-")[0]);

  }

function fluorLienzo(x1, x2, y, alto, semilla){

const cv = document.getElementById("lienzo");
const ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;

// Vista: año en el centro de la pantalla, píxeles por año y desplazamiento vertical
let centro = 0, ppa = 1, despY = 0, ppaInicial = 1;

// --- Trazo a mano alzada (al estilo Excalidraw): dos pasadas algo curvas ---
function aleatorio(semilla){
  let s = Math.abs(Math.floor(semilla * 9973 + 12345)) % 2147483646 + 1;
  return () => (s = (s * 16807) % 2147483647) / 2147483647;
}
function raya(x1, y1, x2, y2, semilla, grosor = 2, pasadas = 2){
  const r = aleatorio(semilla);
  const largo = Math.hypot(x2 - x1, y2 - y1) || 1;
  const nx = -(y2 - y1) / largo, ny = (x2 - x1) / largo;   // perpendicular
  const curva = Math.min(largo * 0.012, 3);
  ctx.strokeStyle = TINTA; ctx.lineCap = "round"; ctx.lineWidth = grosor;
  for (let p = 0; p < pasadas; p++){
    const j = () => (r() - .5) * Math.min(3, largo * 0.03);
    const ax = x1 + j(), ay = y1 + j(), bx = x2 + j(), by = y2 + j();
    const t = 0.4 + r() * 0.2, d = (r() - .5) * 2 * curva;
    const cx = ax + (bx - ax) * t + nx * d, cy = ay + (by - ay) * t + ny * d;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(cx, cy, bx, by); ctx.stroke();

}

// --- Escala ---
const xDe = año => W / 2 + (año - centro) * ppa;
const añoDe = x => centro + (x - W / 2) / ppa;

function intervalo(){
  // Paso "redondo" (1, 2, 5 × 10^n años) para que las marcas queden a ~130 px
  // Con años muy grandes las etiquetas son más largas: más separación entre marcas
  const largo = Math.max(0, Math.log10(130 / ppa) - 3);
  const bruto = (130 + largo * 28) / ppa;
  const e = Math.pow(10, Math.floor(Math.log10(bruto)));
  const m = bruto / e;
  const paso = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e;
  const sub = paso / ((paso / e) === 2 ? 4 : 5);
  return { paso: Math.max(paso, 1), sub: Math.max(sub, paso >= 5 ? 1 : paso / 4) };
}

function etiqueta(año){
  const a = Math.round(Math.abs(año) * 100) / 100;
  const txt = a >= 10000 ? a.toLocaleString("es-ES") : String(a);
  if (año === 0) return "0";
  return año < 0 ? `${txt} a.C.` : `${txt} d.C.`;
}

// Límites del lienzo: del Big Bang a la muerte del Sol, con algo de margen.
// Al alejarse del todo, la vista se centra sola para que se vea todo.
const LIMITE_MIN = -16e9, LIMITE_MAX = 8e9;
function limitarVista(){
  const span = W / ppa;
  if (span >= LIMITE_MAX - LIMITE_MIN) centro = (LIMITE_MIN + LIMITE_MAX) / 2;
  else centro = Math.min(LIMITE_MAX - span / 2, Math.max(LIMITE_MIN + span / 2, centro));

function dibujar(){

  const ini = Math.floor(desde / paso) * paso;

    raya(xDe(a), yL, xDe(a + paso), yL, a / paso + 0.5, 2.6);

  dibujarTierras(yL);

  // Las edades de la historia, más abajo
  dibujarEdades(yL);

  // Marcas pequeñas

    const iniS = Math.floor(desde / sub) * sub;
    for (let a = iniS; a < hasta; a += sub){
      if (Math.abs(a / paso - Math.round(a / paso)) < 1e-9) continue;
      const x = xDe(a);

  raya(cx + 24, cy - 22, cx + 24, cy + 24, s + 2, 2.2); raya(cx - 30, cy + 24, cx + 30, cy + 24, s + 3, 2.2);
  raya(cx - 17, cy - 15, cx + 17, cy - 15, s + 4, 1.6);
  raya(cx, cy - 15, cx, cy - 3, s + 5, 2.4);                       // tornillo
  raya(cx - 11, cy - 9, cx + 11, cy - 7, s + 6, 2);                 // barra para girarlo
  raya(cx - 13, cy - 3, cx + 13, cy - 3, s + 7, 2); raya(cx - 13, cy + 1, cx + 13, cy + 1, s + 8, 2);   // platina
  ctx.fillStyle = "#fffdf7"; ctx.fillRect(cx - 12, cy + 6, 24, 15);
  ctx.strokeStyle = TINTA; ctx.lineWidth = 1.3; ctx.strokeRect(cx - 12, cy + 6, 24, 15);
  ctx.fillStyle = TINTA; ctx.font = `10px ${MARCADOR}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("ABC", cx, cy + 13.5);
  ctx.textAlign = "left"; ctx.textBaseline = "top";
}

// Lechuza pequeñita, el animal de Atenea: sello de los filósofos junto a la cara
function lechuza(cx, cy){
  ctx.save(); ctx.strokeStyle = TINTA; ctx.lineJoin = "round"; ctx.lineWidth = 1.4;
  // Cuerpo con orejas de plumas
  ctx.beginPath();
  ctx.moveTo(cx - 7, cy - 6);
  ctx.lineTo(cx - 6.5, cy - 11); ctx.lineTo(cx - 3, cy - 7.5);
  ctx.quadraticCurveTo(cx, cy - 8.5, cx + 3, cy - 7.5);
  ctx.lineTo(cx + 6.5, cy - 11); ctx.lineTo(cx + 7, cy - 6);
  ctx.quadraticCurveTo(cx + 9, cy + 4, cx, cy + 9.5);
  ctx.quadraticCurveTo(cx - 9, cy + 4, cx - 7, cy - 6);
  ctx.closePath();
  ctx.fillStyle = "rgba(190, 140, 80, .97)"; ctx.fill(); ctx.stroke();
  // Pecho más claro con plumitas
  ctx.fillStyle = "rgba(245, 225, 185, .97)";
  ctx.beginPath(); ctx.ellipse(cx, cy + 3.5, 4, 4.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = .8;
  for (const [dx, dy] of [[-1.5, 2], [1.5, 2], [0, 4.5], [-2, 5.5], [2, 5.5]]){
    ctx.beginPath(); ctx.moveTo(cx + dx - 1, cy + dy); ctx.quadraticCurveTo(cx + dx, cy + dy + 1, cx + dx + 1, cy + dy); ctx.stroke();
  }
  // Ojos grandes
  ctx.lineWidth = 1.1;
  for (const k of [-1, 1]){
    ctx.fillStyle = "#fffdf7"; ctx.beginPath(); ctx.arc(cx + k * 3.1, cy - 3, 2.9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = TINTA; ctx.beginPath(); ctx.arc(cx + k * 3.1, cy - 3, 1.3, 0, Math.PI * 2); ctx.fill();
  }
  // Pico
  ctx.fillStyle = "rgba(240, 150, 30, .95)";
  ctx.beginPath(); ctx.moveTo(cx - 1.2, cy - .6); ctx.lineTo(cx + 1.2, cy - .6); ctx.lineTo(cx, cy + 1.6); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// Probeta pequeñita con líquido y burbujas: sello de los científicos junto a la cara
function probeta(cx, cy){
  ctx.save(); ctx.strokeStyle = TINTA; ctx.lineJoin = "round"; ctx.lineCap = "round";
  const w = 3.6, top = cy - 11, bot = cy + 8;
  // Líquido verde en la mitad de abajo
  ctx.save(); ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "rgba(70, 190, 110, .9)";
  ctx.fillRect(cx - w, cy - 1, w * 2, bot - (cy - 1));
  ctx.restore();
  // Burbujas
  ctx.lineWidth = .9;
  for (const [dx, dy, rr] of [[-1, 4.5, 1.1], [1.3, 1.5, .9], [-.5, -4, .8], [.8, -7, .6]]){
    ctx.beginPath(); ctx.arc(cx + dx, cy + dy, rr, 0, Math.PI * 2); ctx.stroke();
  }
  // Tubo, con el borde de arriba abierto hacia fuera
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx - w - 1.6, top); ctx.lineTo(cx - w, top + 1.4);
  ctx.lineTo(cx - w, bot); ctx.lineTo(cx + w, bot);
  ctx.lineTo(cx + w, top + 1.4); ctx.lineTo(cx + w + 1.6, top);
  ctx.stroke();
  // Pie
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(cx - w - 3, bot + 2); ctx.lineTo(cx + w + 3, bot + 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - w, bot); ctx.lineTo(cx - w - 1.5, bot + 2); ctx.moveTo(cx + w, bot); ctx.lineTo(cx + w + 1.5, bot + 2); ctx.stroke();
  // Rayitas de medida
  ctx.lineWidth = .9;
  for (let j = 0; j < 4; j++){
    const yy = top + 4 + j * 3.6;
    ctx.beginPath(); ctx.moveTo(cx - w, yy); ctx.lineTo(cx - w + (j % 2 ? 2.4 : 1.4), yy); ctx.stroke();
  }
  ctx.restore();
}

// Paleta de pintor con manchas de colores: el símbolo del arte en general, sello de los artistas
function paleta(cx, cy){
  ctx.save(); ctx.strokeStyle = TINTA; ctx.lineJoin = "round"; ctx.lineWidth = 1.5;
  // Contorno en forma de riñón, con la muesca para el pulgar abajo a la derecha
  ctx.beginPath();
  ctx.moveTo(cx + 6, cy + 6.5);
  ctx.quadraticCurveTo(cx - 1, cy + 9.5, cx - 7, cy + 6);
  ctx.quadraticCurveTo(cx - 12, cy + 1, cx - 9, cy - 5);
  ctx.quadraticCurveTo(cx - 3, cy - 10.5, cx + 5, cy - 8);
  ctx.quadraticCurveTo(cx + 12, cy - 5, cx + 11, cy + 1);
  ctx.quadraticCurveTo(cx + 10.5, cy + 4, cx + 7.5, cy + 3);
  ctx.quadraticCurveTo(cx + 4.5, cy + 3, cx + 6, cy + 6.5);
  ctx.closePath();
  ctx.fillStyle = "rgba(225, 185, 130, .97)"; ctx.fill(); ctx.stroke();
  // Agujero para el pulgar
  ctx.fillStyle = "#f6f4ee"; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.ellipse(cx + 3.5, cy - 1, 1.8, 1.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // Manchas de pintura
  ctx.lineWidth = .8;
  for (const [dx, dy, col] of [[-6.5, 1.5, "rgba(220, 50, 50, .95)"], [-5, -4.5, "rgba(255, 205, 40, .95)"],
                               [.5, -6, "rgba(50, 110, 210, .95)"], [6.5, -4, "rgba(60, 170, 90, .95)"], [-1.5, 5, "rgba(150, 80, 170, .95)"]]){
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx + dx, cy + dy, 1.9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

// Bastón de mando en diagonal (terciopelo azul con estrellas y remates dorados): sello de los gobernantes
function baston(cx, cy){
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-Math.PI / 4);
  ctx.strokeStyle = TINTA; ctx.lineJoin = "round"; ctx.lineWidth = 1.4;
  const L = 11, g = 2.8, tapa = 3;
  // Cuerpo
  ctx.fillStyle = "rgba(40, 70, 160, .97)";
  ctx.beginPath(); ctx.rect(-L + tapa, -g, 2 * (L - tapa), 2 * g); ctx.fill(); ctx.stroke();
  // Estrellitas doradas
  ctx.fillStyle = "rgba(255, 205, 40, .98)";
  for (const dx of [-4, 0, 4]){ ctx.beginPath(); ctx.arc(dx, 0, 1, 0, Math.PI * 2); ctx.fill(); }
  // Remates dorados en los extremos
  for (const k of [-1, 1]){
    const x0 = k < 0 ? -L : L - tapa;
    ctx.fillStyle = "rgba(230, 175, 40, .98)";
    ctx.beginPath(); ctx.rect(x0, -g - .8, tapa, 2 * g + 1.6); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

// Banderita del Estado que gobernó, ondeando un poco, con borde de tinta
function bandera(cx, cy, tipo){
  const w = 24, h = 16, x0 = cx - w / 2, y0 = cy - h / 2;

    ctx.lineTo(cx + 1, cy - 2.6); ctx.lineTo(cx + 3.6, cy - 4.4); ctx.lineTo(cx + 3.2, cy - .6);   // ala derecha
    ctx.lineTo(cx + 1.2, cy + .4); ctx.lineTo(cx + 1.8, cy + 4.2); ctx.lineTo(cx, cy + 3);          // cola
    ctx.lineTo(cx - 1.8, cy + 4.2); ctx.lineTo(cx - 1.2, cy + .4); ctx.lineTo(cx - 3.2, cy - .6);
    ctx.lineTo(cx - 3.6, cy - 4.4); ctx.lineTo(cx - 1, cy - 2.6); ctx.closePath();                 // ala izquierda
    ctx.fill(); ctx.stroke();
  }
  if (tipo === "urss"){
    ctx.fillStyle = "#cc1f1f"; ctx.fillRect(x0 - 2, y0 - 3, w + 4, h + 6);

    const sx = x0 + 6, sy = y0 + 8;

    ctx.beginPath(); ctx.moveTo(sx - 2.5, sy + 3); ctx.lineTo(sx + 2.8, sy - 2.6); ctx.stroke();   // martillo
    ctx.beginPath(); ctx.moveTo(sx + 1.3, sy - 3.8); ctx.lineTo(sx + 4, sy - 1.2); ctx.stroke();
    ctx.beginPath();                              // estrella
    for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? .7 : 1.6; ctx.lineTo(sx + Math.cos(a) * rr, y0 + 2.6 + Math.sin(a) * rr); }
    ctx.fill();
  }
  if (tipo === "franquista"){                    // rojigualda con el águila de San Juan
    ctx.fillStyle = "#c8102e"; ctx.fillRect(x0 - 2, y0 - 3, w + 4, h + 6);
    ctx.fillStyle = "#f6c400"; ctx.fillRect(x0 - 2, y0 + h / 4, w + 4, h / 2);
    ctx.fillStyle = "#1a1a1a";
    const ex = x0 + 8.5, ey = cy;
    ctx.beginPath();                              // águila de frente, con las alas abiertas
    ctx.moveTo(ex, ey - 3.6); ctx.lineTo(ex + 1, ey - 2.2); ctx.lineTo(ex + 4, ey - 3.8); ctx.lineTo(ex + 3.4, ey);
    ctx.lineTo(ex + 1.2, ey + .6); ctx.lineTo(ex + 1.6, ey + 3.6); ctx.lineTo(ex, ey + 2.6); ctx.lineTo(ex - 1.6, ey + 3.6);
    ctx.lineTo(ex - 1.2, ey + .6); ctx.lineTo(ex - 3.4, ey); ctx.lineTo(ex - 4, ey - 3.8); ctx.lineTo(ex - 1, ey - 2.2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#c8102e"; ctx.fillRect(ex - 1.2, ey - 1.2, 2.4, 2.6);   // escudo en el pecho
  }
  if (tipo === "coreanorte"){                    // azul, blanco y rojo, con la estrella roja en un círculo blanco
    ctx.fillStyle = "#024fa2"; ctx.fillRect(x0 - 2, y0 - 3, w + 4, h + 6);
    ctx.fillStyle = "#fffdf7"; ctx.fillRect(x0 - 2, y0 + h * .18, w + 4, h * .64);
    ctx.fillStyle = "#ed1c27"; ctx.fillRect(x0 - 2, y0 + h * .24, w + 4, h * .52);
    const sx = x0 + 8, sy = cy;
    ctx.fillStyle = "#fffdf7"; ctx.beginPath(); ctx.arc(sx, sy, 3.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ed1c27"; ctx.beginPath();
    for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 1.3 : 3.2; ctx.lineTo(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr); }
    ctx.fill();

  if (tipo === "china"){                         // roja con una estrella grande y cuatro pequeñas amarillas
    ctx.fillStyle = "#de2910"; ctx.fillRect(x0 - 2, y0 - 3, w + 4, h + 6);
    ctx.fillStyle = "#ffde00";
    const estrella = (ex, ey, R, giro) => { ctx.beginPath(); for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + giro + i * Math.PI / 5, rr = i % 2 ? R * .4 : R; ctx.lineTo(ex + Math.cos(a) * rr, ey + Math.sin(a) * rr); } ctx.fill(); };
    estrella(x0 + 5, y0 + 5, 2.8, 0);
    estrella(x0 + 9.5, y0 + 2.2, 1, .5); estrella(x0 + 11, y0 + 4.4, 1, .2);
    estrella(x0 + 11, y0 + 7.2, 1, 0); estrella(x0 + 9.5, y0 + 9.2, 1, .4);

    ctx.beginPath(); ctx.moveTo(bx - 1.8, by - 1.4); ctx.lineTo(bx, by - 8.5); ctx.lineTo(bx + 1.8, by - 1.4); ctx.fill();   // torre central
    for (const k of [-1, 1]){
      ctx.beginPath(); ctx.moveTo(bx + k * 3, by - 1.4); ctx.lineTo(bx + k * 4.4, by - 6); ctx.lineTo(bx + k * 5.8, by - 1.4); ctx.fill();
      ctx.fillRect(bx + k * 6.5 - 1, by - 3.4, 2, 2);
    }
  }
  if (tipo === "cuba"){                          // cinco franjas azules y blancas, triángulo rojo con estrella blanca
    for (let i = 0; i < 5; i++){ ctx.fillStyle = i % 2 ? "#fffdf7" : "#002a8f"; ctx.fillRect(x0 - 2, y0 - 3 + i * (h + 6) / 5, w + 4, (h + 6) / 5 + .5); }
    ctx.fillStyle = "#cf142b"; ctx.beginPath(); ctx.moveTo(x0 - 2, y0 - 3); ctx.lineTo(x0 + w * .45, cy); ctx.lineTo(x0 - 2, y0 + h + 3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fffdf7"; ctx.beginPath();
    for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 1 : 2.4; ctx.lineTo(x0 + 4.2 + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
    ctx.fill();
  }
  if (tipo === "chile"){                         // blanca y roja, con el cuadro azul y la estrella blanca
    ctx.fillStyle = "#fffdf7"; ctx.fillRect(x0 - 2, y0 - 3, w + 4, h / 2 + 3);
    ctx.fillStyle = "#d52b1e"; ctx.fillRect(x0 - 2, cy, w + 4, h / 2 + 3);
    ctx.fillStyle = "#0039a6"; ctx.fillRect(x0 - 2, y0 - 3, w / 3 + 2, h / 2 + 3);
    ctx.fillStyle = "#fffdf7"; ctx.beginPath();
    for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 1 : 2.4; ctx.lineTo(x0 + w / 6 + Math.cos(a) * rr, y0 + h / 4 - .5 + Math.sin(a) * rr); }
    ctx.fill();
  }
  if (tipo === "paraguay"){                      // roja, blanca y azul, con el escudo en el centro
    ctx.fillStyle = "#d52b1e"; ctx.fillRect(x0 - 2, y0 - 3, w + 4, h / 3 + 3);
    ctx.fillStyle = "#fffdf7"; ctx.fillRect(x0 - 2, y0 + h / 3, w + 4, h / 3);
    ctx.fillStyle = "#0038a8"; ctx.fillRect(x0 - 2, y0 + 2 * h / 3, w + 4, h / 3 + 3);
    ctx.strokeStyle = "#2e7d32"; ctx.lineWidth = .9;
    ctx.beginPath(); ctx.arc(cx, cy, 2.6, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#ffd21f"; ctx.beginPath(); ctx.arc(cx, cy, 1.1, 0, Math.PI * 2); ctx.fill();
  }
  if (tipo === "argentina"){                     // celeste, blanca y celeste, con el Sol de Mayo
    ctx.fillStyle = "#74acdf"; ctx.fillRect(x0 - 2, y0 - 3, w + 4, h + 6);
    ctx.fillStyle = "#fffdf7"; ctx.fillRect(x0 - 2, y0 + h / 3, w + 4, h / 3);
    ctx.strokeStyle = "#f6b40e"; ctx.lineWidth = .7;
    for (let i = 0; i < 12; i++){ const a = i * Math.PI / 6; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 1.4, cy + Math.sin(a) * 1.4); ctx.lineTo(cx + Math.cos(a) * 2.5, cy + Math.sin(a) * 2.5); ctx.stroke(); }
    ctx.fillStyle = "#f6b40e"; ctx.beginPath(); ctx.arc(cx, cy, 1.3, 0, Math.PI * 2); ctx.fill();
  }
  if (tipo === "nazi"){
    ctx.fillStyle = "#c8102e"; ctx.fillRect(x0 - 2, y0 - 3, w + 4, h + 6);
    ctx.fillStyle = "#fffdf7"; ctx.beginPath(); ctx.arc(cx, cy, 5.6, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI / 4);

    ctx.moveTo(0, -a); ctx.lineTo(a, -a); ctx.moveTo(a, 0); ctx.lineTo(a, a);
    ctx.moveTo(0, a); ctx.lineTo(-a, a); ctx.moveTo(-a, 0); ctx.lineTo(-a, -a);
    ctx.stroke(); ctx.restore();
  }
  ctx.restore();
  forma(); ctx.strokeStyle = TINTA; ctx.lineWidth = 1.5; ctx.lineJoin = "round"; ctx.stroke();
  ctx.restore();
}

// Tramo de la vida de una persona: |———— (cara) ————|
function tramoVida(it, y){
  const e = it.e, r = 23, x = it.x, s = e.id * 17 + 5;
  const x1 = xDe(e.añoNace), x2 = xDe(e.añoMuere);
  // Por etapas según el zoom: 1 = cara y nombre; 2 = además la raya de vida y las fechas; 3 = además la edad
  const etapa = it.etapa || 3;
  if (etapa >= 2){
  // La raya de vida, de una sola pasada (con dos, a veces se veía doble)
  if (x - r - 8 - x1 > 4) raya(x1, y, x - r - 8, y, s + 1, 2.6, 1);
  if (x2 - (x + r + 8) > 4) raya(x + r + 8, y, x2, y, s + 2, 2.6, 1);
  if (x2 - x1 > 2 * r + 20){                    // topes en los extremos
    raya(x1, y - 8, x1, y + 8, s + 3, 2.2);
    raya(x2, y - 8, x2, y + 8, s + 4, 2.2);
  }
  }
  cara(e.cara, x, y, r, s);
  // Icono de su oficio, fuera de la cara arriba a la izquierda, con hueco para que no la toque
  if (e.simbolo === "filosofo") lechuza(x - r * 1.45, y - r * 1.27);
  if (e.simbolo === "cientifico") probeta(x - r * 1.45, y - r * 1.27);
  if (e.simbolo === "artista") paleta(x - r * 1.45, y - r * 1.27);
  // Gobernantes: la bandera del Estado que gobernaron (los dictadores, arriba a la derecha)
  if (e.bandera === "francia") bandera(x - r * 1.85, y - r * 1.6, e.bandera);
  else if (e.bandera) bandera(x + r * 1.45, y - r * 1.45, e.bandera);   // gobernantes: la bandera del Estado que gobernaron
  // Nombre (y años): se guardan para dibujarlos al final, encima de todas las caras
  const txt = etapa === 1 ? (e.corto || e.t) : etapa === 2 ? (e.etiquetaFechas || e.etiqueta) : e.etiqueta;
  nombresPendientes.push({ txt, x: x + r * 1.5 + 6, y: y - 4, a: ctx.globalAlpha });
}
let nombresPendientes = [];
function dibujarNombres(){
  ctx.save(); ctx.textAlign = "left"; ctx.textBaseline = "bottom"; ctx.font = `600 17px ${FUENTE}`;
  ctx.lineJoin = "round"; ctx.lineWidth = 4; ctx.strokeStyle = "rgba(246, 244, 238, .95)"; ctx.fillStyle = "#555";
  for (const n of nombresPendientes){ ctx.globalAlpha = n.a; ctx.strokeText(n.txt, n.x, n.y); ctx.fillText(n.txt, n.x, n.y); }
  ctx.restore(); nombresPendientes = [];
}
// Caras a modo de caricatura
function cara(quien, x, y, r, s){
  if (quien === "jesus"){
    // Aureola de fluorescente detrás
    ctx.save(); ctx.globalCompositeOperation = "multiply";
    ctx.strokeStyle = AMARILLO; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(x, y - r * .05, r * 1.22, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    // Melena larga por detrás, hasta los hombros (solo contorno y mechones)
    ctx.beginPath();
    ctx.moveTo(x - r * 1.05, y + r * 1.2);
    ctx.quadraticCurveTo(x - r * 1.32, y - r * .2, x - r * .75, y - r * .98);
    ctx.quadraticCurveTo(x, y - r * 1.38, x + r * .75, y - r * .98);
    ctx.quadraticCurveTo(x + r * 1.32, y - r * .2, x + r * 1.05, y + r * 1.2);
    ctx.lineTo(x - r * 1.05, y + r * 1.2); ctx.closePath();
    ctx.fillStyle = "#fffdf7"; ctx.fill();

    ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x - r * .07, y - r * .05); ctx.lineTo(x + r * .07, y - r * .05); ctx.stroke();   // puente
    ctx.beginPath(); ctx.moveTo(x - r * .54, y - r * .06); ctx.lineTo(x - r * .92, y - r * .14); ctx.moveTo(x + r * .54, y - r * .06); ctx.lineTo(x + r * .92, y - r * .14); ctx.stroke();
    // Nariz
    ctx.lineWidth = 1.4; ctx.fillStyle = TINTA;
    ctx.beginPath(); ctx.moveTo(x + r * .02, y + r * .14); ctx.lineTo(x - r * .04, y + r * .3); ctx.quadraticCurveTo(x + r * .04, y + r * .35, x + r * .12, y + r * .3); ctx.stroke();
    // Bigote canoso recortado
    ctx.beginPath();
    ctx.moveTo(x - r * .24, y + r * .48); ctx.quadraticCurveTo(x, y + r * .36, x + r * .24, y + r * .48);
    ctx.quadraticCurveTo(x, y + r * .52, x - r * .24, y + r * .48);
    ctx.fillStyle = "rgba(120, 120, 120, .95)"; ctx.fill(); ctx.lineWidth = 1; ctx.stroke();
    // Boca seria y mandíbula
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x - r * .14, y + r * .63); ctx.lineTo(x + r * .14, y + r * .63); ctx.stroke();
    ctx.lineWidth = 1;
    for (const k of [-1, 1]){ ctx.beginPath(); ctx.moveTo(x + k * r * .55, y + r * .3); ctx.quadraticCurveTo(x + k * r * .5, y + r * .62, x + k * r * .3, y + r * .78); ctx.stroke(); }
  }
  if (quien === "stroessner"){
    ctx.strokeStyle = TINTA; ctx.fillStyle = TINTA; ctx.lineCap = "round"; ctx.lineJoin = "round";
    // Pelo rubio canoso, corto y peinado hacia atrás, con entradas
    ctx.beginPath();
    ctx.moveTo(x - r * .95, y - r * .05);
    ctx.quadraticCurveTo(x - r * 1.06, y - r * .95, x, y - r * 1.06);
    ctx.quadraticCurveTo(x + r * 1.06, y - r * .95, x + r * .95, y - r * .05);
    ctx.quadraticCurveTo(x + r * .86, y - r * .4, x + r * .58, y - r * .5);
    ctx.quadraticCurveTo(x + r * .3, y - r * .6, x, y - r * .66);
    ctx.quadraticCurveTo(x - r * .3, y - r * .6, x - r * .58, y - r * .5);
    ctx.quadraticCurveTo(x - r * .86, y - r * .4, x - r * .95, y - r * .05);
    ctx.fillStyle = "rgba(205, 185, 135, .97)"; ctx.fill(); ctx.lineWidth = 1.6; ctx.stroke();
    ctx.lineWidth = .9;
    for (let k = -2; k <= 2; k++){ ctx.beginPath(); ctx.moveTo(x + k * r * .2, y - r * .64); ctx.quadraticCurveTo(x + k * r * .23, y - r * .82, x + k * r * .25, y - r * (.98 - Math.abs(k) * .1)); ctx.stroke(); }
    ctx.fillStyle = TINTA;
    // Ojos pequeños y cejas rectas
    for (const k of [-1, 1]){

      ctx.lineWidth = 1.6;

    }
    // Nariz carnosa
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(x + r * .02, y - r * .04); ctx.lineTo(x - r * .04, y + r * .22);
    ctx.moveTo(x - r * .16, y + r * .28); ctx.quadraticCurveTo(x, y + r * .36, x + r * .16, y + r * .28); ctx.stroke();
    // Bigote fino recortado
    ctx.beginPath();
    ctx.moveTo(x - r * .2, y + r * .45); ctx.quadraticCurveTo(x, y + r * .37, x + r * .2, y + r * .45);

    ctx.beginPath(); ctx.moveTo(x - r * .14, y + r * .6); ctx.lineTo(x + r * .14, y + r * .6); ctx.stroke();
    ctx.lineWidth = 1;
    for (const k of [-1, 1]){ ctx.beginPath(); ctx.moveTo(x + k * r * .5, y + r * .2); ctx.quadraticCurveTo(x + k * r * .55, y + r * .45, x + k * r * .4, y + r * .62); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(x - r * .34, y + r * .82); ctx.quadraticCurveTo(x, y + r * .97, x + r * .34, y + r * .82); ctx.stroke();
  }
  if (quien === "videla"){
    ctx.strokeStyle = TINTA; ctx.fillStyle = TINTA; ctx.lineCap = "round"; ctx.lineJoin = "round";
    // Pelo oscuro peinado hacia atrás, con entradas
    ctx.beginPath();

    ctx.quadraticCurveTo(x - r * 1.06, y - r * .95, x, y - r * 1.08);

    ctx.quadraticCurveTo(x + r * .86, y - r * .45, x + r * .6, y - r * .5);
    ctx.quadraticCurveTo(x + r * .32, y - r * .58, x, y - r * .62);
    ctx.quadraticCurveTo(x - r * .32, y - r * .58, x - r * .6, y - r * .5);
    ctx.quadraticCurveTo(x - r * .86, y - r * .45, x - r * .95, y - r * .1);
    ctx.fill();
    ctx.save(); ctx.strokeStyle = "rgba(255, 253, 247, .55)"; ctx.lineWidth = .9;
    for (let k = -2; k <= 2; k++){ ctx.beginPath(); ctx.moveTo(x + k * r * .2, y - r * .62); ctx.quadraticCurveTo(x + k * r * .23, y - r * .82, x + k * r * .25, y - r * (.98 - Math.abs(k) * .1)); ctx.stroke(); }
    ctx.restore();
    // Ojos hundidos y cejas oscuras
    for (const k of [-1, 1]){

    }
    // Nariz larga
    raya(x + r * .02, y - r * .08, x - r * .05, y + r * .26, s + 6, 1.4);
    // Bigote grande y espeso
    ctx.beginPath();
    ctx.moveTo(x - r * .34, y + r * .5);

  }
  if (quien === "mahoma"){

  if (quien === "buda"){
    ctx.strokeStyle = TINTA; ctx.fillStyle = TINTA; ctx.lineCap = "round"; ctx.lineJoin = "round";
    // Protuberancia en la coronilla (ushnisha) y pelo de pequeños rizos
    ctx.beginPath(); ctx.arc(x, y - r * .95, r * .3, Math.PI, 0); ctx.fillStyle = "rgba(40, 60, 110, .95)"; ctx.fill(); ctx.lineWidth = 1.4; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - r * .95, y - r * .15);
    ctx.quadraticCurveTo(x - r * 1.0, y - r * .98, x, y - r * 1.0);
    ctx.quadraticCurveTo(x + r * 1.0, y - r * .98, x + r * .95, y - r * .15);
    ctx.quadraticCurveTo(x + r * .8, y - r * .5, x, y - r * .55);
    ctx.quadraticCurveTo(x - r * .8, y - r * .5, x - r * .95, y - r * .15);
    ctx.fill(); ctx.stroke();
    ctx.save(); ctx.strokeStyle = "rgba(255, 253, 247, .55)"; ctx.lineWidth = .8;
    for (let i = 0; i < 9; i++){ const a = Math.PI * (1.12 + i * .095); ctx.beginPath(); ctx.arc(x + Math.cos(a) * r * .78, y - r * .2 + Math.sin(a) * r * .66, r * .06, 0, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
    // Orejas de lóbulos largos
    for (const k of [-1, 1]){
      ctx.beginPath(); ctx.ellipse(x + k * r * 1.02, y + r * .12, r * .14, r * .38, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#fffdf7"; ctx.fill(); ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.fillStyle = TINTA;
    // Punto en la frente (urna), ojos entornados y cejas arqueadas
    ctx.beginPath(); ctx.arc(x, y - r * .32, 1.8, 0, Math.PI * 2); ctx.fill();
    for (const k of [-1, 1]){
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x + k * r * .12, y - r * .2); ctx.quadraticCurveTo(x + k * r * .3, y - r * .32, x + k * r * .48, y - r * .18); ctx.stroke();
      ctx.lineWidth = 1.7;
      ctx.beginPath(); ctx.moveTo(x + k * r * .18, y - r * .02); ctx.quadraticCurveTo(x + k * r * .3, y + r * .04, x + k * r * .42, y - r * .02); ctx.stroke();
    }
    // Nariz y sonrisa serena
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(x, y - r * .1); ctx.lineTo(x - r * .03, y + r * .24); ctx.quadraticCurveTo(x + r * .04, y + r * .29, x + r * .1, y + r * .25); ctx.stroke();
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x - r * .16, y + r * .48); ctx.quadraticCurveTo(x, y + r * .56, x + r * .16, y + r * .48); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x - r * .14, y + r * .8); ctx.quadraticCurveTo(x, y + r * .86, x + r * .14, y + r * .8); ctx.stroke();
  }
  if (quien === "abraham"){
    ctx.strokeStyle = TINTA; ctx.fillStyle = TINTA; ctx.lineCap = "round"; ctx.lineJoin = "round";
    // Tela sobre la cabeza que cae a los lados, a rayas, sujeta con un cordón
    ctx.beginPath();
    ctx.moveTo(x - r * 1.12, y + r * .9);
    ctx.quadraticCurveTo(x - r * 1.3, y - r * .5, x - r * .5, y - r * 1.1);
    ctx.quadraticCurveTo(x, y - r * 1.32, x + r * .5, y - r * 1.1);
    ctx.quadraticCurveTo(x + r * 1.3, y - r * .5, x + r * 1.12, y + r * .9);
    ctx.lineTo(x + r * .8, y + r * .9);
    ctx.quadraticCurveTo(x + r * .9, y - r * .3, x + r * .5, y - r * .62);
    ctx.quadraticCurveTo(x, y - r * .8, x - r * .5, y - r * .62);
    ctx.quadraticCurveTo(x - r * .9, y - r * .3, x - r * .8, y + r * .9);
    ctx.closePath();
    ctx.fillStyle = "rgba(225, 205, 160, .97)"; ctx.fill(); ctx.lineWidth = 1.8; ctx.stroke();
    ctx.save(); ctx.strokeStyle = "rgba(150, 90, 50, .8)"; ctx.lineWidth = 1.6;
    for (const k of [-1, 1]){ ctx.beginPath(); ctx.moveTo(x + k * r * .98, y + r * .85); ctx.quadraticCurveTo(x + k * r * 1.1, y - r * .3, x + k * r * .55, y - r * .9); ctx.stroke(); }
    ctx.restore();
    ctx.lineWidth = 2.6; ctx.strokeStyle = TINTA;                   // cordón
    ctx.beginPath(); ctx.moveTo(x - r * .62, y - r * .68); ctx.quadraticCurveTo(x, y - r * .9, x + r * .62, y - r * .68); ctx.stroke();
    // Larga barba blanca
    ctx.beginPath();
    ctx.moveTo(x - r * .78, y + r * .05);
    ctx.quadraticCurveTo(x - r * .85, y + r * 1.1, x - r * .2, y + r * 1.6);
    ctx.quadraticCurveTo(x, y + r * 1.72, x + r * .2, y + r * 1.6);
    ctx.quadraticCurveTo(x + r * .85, y + r * 1.1, x + r * .78, y + r * .05);
    ctx.quadraticCurveTo(x + r * .5, y + r * .4, x + r * .25, y + r * .32);
    ctx.quadraticCurveTo(x, y + r * .24, x - r * .25, y + r * .32);
    ctx.quadraticCurveTo(x - r * .5, y + r * .4, x - r * .78, y + r * .05);
    ctx.fillStyle = "#fbfaf4"; ctx.fill(); ctx.lineWidth = 1.7; ctx.stroke();
    ctx.lineWidth = .9;
    for (let k = -3; k <= 3; k++){ ctx.beginPath(); ctx.moveTo(x + k * r * .16, y + r * (.55 + Math.abs(k) * .03)); ctx.quadraticCurveTo(x + k * r * .18, y + r * 1.0, x + k * r * .1, y + r * (1.45 - Math.abs(k) * .1)); ctx.stroke(); }
    // Cejas blancas pobladas y ojos
    ctx.fillStyle = TINTA;
    for (const k of [-1, 1]){
      ctx.beginPath(); ctx.arc(x + k * r * .28, y - r * .1, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(x + k * r * .12, y - r * .28); ctx.quadraticCurveTo(x + k * r * .3, y - r * .36, x + k * r * .46, y - r * .26); ctx.stroke();
    }
    // Nariz y bigote
    raya(x + r * .02, y - r * .1, x - r * .06, y + r * .2, s + 6, 1.4);
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(x - r * .28, y + r * .42); ctx.quadraticCurveTo(x - r * .1, y + r * .26, x, y + r * .3);
    ctx.quadraticCurveTo(x + r * .1, y + r * .26, x + r * .28, y + r * .42); ctx.stroke();
  }
  if (quien === "hitler"){
    // Pelo con el flequillo cayendo sobre la frente
    ctx.beginPath();
    ctx.moveTo(x + r * .92, y - r * .35);
    ctx.quadraticCurveTo(x + r * .7, y - r * 1.05, x - r * .1, y - r * 1.02);
    ctx.quadraticCurveTo(x - r * .85, y - r * .9, x - r * .95, y - r * .25);
    ctx.quadraticCurveTo(x - r * .75, y - r * .05, x - r * .55, y + r * .02);   // punta del flequillo
    ctx.quadraticCurveTo(x - r * .2, y - r * .35, x + r * .35, y - r * .55);
    ctx.quadraticCurveTo(x + r * .7, y - r * .55, x + r * .92, y - r * .35);
    ctx.fill();
    // Ojos
    ctx.beginPath(); ctx.arc(x - r * .3, y + r * .12, 1.9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * .33, y + r * .08, 1.9, 0, Math.PI * 2); ctx.fill();
    // Nariz
    raya(x + r * .02, y + r * .15, x - r * .05, y + r * .38, s + 6, 1.4);
    // Bigote corto
    ctx.fillRect(x - r * .17, y + r * .42, r * .36, r * .16);
    // Boca
    raya(x - r * .2, y + r * .72, x + r * .18, y + r * .7, s + 7, 1.4);
  }
}

// Libro dibujado a mano con el título en la tapa
function libro(cx, cy, e){
  const s = e.id * 19 + 2, w = 84, h = 96, lomo = 10;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.07);
  const x0 = -w / 2, y0 = -h / 2;
  // Páginas asomando por detrás (borde derecho e inferior)
  ctx.fillStyle = "#fffdf7";
  ctx.fillRect(x0 + 4, y0 + 4, w, h);
  raya(x0 + w, y0 + 5, x0 + w + 4, y0 + 5, s, 1.4);
  raya(x0 + w + 4, y0 + 5, x0 + w + 4, y0 + h + 4, s + 1, 1.6);
  raya(x0 + 5, y0 + h + 4, x0 + w + 4, y0 + h + 4, s + 2, 1.6);
  raya(x0 + w + 1.5, y0 + 8, x0 + w + 1.5, y0 + h + 1, s + 3, .9);
  // Tapa
  ctx.fillStyle = "#fffdf7"; ctx.fillRect(x0, y0, w, h);
  raya(x0, y0, x0 + w, y0, s + 4, 2.2);
  raya(x0 + w, y0, x0 + w, y0 + h, s + 5, 2.2);
  raya(x0 + w, y0 + h, x0, y0 + h, s + 6, 2.2);
  raya(x0, y0 + h, x0, y0, s + 7, 2.2);
  raya(x0 + lomo, y0 + 2, x0 + lomo, y0 + h - 2, s + 8, 1.6);   // lomo
  // Título a rotulador con fluorescente
  const cxT = x0 + lomo + (w - lomo) / 2;
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = AMARILLO;
  ctx.fillRect(x0 + lomo + 4, y0 + 18, w - lomo - 8, 42); ctx.restore();
  ctx.fillStyle = TINTA; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  // Escribe el texto encogiéndolo si no cabe en la tapa
  const cabeEn = w - lomo - 10;
  const tamQueCabe = (txt, tam, fuente) => {
    ctx.font = `${tam}px ${fuente}`;
    const m = ctx.measureText(txt).width;
    return m > cabeEn ? Math.floor(tam * cabeEn / m) : tam;
  };
  const escribir = (txt, tam, fuente, y) => {
    ctx.font = `${tamQueCabe(txt, tam, fuente)}px ${fuente}`;
    ctx.fillText(txt, cxT, y);
  };
  const [l1, l2 = ""] = e.portada || [e.t.toUpperCase()];
  if (l2 && l2.length <= 6){
    // Título partido en dos (FRANKEN- / STEIN): las dos líneas con la misma letra
    const tam = Math.min(tamQueCabe(l1, 17, MARCADOR), tamQueCabe(l2, 17, MARCADOR));
    escribir(l1, tam, MARCADOR, y0 + 29);
    escribir(l2, tam, MARCADOR, y0 + 49);
  } else {
    escribir(l1, 17, MARCADOR, y0 + 29);
    if (l2) escribir(l2, 14, MARCADOR, y0 + 49);   // subtítulo más pequeño (Y CASTIGO)
  }
  ctx.fillStyle = "#555";
  escribir(e.sub || "", 19, FUENTE, y0 + h - 18);
  ctx.restore();
  ctx.textAlign = "left"; ctx.textBaseline = "top";
}

// El Sol convertido en gigante roja, con la Tierra pequeñita al lado
function solRojo(cx, cy, semilla){
  const s = semilla * 23 + 9, R0 = 24;
  // Cuerpo: rotulador naranja y rojo
  ctx.save(); ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "rgba(255, 150, 40, .75)"; ctx.beginPath(); ctx.arc(cx, cy, R0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(230, 60, 40, .45)"; ctx.beginPath(); ctx.arc(cx - 3, cy + 3, R0 * .72, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  circuloMano(cx, cy, R0, s, 2.2);
  // Rayos ondulados
  ctx.strokeStyle = TINTA; ctx.lineWidth = 1.8; ctx.lineCap = "round";
  for (let k = 0; k < 10; k++){
    const ang = k / 10 * Math.PI * 2 + .2;
    if (Math.abs(ang - 0.15) < .35) continue;      // hueco donde está la Tierra
    const r1 = R0 + 5, r2 = R0 + 13;
    const px = ang + Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1);
    ctx.quadraticCurveTo(cx + Math.cos(ang) * (r1 + r2) / 2 + Math.cos(px) * 3, cy + Math.sin(ang) * (r1 + r2) / 2 + Math.sin(px) * 3,
                         cx + Math.cos(ang) * r2, cy + Math.sin(ang) * r2);
    ctx.stroke();
  }
  // Tierra pequeñita a punto de ser engullida
  const ex = cx + R0 + 9, ey = cy + 3;
  ctx.save(); ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "rgba(70, 130, 230, .7)"; ctx.beginPath(); ctx.arc(ex, ey, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  circuloMano(ex, ey, 5, s + 3, 1.5);
}

const COSMICOS = ["sol", "tierra", "tierraAzul", "bigbang", "estrellas", "galaxia", "solJoven"];
// Calaveras y animales: nombre y fecha debajo, en líneas cortas y centradas
const TEXTO_DEBAJO = ["calavera", "asteroide", "tierraHoy", "trilobites", "anfibio", "reptil", "mamifero", "primate", "mono", "mamut", "australopiteco", "erectus", "neandertal", "sapiens"];
const HUMANOS = ["australopiteco", "erectus", "neandertal", "sapiens"];   // figuras estrechas
function lineasCalavera(e){
  const p = e.t.split(" ");
  const tit = /^Extinción del /.test(e.t) ? ["Extinción del", e.t.slice(14)]
            : p.length > 1 ? [p.slice(0, -1).join(" "), p[p.length - 1]] : [e.t];
  const m = e.añoTxt.match(/^(.*?) (millones de años|años)$/);
  return { tit, fec: m ? [m[1], m[2]] : [e.añoTxt] };

// Primeras estrellas: tres estrellas gigantes azuladas
function primerasEstrellas(cx, cy, semilla){
  const s = semilla * 37 + 2;
  const estrella = (x, y, R0, k) => {
    ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = "rgba(110, 160, 255, .6)";
    ctx.beginPath();
    for (let i = 0; i < 8; i++){
      const ang = i / 8 * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? R0 * .38 : R0;
      i ? ctx.lineTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr) : ctx.moveTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.strokeStyle = TINTA; ctx.lineWidth = 1.8; ctx.lineJoin = "round"; ctx.stroke();
  };
  estrella(cx - 9, cy + 4, 18, 0);
  estrella(cx + 14, cy - 12, 11, 1);

  ctx.fillStyle = TINTA;

}

// Vía Láctea: galaxia espiral a mano, con núcleo amarillo
function galaxia(cx, cy, semilla){
  const s = semilla * 41 + 6, r = aleatorio(s);
  ctx.save(); ctx.translate(cx, cy); ctx.scale(1, .62); ctx.rotate(-.35);
  // Halo suave
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = "rgba(150, 120, 220, .28)";
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  // Dos brazos espirales
  ctx.strokeStyle = TINTA; ctx.lineCap = "round";
  for (const giro of [0, Math.PI]){
    for (let pasada = 0; pasada < 2; pasada++){
      ctx.lineWidth = pasada ? 1.2 : 2.2;
      ctx.beginPath();
      for (let k = 0; k <= 40; k++){
        const th = k / 40 * Math.PI * 1.7, rr = 5 + th * 8.2 + (pasada ? 2 : 0);
        const px = Math.cos(th + giro) * rr, py = Math.sin(th + giro) * rr;
        k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.stroke();
    }
  }
  // Estrellitas en los brazos
  ctx.fillStyle = TINTA;
  for (let k = 0; k < 14; k++){
    const th = r() * Math.PI * 1.7, rr = 6 + th * 8.2 + (r() - .5) * 6, g = r() < .5 ? 0 : Math.PI;
    ctx.beginPath(); ctx.arc(Math.cos(th + g) * rr, Math.sin(th + g) * rr, 1.1, 0, Math.PI * 2); ctx.fill();
  }
  // Núcleo
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = "rgba(255, 200, 30, .9)";
  ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.restore();
}

  ctx.lineWidth = 2.2;

}
