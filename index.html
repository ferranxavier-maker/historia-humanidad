0U4cnwuqlzmzvwMVxmmw8px9WkTVfAXSO7JtRbibiVd6pAJ6Vae/NfRjKQj+r4fnd8VKzIbGUr5+dfTzjf80QlcuyeLFbFlI4mS81eFpdf7bv+L1WpAnY/qAAirPFW8xVR64Ga0gnCasg/ImwWgtlHDJaAROEfeiYtqToMiinrFivZYAm8q5fFILOSc+Xkcx2n2PMVgAAA==", alt: "El David de Miguel Ángel en la Galería de la Academia de Florencia", credito: "El David, Jörg Bittner Unna (CC BY-SA 3.0, Wikimedia Commons)" }, p: "Entre 1501 y 1504 esculpió en Florencia el David, de más de cinco metros, a partir de un bloque de mármol que otros escultores habían empezado y abandonado décadas antes. Representa al joven que va a enfrentarse a Goliat, concentrado antes del combate, y se convirtió en símbolo de la república florentina. Estuvo en la plaza de la Señoría hasta 1873; hoy está en la Galería de la Academia y en la plaza hay una copia." },
      { h: "La Capilla Sixtina", p: "En 1508 el papa Julio II le encargó pintar la bóveda de la Capilla Sixtina, aunque él se consideraba escultor y no pintor. Trabajó cuatro años, hasta 1512, de pie sobre un andamio y con la cabeza echada hacia atrás, no tumbado como dice la leyenda. Pintó más de 300 figuras, con escenas del Génesis como la Creación de Adán, cuyos dedos a punto de tocarse son una de las imágenes más famosas del arte." },
      { h: "El Juicio Final y el Moisés", p: "Entre 1536 y 1541 volvió a la Sixtina para pintar el Juicio Final en la pared del altar, con un Cristo juez rodeado de cientos de cuerpos desnudos. Tras el Concilio de Trento, a Daniele da Volterra le encargaron taparlos con telas pintadas, y le quedó el apodo de «el Braguetero». Durante cuarenta años arrastró además el encargo de la tumba de Julio II, que acabó muy reducida; su gran figura es el Moisés de San Pietro in Vincoli, en Roma." },
      { h: "Arquitecto y poeta", p: "En 1546, con 71 años, se hizo cargo de las obras de la basílica de San Pedro y proyectó su gran cúpula, que se terminó en 1590, después de su muerte. En Roma también diseñó la plaza del Capitolio. Escribió cerca de 300 poemas, muchos dedicados a la poetisa Vittoria Colonna y al joven noble Tommaso de' Cavalieri." },
      { h: "El final", p: "Siguió trabajando hasta el final: días antes de morir aún tallaba la Piedad Rondanini. Murió en Roma el 18 de febrero de 1564, con 88 años, y su sobrino se llevó su cuerpo a escondidas a Florencia, donde está enterrado en la iglesia de la Santa Cruz. Vasari le dedicó la biografía más larga de sus Vidas, y fue el primer artista con biografías publicadas en vida." }
    ] },
  { nace: "1480", f: "1521-04-27", aproxNace: true, fila: "personas", t: "Fernando de Magallanes", nivel: 2, corto: "Magallanes", cara: "magallanes",
    resumen: "Navegante portugués nacido hacia 1480 y muerto en la isla filipina de Mactán el 27 de abril de 1521. Al servicio de Carlos I de España, dirigió la expedición que buscaba llegar a las islas de las especias navegando hacia el oeste: descubrió el estrecho que lleva su nombre y fue el primer europeo en cruzar el océano Pacífico. Murió en Filipinas, y Juan Sebastián Elcano completó la primera vuelta al mundo en 1522.",
    detalle: [
      { h: "Un portugués en Oriente", p: "Nació en el norte de Portugal hacia 1480, en una familia de la pequeña nobleza, y de joven fue paje en la corte. En 1505 se embarcó hacia la India en la flota de Francisco de Almeida, y durante ocho años luchó en Oriente: estuvo en la batalla de Diu (1509) y en la conquista de Malaca (1511), la puerta de las islas de las especias. De vuelta, en una campaña en Marruecos, una herida en la pierna lo dejó cojo para siempre." },
      { h: "Al servicio de España", p: "Enemistado con el rey Manuel I de Portugal, que rechazó sus peticiones, se fue a Sevilla en 1517 y se casó con Beatriz Barbosa. Propuso a Carlos I llegar a las Molucas, las islas del clavo y la nuez moscada, navegando hacia el oeste, convencido de que según el Tratado de Tordesillas caían en la mitad española del mundo. En 1518 el rey aceptó y lo nombró capitán general de la expedición." },
      { h: "La salida y el motín", p: "El 20 de septiembre de 1519 salió de Sanlúcar de Barrameda con cinco naos, la Trinidad, la San Antonio, la Concepción, la Victoria y la Santiago, y unos 240 hombres. Bajó por la costa de Sudamérica buscando un paso, y en abril de 1520, mientras invernaban en la bahía de San Julián, en la Patagonia, varios capitanes castellanos se amotinaron. Magallanes aplastó el motín: uno fue ejecutado y otro abandonado en la costa. Poco después la Santiago naufragó." },
      { h: "El estrecho y el Pacífico", p: "En octubre de 1520 encontró por fin el paso, el estrecho que hoy lleva su nombre, y tardó más de un mes en atravesarlo. Por el camino, la San Antonio desertó y volvió a España. El 28 de noviembre salieron a un océano tan tranquilo que lo llamó Pacífico, pero era inmenso: lo cruzaron durante más de tres meses sin tocar casi tierra, y los marineros llegaron a comer cuero, serrín y ratas. Muchos murieron de escorbuto antes de llegar a Guam, en marzo de 1521." },
      { h: "La muerte en Mactán", p: "En marzo de 1521 llegaron a las Filipinas. En Cebú, el rajá Humabon y cientos de los suyos se bautizaron, y Magallanes quiso someter a los jefes vecinos que no lo aceptaban. El 27 de abril de 1521 desembarcó en la isla de Mactán con unos 50 hombres contra los guerreros del jefe Lapulapu, que hoy es un héroe nacional en Filipinas, y murió en la playa con unos 41 años." },
      { h: "Elcano y la primera vuelta al mundo", p: "Con solo dos barcos ya, los supervivientes llegaron a las Molucas en noviembre de 1521 y cargaron clavo. Juan Sebastián Elcano, de Getaria, tomó el mando de la Victoria y volvió por el océano Índico y el cabo de Buena Esperanza, evitando los puertos portugueses. El 6 de septiembre de 1522 llegó a Sanlúcar con 18 hombres: habían dado la primera vuelta al mundo. Carlos I le dio a Elcano un escudo con un globo terráqueo y el lema «Primus circumdedisti me», «fuiste el primero en rodearme»." },
      { h: "Su legado", p: "El viaje demostró que la Tierra era mucho más grande de lo que se creía, que los océanos estaban conectados y que América era un continente separado de Asia. Lo sabemos con detalle gracias al diario del italiano Antonio Pigafetta, uno de los 18 supervivientes. Además del estrecho, llevan su nombre las Nubes de Magallanes, dos pequeñas galaxias que se ven desde el hemisferio sur y que describieron sus marineros." }
    ] },
  { nace: "1769-08-15", f: "1821-05-05", fila: "personas", simbolo: "gobernante", t: "Napoleón Bonaparte", nivel: 2, corto: "Napoleón", cara: "napoleon",
    resumen: "Nació en Ajaccio (Córcega) el 15 de agosto de 1769 y murió desterrado en la isla de Santa Elena el 5 de mayo de 1821. Militar salido de la Revolución francesa, tomó el poder en 1799 y en 1804 se coronó emperador de los franceses. Llegó a dominar casi toda Europa, impuso un código de leyes que todavía influye en medio mundo y acabó derrotado en Waterloo en 1815.",
    detalle: [
      { h: "Un corso en Francia", p: "Nació en Ajaccio, en Córcega, solo un año después de que la isla pasara de Génova a Francia, en una familia de la pequeña nobleza. Su lengua materna era el corso, y hablaba francés con acento. Con nueve años lo enviaron a estudiar al continente, y en 1785 salió de la Escuela Militar de París como teniente de artillería, con 16 años." },
      { h: "La Revolución le abre paso", p: "La Revolución de 1789 permitió ascender a los militares por méritos y no por cuna. En 1793 se hizo notar en el asedio de Toulon, donde con 24 años lo nombraron general de brigada. En 1796 se casó con Josefina de Beauharnais y recibió el mando del ejército de Italia, donde derrotó una y otra vez a los austriacos. En 1798 dirigió la expedición a Egipto, en la que se halló la piedra de Rosetta, aunque la flota británica de Nelson destruyó sus barcos en Abukir." },
      { h: "Cónsul y emperador", p: "El 9 de noviembre de 1799 (18 de brumario) dio un golpe de Estado y se convirtió en primer cónsul, el verdadero dueño de Francia. En 1804 aprobó el Código Civil, el «Código Napoleón», y el 2 de diciembre de ese año se coronó emperador en Notre-Dame de París: tomó la corona de manos del papa Pío VII y se la puso él mismo." },
      { h: "El dueño de Europa", p: "En 1805 perdió su flota en Trafalgar frente a Nelson, pero en tierra parecía imbatible: venció en Austerlitz (1805) a Austria y Rusia, y en Jena (1806) a Prusia. Repartió tronos entre sus hermanos y decretó el bloqueo continental para ahogar el comercio británico. En 1810 se divorció de Josefina, que no le había dado hijos, y se casó con María Luisa de Austria, con quien tuvo un hijo en 1811." },
      { h: "España", p: "En 1808 forzó a Carlos IV y a Fernando VII a renunciar a la corona en Bayona y puso en el trono de España a su hermano José. El levantamiento del 2 de mayo en Madrid inició la guerra de la Independencia (1808-1814), en la que guerrilleros, el ejército español y los británicos de Wellington desgastaron a sus tropas; en Bailén (1808) un ejército francés se rindió por primera vez en campo abierto. Mientras, en Cádiz se aprobó en 1812 la primera Constitución española." },
      { h: "Rusia y la caída", p: "En 1812 invadió Rusia con la Grande Armée, unos 600.000 hombres. Llegó a Moscú, pero la encontró incendiada y tuvo que retirarse en pleno invierno: volvió solo una pequeña parte de su ejército. En 1813 lo derrotaron en Leipzig, en abril de 1814 abdicó y fue desterrado a la isla de Elba." },
      { h: "Los Cien Días y Santa Elena", p: "En marzo de 1815 escapó de Elba y volvió a gobernar Francia durante unos cien días, hasta que el 18 de junio de 1815 fue derrotado definitivamente en Waterloo por los británicos de Wellington y los prusianos de Blücher. Los británicos lo desterraron a Santa Elena, una isla perdida en el Atlántico sur, donde murió en 1821 con 51 años. En 1840 sus restos se llevaron a París y hoy reposan en los Inválidos." },
      { h: "Su legado", p: "Sus guerras costaron millones de muertos, pero también extendieron por Europa ideas de la Revolución: la igualdad ante la ley, el fin de los privilegios feudales y un Estado organizado y centralizado. El Código Napoleón sirvió de modelo a los códigos civiles de muchos países, entre ellos el español de 1889. Y su invasión de España desencadenó las independencias de la América española." }
    ] },
  { nace: "1818-05-05", f: "1883-03-14", fila: "personas", simbolo: "filosofo", t: "Karl Marx", nivel: 2, corto: "Marx", cara: "marx",
    resumen: "Nació en Tréveris (Prusia) el 5 de mayo de 1818 y murió en Londres el 14 de marzo de 1883. Filósofo, economista y periodista alemán, analizó el capitalismo como un sistema basado en la explotación del trabajo y defendió que la historia avanza por la lucha entre clases sociales. Con Friedrich Engels escribió el Manifiesto comunista, y su gran obra fue El capital. Sus ideas inspiraron el socialismo y el comunismo, y muchos de los movimientos y revoluciones del siglo XX.",
    detalle: [
      { h: "Sus orígenes", p: "Nació el 5 de mayo de 1818 en Tréveris, en la Renania entonces prusiana, en una familia de origen judío; su padre, abogado, se había convertido al protestantismo para poder seguir ejerciendo. Estudió derecho y filosofía en Bonn y Berlín, donde se unió a los «jóvenes hegelianos», seguidores críticos del filósofo Hegel. En 1841 se doctoró con una tesis sobre los filósofos griegos Demócrito y Epicuro." },
      { h: "Periodista y exiliado", p: "No consiguió plaza de profesor y se hizo periodista. En 1842 dirigió la Gaceta Renana, que el gobierno prusiano cerró al año siguiente. Se casó con Jenny von Westphalen y empezó una vida de exilio: París, Bruselas y, tras las revoluciones de 1848, Londres, donde vivió desde 1849 hasta su muerte, muchas veces en la miseria. Varios de sus hijos murieron de niños." },
      { h: "Friedrich Engels", p: "En 1844 conoció en París a Friedrich Engels, hijo de un industrial textil alemán con fábricas en Mánchester. Fue su gran amigo y colaborador durante cuarenta años, y lo mantuvo económicamente buena parte de su vida para que pudiera dedicarse a escribir." },
      { h: "El Manifiesto comunista", p: "En 1848, por encargo de la Liga de los Comunistas, Marx y Engels publicaron el Manifiesto comunista. Empieza diciendo que la historia de todas las sociedades es la historia de la lucha de clases, y termina con la famosa llamada: «¡Proletarios de todos los países, uníos!»." },
      { h: "El capital", p: "Pasó años estudiando en la sala de lectura del Museo Británico. En 1867 publicó el primer tomo de El capital, donde explica que el beneficio del capitalista sale de la plusvalía: el valor que crea el obrero con su trabajo por encima de lo que cobra. Los tomos segundo y tercero los terminó y publicó Engels después de su muerte. En 1864 participó en la fundación de la Primera Internacional, que reunía a organizaciones obreras de varios países." },
      { h: "Su legado", p: "Murió en Londres el 14 de marzo de 1883 y está enterrado en el cementerio de Highgate. En vida fue poco conocido, pero sus ideas, el marxismo, se convirtieron en una de las más influyentes de la historia: en su nombre se hicieron la Revolución rusa y los regímenes comunistas de la URSS, China o Cuba, y también influyeron en los partidos socialistas y socialdemócratas, en la sociología, la economía y la forma de estudiar la historia." }
    ]
  },
  { nace: "1878-12-18", f: "1953-03-05", fila: "personas", simbolo: "gobernante", t: "Iósif Stalin", nivel: 2, corto: "Stalin", cara: "stalin",
    resumen: "Nació en Gori (Georgia) el 18 de diciembre de 1878 y murió cerca de Moscú el 5 de marzo de 1953. Revolucionario bolchevique, se hizo con el poder en la Unión Soviética tras la muerte de Lenin y la gobernó como dictador durante casi treinta años. Industrializó el país a marchas forzadas y lo llevó a la victoria contra Hitler, pero su régimen causó millones de muertos por hambrunas, ejecuciones y campos de trabajo.",
    detalle: [
      { h: "De Georgia al seminario", p: "Se llamaba Iósif Vissariónovich Dzhugashvili y nació en Gori, en Georgia, entonces parte del Imperio ruso, hijo de un zapatero. Su madre quería que fuera sacerdote y lo metió en el seminario de Tiflis, pero allí empezó a leer a Marx y en 1899 dejó los estudios. Su lengua materna era el georgiano, y habló ruso con acento toda la vida." },
      { h: "El revolucionario", p: "Se unió a los bolcheviques de Lenin y organizó huelgas y atracos para financiar al partido, como el gran asalto a un furgón de dinero en Tiflis en 1907. La policía del zar lo detuvo y lo desterró varias veces a Siberia. Hacia 1912 adoptó el apodo de Stalin, que viene de stal, «acero»." },
      { h: "La conquista del poder", p: "Tras la Revolución de Octubre de 1917 fue comisario de las Nacionalidades, y en 1922 lo nombraron secretario general del Partido Comunista, un cargo que parecía administrativo y que él convirtió en el centro del poder. Lenin, poco antes de morir en 1924, advirtió en su testamento de que era demasiado brusco y propuso apartarlo. Stalin fue eliminando a sus rivales uno tras otro: Trotski fue expulsado del país en 1929 y asesinado en México en 1940 por un agente soviético." },
      { h: "Planes quinquenales y hambruna", p: "A partir de 1928 lanzó los planes quinquenales para convertir un país campesino en una potencia industrial, y obligó a los campesinos a entrar en granjas colectivas. Quienes se resistían, los llamados kulaks, fueron deportados o fusilados. La colectivización provocó la hambruna de 1932-1933, que mató a millones de personas, sobre todo en Ucrania (el Holodomor) y Kazajistán." },
      { h: "El Gran Terror", p: "Entre 1936 y 1938 desató el Gran Terror: juicios espectáculo en Moscú contra viejos bolcheviques que confesaban crímenes inventados, purgas en el ejército y detenciones masivas. Solo en 1937 y 1938 la policía política fusiló a unas 680.000 personas, y millones pasaron por el Gulag, la red de campos de trabajo forzado. En la Guerra Civil española la URSS apoyó a la República con armas, a cambio de buena parte de las reservas de oro del Banco de España." },
      { h: "La Segunda Guerra Mundial", p: "En agosto de 1939 firmó con Hitler el pacto Molotov-Ribbentrop y se repartió con él Polonia. El 22 de junio de 1941 Alemania invadió la URSS por sorpresa y llegó a las puertas de Moscú. La victoria en Stalingrado (1942-1943) cambió el rumbo de la guerra, y en 1945 el Ejército Rojo tomó Berlín. La URSS pagó el precio más alto: unos 27 millones de muertos. En Yalta y Potsdam, Stalin se repartió con Roosevelt, Churchill y Truman el mapa de la posguerra." },
      { h: "Guerra Fría y muerte", p: "Tras la guerra impuso regímenes comunistas en Europa del Este, tras lo que Churchill llamó el «telón de acero», y en 1949 la URSS probó su primera bomba atómica. Sufrió un derrame cerebral en su dacha de Kúntsevo y murió el 5 de marzo de 1953, con 74 años. En 1956 su sucesor, Jruschov, denunció sus crímenes y el culto a su persona en un famoso discurso secreto." }
    ] },
  { nace: "1879-03-14", f: "1955-04-18", fila: "personas", simbolo: "cientifico", t: "Albert Einstein", nivel: 2, corto: "Einstein", cara: "einstein",
    resumen: "Nació en Ulm (Alemania) el 14 de marzo de 1879 y murió en Princeton (Estados Unidos) el 18 de abril de 1955. Físico, autor de la teoría de la relatividad, que cambió nuestra forma de entender el espacio, el tiempo y la gravedad. Su fórmula E = mc² muestra que la masa y la energía son dos formas de lo mismo. Recibió el Nobel de Física de 1921 por explicar el efecto fotoeléctrico, una de las bases de la física cuántica, y se convirtió en el símbolo mismo del genio.",
    detalle: [
      { h: "Sus orígenes", p: "Nació el 14 de marzo de 1879 en Ulm, en una familia judía, y creció en Múnich. Que era mal alumno es un mito: destacaba en matemáticas y física, aunque detestaba la disciplina de la escuela alemana. Terminó el bachillerato en Suiza y en 1900 se tituló en el Politécnico de Zúrich, pero no consiguió plaza de profesor." },
      { h: "El empleado de patentes", p: "En 1902 entró a trabajar en la oficina de patentes de Berna, y en sus ratos libres siguió pensando en física. En 1905, su «año milagroso», publicó cuatro artículos que cambiaron la ciencia: la explicación del efecto fotoeléctrico, la del movimiento browniano (que demostró que los átomos existen), la relatividad especial y la equivalencia entre masa y energía, E = mc²." },
      { h: "La relatividad general", p: "En 1915 presentó la relatividad general: la gravedad no es una fuerza que actúa a distancia, sino la curvatura del espacio-tiempo que producen las masas. En 1919, una expedición del astrónomo Arthur Eddington midió durante un eclipse cómo el Sol desviaba la luz de las estrellas, tal como predecía la teoría. Al día siguiente, Einstein era famoso en todo el mundo." },
      { h: "El Nobel y la cuántica", p: "Recibió el Nobel de Física de 1921, pero no por la relatividad, entonces aún discutida, sino por el efecto fotoeléctrico, donde propuso que la luz está hecha de partículas, los fotones. Así ayudó a fundar la física cuántica, aunque nunca la aceptó del todo, porque se basa en el azar: de ahí su famosa frase «Dios no juega a los dados»." },
      { h: "Exilio y la bomba", p: "En 1933, con Hitler en el poder, se instaló en Estados Unidos, en el Instituto de Estudios Avanzados de Princeton, y nunca volvió a Alemania. En 1939 firmó una carta al presidente Roosevelt advirtiendo de que los nazis podían fabricar una bomba atómica, lo que ayudó a poner en marcha el Proyecto Manhattan. Después se arrepintió y defendió el pacifismo y el desarme. En 1952 le ofrecieron ser presidente de Israel y lo rechazó." },
      { h: "Su legado", p: "Murió en Princeton el 18 de abril de 1955. De sus ideas salen el GPS, que tiene que corregir los efectos de la relatividad, el láser, la energía nuclear, los agujeros negros y las ondas gravitacionales, detectadas por primera vez en 2015, cien años después de su teoría. La revista Time lo eligió personaje del siglo XX." }
    ]
  },
  { nace: "1889-04-20", f: "1945-04-30", fila: "personas", simbolo: "gobernante", t: "Adolf Hitler", nivel: 2, corto: "Hitler", cara: "hitler",
    resumen: "Nació en Braunau am Inn (Austria) el 20 de abril de 1889 y murió en Berlín el 30 de abril de 1945. Líder del partido nazi, fue canciller de Alemania desde 1933 y gobernó como dictador desde 1934. Su régimen desencadenó la Segunda Guerra Mundial al invadir Polonia en 1939 y fue responsable del Holocausto, en el que fueron asesinados unos seis millones de judíos y millones de personas más. Se suicidó en su búnker de Berlín días antes de la rendición alemana.",
    detalle: [
      { h: "Primeros años", p: "Nació el 20 de abril de 1889 en Braunau am Inn, en Austria. De joven quiso ser pintor, pero la Academia de Bellas Artes de Viena lo rechazó dos veces, en 1907 y 1908. Vivió en Viena con pocos medios y en 1913 se trasladó a Múnich, en Alemania." },
      { h: "La Primera Guerra Mundial", p: "Se alistó en el ejército bávaro y sirvió como mensajero en el frente occidental, donde recibió la Cruz de Hierro. La derrota de Alemania en 1918 y las duras condiciones del Tratado de Versalles alimentaron el resentimiento que después explotó en su política." },
      { h: "El ascenso al poder", p: "En 1919 entró en un pequeño partido nacionalista que pronto se convirtió en el Partido Nacionalsocialista (el partido nazi). En 1923 intentó un golpe de Estado en Múnich que fracasó; en la cárcel escribió Mein Kampf. Con la crisis económica de 1929 su partido creció mucho, y el 30 de enero de 1933 fue nombrado canciller. En 1934, a la muerte del presidente Hindenburg, reunió todo el poder y se proclamó Führer." },
      { h: "La dictadura", p: "Prohibió los demás partidos, persiguió a opositores y montó un Estado policial. Los judíos fueron excluidos de la vida pública, sobre todo a partir de las Leyes de Núremberg de 1935. En 1938 anexionó Austria y la región checa de los Sudetes." },
      { h: "La guerra y el Holocausto", p: "El 1 de septiembre de 1939 invadió Polonia, lo que desencadenó la Segunda Guerra Mundial. Durante la guerra, su régimen asesinó de forma sistemática a unos seis millones de judíos en el Holocausto, además de a millones de personas más: gitanos, personas con discapacidad, prisioneros de guerra soviéticos, opositores políticos y otros grupos." },
      { h: "El final", p: "Con el Ejército Rojo ya dentro de Berlín, se suicidó en su búnker el 30 de abril de 1945, junto a Eva Braun, con quien se había casado el día anterior. Una semana después, Alemania se rindió sin condiciones." }
    ]
  },
  { f: "-13800000000", fila: "hitos", t: "El Big Bang", icono: "bigbang", nivel: 1, siempre: true,
    fechaTxt: "hace c. 13.800 millones de años",
    resumen: "Hace unos 13.800 millones de años, todo el universo observable estaba concentrado en un estado extremadamente caliente y denso, y empezó a expandirse y enfriarse. No fue una explosión en un punto del espacio, sino la expansión del propio espacio, que sigue hasta hoy. De ahí salieron, con el tiempo, los átomos, las estrellas, las galaxias y, mucho después, el Sol y la Tierra.",
    detalle: [
      { h: "¿Qué fue?", p: "El Big Bang («gran explosión») no fue una explosión de materia en un espacio vacío, sino el inicio de la expansión del propio espacio. Al principio, todo lo que hoy forma el universo observable estaba a una temperatura y una densidad enormes. Al expandirse, el universo se fue enfriando, y eso permitió que se formaran, por orden, las partículas, los núcleos de los átomos, los átomos y, mucho después, las estrellas y las galaxias." },
      { h: "Cómo lo sabemos: el universo se expande", p: "En 1927, el sacerdote y físico belga Georges Lemaître propuso que el universo se expandía y que, yendo hacia atrás, debía de haber empezado en un «átomo primigenio». En 1929, Edwin Hubble mostró que las galaxias lejanas se alejan de nosotros, y más deprisa cuanto más lejos están. El nombre de Big Bang se lo puso en 1949, medio en broma, el astrónomo Fred Hoyle, que no creía en la teoría." },
      { h: "El eco del Big Bang", p: "En 1965, Arno Penzias y Robert Wilson detectaron por casualidad un ruido de microondas que llegaba de todas las direcciones del cielo: el fondo cósmico de microondas, la luz que quedó libre cuando el universo tenía unos 380.000 años y se hizo transparente. Fue la gran confirmación del Big Bang, y les valió el Nobel de Física en 1978. Satélites como COBE, WMAP y Planck lo han medido con muchísima precisión." },
      { h: "Los primeros minutos", p: "En los tres primeros minutos se formaron los núcleos de los elementos más ligeros: sobre todo hidrógeno y helio, con algo de litio. Las proporciones que predice la teoría coinciden con las que observamos hoy en el universo, otra de sus grandes pruebas. Los elementos más pesados, como el carbono, el oxígeno o el hierro de nuestro cuerpo, se fabricaron mucho después, dentro de las estrellas." },
      { h: "Estrellas y galaxias", p: "Tras unos cientos de millones de años de oscuridad, la gravedad juntó el gas en nubes que se encendieron como las primeras estrellas, y estas se agruparon en galaxias. El telescopio espacial James Webb, lanzado en 2021, está observando galaxias que ya existían cuando el universo tenía unos pocos cientos de millones de años." },
      { h: "Lo que aún no sabemos", p: "La teoría describe muy bien la evolución del universo desde una fracción de segundo después del inicio, pero no qué pasó exactamente en el primer instante ni si hubo un «antes». Tampoco sabemos qué son la materia oscura y la energía oscura, que juntas forman alrededor del 95 % del universo. La cifra de 13.800 millones de años sale sobre todo de las medidas del fondo cósmico de microondas." }
    ] },
  { f: "-13600000000", fila: "personas", t: "Primeras estrellas", icono: "estrellas", nivel: 1, siempre: true,
    fechaTxt: "hace c. 13.600 millones de años",
    resumen: "Unos 100 a 200 millones de años después del Big Bang, la gravedad juntó el gas de hidrógeno y helio en nubes que se encendieron como las primeras estrellas. Eran enormes, de decenas a cientos de veces la masa del Sol, muy calientes y de vida muy corta. Al morir, muchas en explosiones, sembraron el universo de los primeros elementos pesados.",
    detalle: [
      { h: "La edad oscura", p: "Tras el Big Bang, cuando el universo se enfrió lo suficiente para formar átomos, quedó lleno de gas de hidrógeno y helio, pero sin nada que brillara: es lo que se llama la «edad oscura» del universo. Durante unos cien millones de años, la gravedad fue juntando poco a poco el gas en las zonas algo más densas." },
      { h: "Se encienden las luces", p: "Cuando esas nubes se hicieron lo bastante densas y calientes, en su centro empezó la fusión nuclear: nacieron las primeras estrellas, hace unos 13.600 millones de años (la fecha exacta no se conoce). Los astrónomos las llaman estrellas de población III." },
      { h: "Gigantes de vida corta", p: "Como no había elementos pesados que ayudaran a enfriar el gas, las nubes no se fragmentaban fácilmente y las estrellas que nacían eran enormes: según los modelos, de decenas a cientos de veces la masa del Sol. Cuanto más grande es una estrella, más deprisa consume su combustible: vivían solo unos pocos millones de años." },
      { h: "Las fábricas de elementos", p: "En su interior fabricaron por primera vez elementos como el carbono, el oxígeno o el hierro, y al morir, a menudo como supernovas, los esparcieron por el espacio. Con ese material se formaron las siguientes generaciones de estrellas, y mucho después, el Sol, la Tierra y nosotros: estamos hechos de polvo de estrellas." },
      { h: "Nunca las hemos visto", p: "Ninguna estrella de primera generación se ha observado directamente: están demasiado lejos y hace mucho que murieron. Sabemos de ellas por la teoría y por sus huellas en las estrellas más viejas que conocemos, que tienen muy pocos elementos pesados. El telescopio espacial James Webb las está buscando en las galaxias más lejanas." }
    ] },
  { f: "-13500000000", fila: "libros", t: "Vía Láctea", icono: "galaxia", nivel: 1, siempre: true,
    fechaTxt: "hace c. 13.500 millones de años",
    resumen: "Nuestra galaxia empezó a formarse muy pronto: sus estrellas más antiguas tienen unos 13.500 millones de años. Después fue creciendo durante miles de millones de años, absorbiendo galaxias más pequeñas, y formó el disco y los brazos espirales que vemos hoy. Tiene entre 100.000 y 400.000 millones de estrellas, y el Sol es una de ellas.",
    detalle: [
      { h: "Nuestra galaxia", p: "La Vía Láctea es una galaxia espiral barrada de unos 100.000 años luz de diámetro, con entre 100.000 y 400.000 millones de estrellas. Su nombre viene de la mitología griega: la franja blanquecina que cruza el cielo nocturno sería leche derramada por la diosa Hera. Lo que vemos en realidad es el disco de la galaxia, de canto, desde dentro." },
      { h: "Un nacimiento muy temprano", p: "Las estrellas más antiguas de la Vía Láctea, que están sobre todo en el halo y en los cúmulos globulares que la rodean, tienen unos 13.000 a 13.500 millones de años: nuestra galaxia ya estaba formándose pocos cientos de millones de años después del Big Bang." },
      { h: "Creció comiéndose a otras", p: "Las galaxias crecen fusionándose. Gracias al satélite Gaia, de la Agencia Espacial Europea, se descubrió en 2018 que hace unos 10.000 millones de años la Vía Láctea absorbió una galaxia bastante grande, llamada Gaia-Encélado; todavía se ven sus estrellas moviéndose de forma distinta. Hoy sigue engullendo galaxias pequeñas, como la galaxia enana de Sagitario." },
      { h: "El agujero negro del centro", p: "En el centro de la Vía Láctea hay un agujero negro supermasivo, Sagitario A*, de unos 4 millones de veces la masa del Sol. Reinhard Genzel y Andrea Ghez recibieron el Nobel de Física en 2020 por demostrar su existencia siguiendo las órbitas de las estrellas cercanas, y en 2022 el Event Horizon Telescope publicó la primera imagen de su sombra." },
      { h: "Dónde estamos", p: "El Sol está a unos 26.000 años luz del centro, en un brazo menor, el brazo de Orión, y tarda unos 230 millones de años en dar una vuelta completa a la galaxia. Dentro de unos 4.500 millones de años, la Vía Láctea chocará y se fusionará con su vecina, la galaxia de Andrómeda." }
    ] },
  { f: "-4567000000", fila: "personas", t: "Nace el Sol", icono: "solJoven", nivel: 1, siempre: true,
    fechaTxt: "hace c. 4.600 millones de años",
    resumen: "El Sol nació hace unos 4.600 millones de años, cuando una nube de gas y polvo de la Vía Láctea se contrajo por su propia gravedad. En el centro se encendió la fusión nuclear y alrededor quedó un disco de material del que, en pocas decenas de millones de años, se formaron los planetas, entre ellos la Tierra. Es una estrella de segunda o tercera generación: contiene restos de estrellas anteriores.",
    detalle: [
      { h: "Una nube que se contrae", p: "Hace unos 4.600 millones de años, en un brazo de la Vía Láctea, una nube de gas y polvo empezó a contraerse, quizá empujada por la onda de choque de una supernova cercana. Al encogerse, giraba cada vez más deprisa y se aplanaba en forma de disco, con la mayor parte de la materia concentrada en el centro." },
      { h: "Se enciende", p: "En el centro, la presión y la temperatura subieron hasta que el hidrógeno empezó a fusionarse en helio: nació el Sol. La edad se calcula con mucha precisión gracias a los granos más antiguos de algunos meteoritos, que tienen unos 4.567 millones de años y se consideran los primeros sólidos del sistema solar." },
      { h: "Hecho de restos de estrellas", p: "El Sol no es una estrella de primera generación: además de hidrógeno y helio contiene pequeñas cantidades de elementos más pesados, como carbono, oxígeno o hierro, que solo pudieron fabricarse dentro de estrellas anteriores que ya habían muerto. Lo mismo vale para la Tierra y para nosotros." },
      { h: "El disco de los planetas", p: "Del disco que quedó alrededor del Sol nacieron los planetas: cerca, donde hacía calor, los rocosos (Mercurio, Venus, la Tierra y Marte); más lejos, donde el hielo podía existir, los gigantes de gas y hielo (Júpiter, Saturno, Urano y Neptuno). Los restos que sobraron son los asteroides y los cometas." },
      { h: "Una estrella corriente", p: "El Sol es una estrella bastante normal, una enana amarilla. Contiene más del 99 % de la masa de todo el sistema solar, y su luz tarda unos 8 minutos y 20 segundos en llegar a la Tierra. Está más o menos a mitad de su vida: le quedan unos 5.000 millones de años antes de convertirse en una gigante roja." }
    ] },
  { f: "-445000000", fila: "hitos", t: "Extinción del Ordovícico", icono: "calavera", nivel: 1, verDesde: 1.5e9,
    fechaTxt: "hace c. 445 millones de años",
    resumen: "La primera de las cinco grandes extinciones. Hace unos 445 millones de años, una glaciación enfrió el planeta, bajó el nivel del mar y secó las plataformas marinas donde vivía casi toda la vida, que entonces estaba en el mar. Desapareció en torno al 85 % de las especies.",
    detalle: [
      { h: "Qué pasó", p: "A finales del Ordovícico, el supercontinente Gondwana estaba sobre el polo sur y se cubrió de hielo. El agua quedó atrapada en los glaciares, el nivel del mar bajó y los mares poco profundos, llenos de trilobites, braquiópodos y otros animales marinos, se secaron o se enfriaron. Cuando el hielo se fundió, el cambio brusco provocó una segunda oleada de extinciones." },
      { h: "Las cinco grandes", p: "Los paleontólogos hablan de cinco grandes extinciones masivas: la del Ordovícico (hace c. 445 millones de años), la del Devónico tardío (c. 372), la del Pérmico (252), la del Triásico (201) y la del Cretácico (66), la del asteroide. Muchos científicos creen que hoy, por la acción humana, podría estar empezando una sexta." }
    ] },

const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
// Fecha → año con decimales (para colocarlo en la línea) y texto a mostrar
function leerFecha(f){
  const neg = f.startsWith("-");
  const [a, m, d] = (neg ? f.slice(1) : f).split("-").map(Number);
  const año = neg ? -a : a;
  const frac = m ? ((m - 1) + (d ? (d - 1) / 31 : 0)) / 12 : 0.5;
  const txtA = neg ? `${a.toLocaleString("es-ES")} a.C.` : String(a);
  const txt = d ? `${d} ${MESES[m - 1]} ${txtA}` : m ? `${MESES[m - 1]} ${txtA}` : txtA;
  return { año: año + frac, txt };
}
EVENTOS.forEach((e, i) => {
  Object.assign(e, leerFecha(e.f)); e.id = i;
  if (e.desde){                                  // periodo: de "desde" a "f"
    const d = leerFecha(e.desde);
    e.añoDesde = d.año; e.añoHasta = e.año;
    if (e.desvanece) e.añoDesvanece = leerFecha(e.desvanece).año;
    if (e.solidoDesde) e.añoSolido = leerFecha(e.solidoDesde).año;   // inicio difuso: se aclara hacia "desde"
    const soloAño = f => f.startsWith("-") ? f.slice(1).split("-")[0] + " a.C." : f.split("-")[0] + (e.desde.startsWith("-") ? " d.C." : "");
    e.txt = e.fechas || `${soloAño(e.desde)} – ${soloAño(e.f)}`;   // "fechas": texto propio si hace falta
    e.año = (e.añoDesde + e.añoHasta) / 2;
  }
  if (e.nace){                                   // persona: tramo de vida
    const n = leerFecha(e.nace);
    e.añoNace = n.año; e.añoMuere = e.año;
    const c = e.aprox ? "c. " : "", cN = (e.aprox || e.aproxNace) ? "c. " : "";
    const dC = (txt, f) => (n.txt.includes("a.C.") && !f.startsWith("-") ? txt + " d.C." : txt);
    e.txt = `${cN}${n.txt} – ${c}${dC(e.txt, e.f)}`;
    // Años cortos para la etiqueta del tramo
    const soloAño = f => f.startsWith("-") ? f.slice(1).split("-")[0] + " a.C." : f.split("-")[0];
    const quitaAC = s => (s.endsWith(" a.C.") && e.f.startsWith("-") ? s.slice(0, -5) : s);  // "470–399 a.C."
    e.etiqueta = `${e.corto || e.t} · ${cN}${quitaAC(soloAño(e.nace))}–${c}${dC(soloAño(e.f), e.f)}`;
    e.año = (e.añoNace + e.añoMuere) / 2;        // la cara va en medio de su vida
    // Años que vivió (sin año 0: del 4 a.C. al 30 d.C. van 33 años)
    const partes = f => { const neg = f.startsWith("-"); const [y, m, d] = (neg ? f.slice(1) : f).split("-").map(Number); return { y: neg ? -y : y, m, d }; };
    const N = partes(e.nace), M = partes(e.f);
    let edad = M.y - N.y - (N.y < 0 && M.y > 0 ? 1 : 0);
    if (N.m && M.m && (M.m < N.m || (M.m === N.m && (M.d || 1) < (N.d || 1)))) edad--;
    if (e.reinado){                               // faraones: el tramo es su reinado, no su vida
      // (de casi ninguno se sabe cuándo nació: entre paréntesis, los años que reinó)
      // Entre paréntesis, lo que vivió (estimado por su momia o por las fuentes); si no se sabe, se dice
      // Si se conoce lo que vivió, va entre paréntesis como en los demás personajes; si no, nada
      e.edad = e.vivio || "";
      const par = e.edad ? ` (${e.edad})` : "";
      e.etiqueta = e.etiqueta.replace(" · ", " · reinó ");
      e.etiquetaFechas = e.etiqueta;
      e.etiqueta += par;
      e.txt = "reinó " + e.txt + par;
    } else {
      e.edad = e.vivio || `${cN || c ? "c. " : ""}${edad} años`;   // "vivio": edad propia si la fecha no basta
      e.txt += ` (${e.edad})`;
      e.etiquetaFechas = e.etiqueta;
      e.etiqueta += ` (${e.edad})`;
    }
  }
  if (!e.nace && !e.desde){                      // año corto para los iconos ("1866", "c. 750 a.C.")
    const c = e.aprox ? "c. " : "";
    e.añoTxt = c + (e.f.startsWith("-") ? e.f.slice(1).split("-")[0] + " a.C." : e.f.split("-")[0]);
    if (e.aprox) e.txt = "c. " + e.txt;
    if (e.fechaTxt) e.txt = e.añoTxt = e.fechaTxt;
  }
});
asignarCarrilesPendiente = true;
const TINTA = "#1e1e1e";
const FUENTE = '"Caveat", system-ui, sans-serif';            // letra a mano
const MARCADOR = '"Permanent Marker", system-ui, sans-serif';  // rotulador
const AMARILLO = "rgba(255, 210, 63, .85)";
// Trazo de fluorescente en el lienzo
function fluorLienzo(x1, x2, y, alto, semilla){
  const r = aleatorio(semilla);
  ctx.save(); ctx.globalCompositeOperation = "multiply";
  ctx.strokeStyle = AMARILLO; ctx.lineCap = "round"; ctx.lineWidth = alto;
  ctx.beginPath(); ctx.moveTo(x1, y + (r() - .5) * 3);
  ctx.quadraticCurveTo((x1 + x2) / 2, y + (r() - .5) * 5, x2, y + (r() - .5) * 3);
  ctx.stroke(); ctx.restore();
}

const cv = document.getElementById("lienzo");
const ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;

// Vista: año en el centro de la pantalla, píxeles por año y desplazamiento vertical
let centro = 0, ppa = 1, despY = 0, ppaInicial = 1;
const PPA_MAX = 4000;                       // 1 año ocupa 4.000 px
const ppaMin = () => W / 2.5e10;            // 25.000 millones de años en pantalla

function tamaño(){
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

const ZOOM_INICIO = 4.22;
function vistaInicial(){
  ppaInicial = W / 5000;                    // referencia del 100 %: de 2.500 a.C. a 2.500 d.C.
  ppa = ppaInicial * ZOOM_INICIO; centro = 0; despY = 0;   // al abrir: zoom al 422 % con el año 0 en medio
}

// --- Trazo a mano alzada (al estilo Excalidraw): dos pasadas algo curvas ---
function aleatorio(semilla){
  let s = Math.abs(Math.floor(semilla * 9973 + 12345)) % 2147483646 + 1;
  return () => (s = (s * 16807) % 2147483647) / 2147483647;
}
function raya(x1, y1, x2, y2, semilla, grosor = 2, pasadas = 2){
  const r = aleatorio(semilla);
  const largo = Math.hypot(x2 - x1, y2 - y1) || 1;
  const nx = -(y2 - y1) / largo, ny = (x2 - x1) / largo;   // perpendicular
  const curva = Math.min(largo * 0.012, 3);
  ctx.strokeStyle = TINTA; ctx.lineCap = "round"; ctx.lineWidth = grosor;
  for (let p = 0; p < pasadas; p++){
    const j = () => (r() - .5) * Math.min(3, largo * 0.03);
    const ax = x1 + j(), ay = y1 + j(), bx = x2 + j(), by = y2 + j();
    const t = 0.4 + r() * 0.2, d = (r() - .5) * 2 * curva;
    const cx = ax + (bx - ax) * t + nx * d, cy = ay + (by - ay) * t + ny * d;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(cx, cy, bx, by); ctx.stroke();
  }
}

// --- Escala ---
const xDe = año => W / 2 + (año - centro) * ppa;
const añoDe = x => centro + (x - W / 2) / ppa;

function intervalo(){
  // Paso "redondo" (1, 2, 5 × 10^n años) para que las marcas queden a ~130 px
  // Con años muy grandes las etiquetas son más largas: más separación entre marcas
  const largo = Math.max(0, Math.log10(130 / ppa) - 3);
  const bruto = (130 + largo * 28) / ppa;
  const e = Math.pow(10, Math.floor(Math.log10(bruto)));
  const m = bruto / e;
  const paso = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e;
  const sub = paso / ((paso / e) === 2 ? 4 : 5);
  return { paso: Math.max(paso, 1), sub: Math.max(sub, paso >= 5 ? 1 : paso / 4) };
}

function etiqueta(año){
  const a = Math.round(Math.abs(año) * 100) / 100;
  const txt = a >= 10000 ? a.toLocaleString("es-ES") : String(a);
  if (año === 0) return "0";
  return año < 0 ? `${txt} a.C.` : `${txt} d.C.`;
}

// Límites del lienzo: del Big Bang a la muerte del Sol, con algo de margen.
// Al alejarse del todo, la vista se centra sola para que se vea todo.
const LIMITE_MIN = -16e9, LIMITE_MAX = 8e9;
function limitarVista(){
  const span = W / ppa;
  if (span >= LIMITE_MAX - LIMITE_MIN) centro = (LIMITE_MIN + LIMITE_MAX) / 2;
  else centro = Math.min(LIMITE_MAX - span / 2, Math.max(LIMITE_MIN + span / 2, centro));
}
function dibujar(){
  limitarVista();
  ctx.clearRect(0, 0, W, H);
  const yL = Math.max(440, H * 0.73) + despY; // altura de la línea
  const { paso, sub } = intervalo();
  const desde = añoDe(-60), hasta = añoDe(W + 60);

  // Línea principal, troceada por marcas para que no "baile" al moverla
  const ini = Math.floor(desde / paso) * paso;
  for (let a = ini; a < hasta; a += paso){
    raya(xDe(a), yL, xDe(a + paso), yL, a / paso + 0.5, 2.6);
  }

  // Escala geológica (eones, eras y periodos) debajo de la línea
  dibujarGeologia(yL);

  // Periodos (imperios…): franja de rotulador sobre la línea
  dibujarPeriodos(yL);

  // Marcas pequeñas
  if (sub * ppa > 8){
    const iniS = Math.floor(desde / sub) * sub;
    for (let a = iniS; a < hasta; a += sub){
      if (Math.abs(a / paso - Math.round(a / paso)) < 1e-9) continue;
      const x = xDe(a);
      raya(x, yL - 6, x, yL + 6, a / sub + 0.3, 1.4);
    }
  }

  // Marcas grandes con su año
  ctx.fillStyle = TINTA; ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let a = ini; a < hasta; a += paso){
    const año = Math.round(a * 1e6) / 1e6;
    const x = xDe(año);
    const cero = año === 0;
    raya(x, yL - (cero ? 34 : 16), x, yL + (cero ? 34 : 16), año / paso + 0.7, cero ? 3 : 2);
    if (cero){
      fluorLienzo(x - 18, x + 18, yL + 56, 20, 5);
      ctx.font = `28px ${MARCADOR}`; ctx.fillStyle = TINTA;
      ctx.fillText("0", x, yL + 38);
    } else {
      ctx.font = `600 22px ${FUENTE}`; ctx.fillStyle = TINTA;
      ctx.fillText(etiqueta(año), x, yL + 20);
    }
  }

  // Año 0 siempre visible si está en pantalla aunque no caiga en marca
  if (paso > 1 && 0 > desde && 0 < hasta && Math.abs(Math.round(0 / paso) * paso) !== 0){
    const x = xDe(0); raya(x, yL - 34, x, yL + 34, 0.11, 3);
  }

  // Eventos: cada uno en su fila (invisible), debajo de la línea
  dibujarEventos(yL);

  // Hoy
  const xh = xDe(AÑO_HOY);
  if (xh > -80 && xh < W + 80){
    raya(xh, yL - 24, xh, yL + 10, 7.77, 2.6);
    ctx.font = `17px ${MARCADOR}`; ctx.textBaseline = "bottom";
    const wh = ctx.measureText(`HOY ${AÑO_HOY}`).width;
    fluorLienzo(xh - wh / 2 - 4, xh + wh / 2 + 4, yL - 36, 14, 9);
    ctx.fillStyle = TINTA; ctx.fillText(`HOY ${AÑO_HOY}`, xh, yL - 28);
    ctx.textBaseline = "top";
  }

  // Flechas en los extremos: la línea sigue
  raya(W - 30, yL - 10, W - 14, yL, 3.1, 2.4); raya(W - 30, yL + 10, W - 14, yL, 3.2, 2.4);
  raya(30, yL - 10, 14, yL, 4.1, 2.4);         raya(30, yL + 10, 14, yL, 4.2, 2.4);

  document.getElementById("nivel").textContent = formatoZoom(ppa / ppaInicial);
}


// --- Tarjetas de eventos, estilo Excalidraw ---
const ALTO_TARJETA = 54, SEP_FILAS = 64;
function caja(x, y, w, h, semilla){
  raya(x, y, x + w, y, semilla + .1, 1.6);
  raya(x + w, y, x + w, y + h, semilla + .2, 1.6);
  raya(x + w, y + h, x, y + h, semilla + .3, 1.6);
  raya(x, y + h, x, y, semilla + .4, 1.6);
}
// Borde superior de la tarjeta según su fila
function yFila(fila, yL){
  const F = FILAS[fila];
  return F.lado < 0 ? yL - 30 - F.n * SEP_FILAS          // encima: 1 = la más cercana
                    : yL + 76 + (F.n - 1) * SEP_FILAS;    // debajo, tras las fechas
}
// --- Dibujos a mano ---
let zonas = [];                                  // zonas pulsables de los eventos
function circuloMano(cx, cy, r, semilla, grosor = 2){
  const a = aleatorio(semilla);
  ctx.strokeStyle = TINTA; ctx.lineWidth = grosor; ctx.lineCap = "round";
  for (let p = 0; p < 2; p++){
    const ini = a() * Math.PI * 2, giro = Math.PI * 2 + 0.35;
    ctx.beginPath();
    for (let k = 0; k <= 36; k++){
      const ang = ini + giro * k / 36;
      const rr = r + (a() - .5) * 1.6 + p * 1.2;
      const px = cx + Math.cos(ang) * rr, py = cy + Math.sin(ang) * rr;
      k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
  }
}
// Bombilla dibujada a mano; (cx, cy) = centro del cristal
function bombilla(cx, cy, semilla){
  const s = semilla * 13 + 3;
  // Brillo amarillo de fluorescente detrás
  ctx.save(); ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = AMARILLO; ctx.beginPath(); ctx.arc(cx + 1, cy + 1, 19, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // Cristal y cuello
  circuloMano(cx, cy, 17, s, 2.2);
  raya(cx - 9, cy + 14, cx - 7, cy + 26, s + 1, 2.2);
  raya(cx + 9, cy + 14, cx + 7, cy + 26, s + 2, 2.2);
  // Casquillo con rosca
  raya(cx - 9, cy + 26, cx + 9, cy + 26, s + 3, 2.2);
  raya(cx - 8, cy + 31, cx + 8, cy + 31, s + 4, 2);
  raya(cx - 7, cy + 36, cx + 7, cy + 36, s + 5, 2);
  raya(cx - 3, cy + 40, cx + 3, cy + 40, s + 6, 2);
  // Filamento en zigzag
  ctx.lineWidth = 1.6; ctx.beginPath();
  ctx.moveTo(cx - 4, cy + 14); ctx.lineTo(cx - 5, cy + 2);
  ctx.lineTo(cx - 2, cy - 3); ctx.lineTo(cx, cy + 2); ctx.lineTo(cx + 2, cy - 3);
  ctx.lineTo(cx + 5, cy + 2); ctx.lineTo(cx + 4, cy + 14); ctx.stroke();
  // Rayitas de luz
  raya(cx - 27, cy - 14, cx - 33, cy - 19, s + 7, 2);
  raya(cx, cy - 25, cx, cy - 32, s + 8, 2);
  raya(cx + 27, cy - 14, cx + 33, cy - 19, s + 9, 2);
  raya(cx - 30, cy + 2, cx - 37, cy + 2, s + 10, 2);
  raya(cx + 30, cy + 2, cx + 37, cy + 2, s + 11, 2);
}

// Lechuza pequeñita, el animal de Atenea: sello de los filósofos junto a la cara
function lechuza(cx, cy){
  ctx.save(); ctx.strokeStyle = TINTA; ctx.lineJoin = "round"; ctx.lineWidth = 1.4;
  // Cuerpo con orejas de plumas
  ctx.beginPath();
  ctx.moveTo(cx - 7, cy - 6);
  ctx.lineTo(cx - 6.5, cy - 11); ctx.lineTo(cx - 3, cy - 7.5);
  ctx.quadraticCurveTo(cx, cy - 8.5, cx + 3, cy - 7.5);
  ctx.lineTo(cx + 6.5, cy - 11); ctx.lineTo(cx + 7, cy - 6);
  ctx.quadraticCurveTo(cx + 9, cy + 4, cx, cy + 9.5);
  ctx.quadraticCurveTo(cx - 9, cy + 4, cx - 7, cy - 6);
  ctx.closePath();
  ctx.fillStyle = "rgba(190, 140, 80, .97)"; ctx.fill(); ctx.stroke();
  // Pecho más claro con plumitas
  ctx.fillStyle = "rgba(245, 225, 185, .97)";
  ctx.beginPath(); ctx.ellipse(cx, cy + 3.5, 4, 4.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = .8;
  for (const [dx, dy] of [[-1.5, 2], [1.5, 2], [0, 4.5], [-2, 5.5], [2, 5.5]]){
    ctx.beginPath(); ctx.moveTo(cx + dx - 1, cy + dy); ctx.quadraticCurveTo(cx + dx, cy + dy + 1, cx + dx + 1, cy + dy); ctx.stroke();
  }
  // Ojos grandes
  ctx.lineWidth = 1.1;
  for (const k of [-1, 1]){
    ctx.fillStyle = "#fffdf7"; ctx.beginPath(); ctx.arc(cx + k * 3.1, cy - 3, 2.9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = TINTA; ctx.beginPath(); ctx.arc(cx + k * 3.1, cy - 3, 1.3, 0, Math.PI * 2); ctx.fill();
  }
  // Pico
  ctx.fillStyle = "rgba(240, 150, 30, .95)";
  ctx.beginPath(); ctx.moveTo(cx - 1.2, cy - .6); ctx.lineTo(cx + 1.2, cy - .6); ctx.lineTo(cx, cy + 1.6); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// Probeta pequeñita con líquido y burbujas: sello de los científicos junto a la cara
function probeta(cx, cy){
  ctx.save(); ctx.strokeStyle = TINTA; ctx.lineJoin = "round"; ctx.lineCap = "round";
  const w = 3.6, top = cy - 11, bot = cy + 8;
  // Líquido verde en la mitad de abajo
  ctx.save(); ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "rgba(70, 190, 110, .9)";
  ctx.fillRect(cx - w, cy - 1, w * 2, bot - (cy - 1));
  ctx.restore();
  // Burbujas
  ctx.lineWidth = .9;
  for (const [dx, dy, rr] of [[-1, 4.5, 1.1], [1.3, 1.5, .9], [-.5, -4, .8], [.8, -7, .6]]){
    ctx.beginPath(); ctx.arc(cx + dx, cy + dy, rr, 0, Math.PI * 2); ctx.stroke();
  }
  // Tubo, con el borde de arriba abierto hacia fuera
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx - w - 1.6, top); ctx.lineTo(cx - w, top + 1.4);
  ctx.lineTo(cx - w, bot); ctx.lineTo(cx + w, bot);
  ctx.lineTo(cx + w, top + 1.4); ctx.lineTo(cx + w + 1.6, top);
  ctx.stroke();
  // Pie
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(cx - w - 3, bot + 2); ctx.lineTo(cx + w + 3, bot + 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - w, bot); ctx.lineTo(cx - w - 1.5, bot + 2); ctx.moveTo(cx + w, bot); ctx.lineTo(cx + w + 1.5, bot + 2); ctx.stroke();
  // Rayitas de medida
  ctx.lineWidth = .9;
  for (let j = 0; j < 4; j++){
    const yy = top + 4 + j * 3.6;
    ctx.beginPath(); ctx.moveTo(cx - w, yy); ctx.lineTo(cx - w + (j % 2 ? 2.4 : 1.4), yy); ctx.stroke();
  }
  ctx.restore();
}

// Paleta de pintor con manchas de colores: el símbolo del arte en general, sello de los artistas
function paleta(cx, cy){
  ctx.save(); ctx.strokeStyle = TINTA; ctx.lineJoin = "round"; ctx.lineWidth = 1.5;
  // Contorno en forma de riñón, con la muesca para el pulgar abajo a la derecha
  ctx.beginPath();
  ctx.moveTo(cx + 6, cy + 6.5);
  ctx.quadraticCurveTo(cx - 1, cy + 9.5, cx - 7, cy + 6);
  ctx.quadraticCurveTo(cx - 12, cy + 1, cx - 9, cy - 5);
  ctx.quadraticCurveTo(cx - 3, cy - 10.5, cx + 5, cy - 8);
  ctx.quadraticCurveTo(cx + 12, cy - 5, cx + 11, cy + 1);
  ctx.quadraticCurveTo(cx + 10.5, cy + 4, cx + 7.5, cy + 3);
  ctx.quadraticCurveTo(cx + 4.5, cy + 3, cx + 6, cy + 6.5);
  ctx.closePath();
  ctx.fillStyle = "rgba(225, 185, 130, .97)"; ctx.fill(); ctx.stroke();
  // Agujero para el pulgar
  ctx.fillStyle = "#f6f4ee"; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.ellipse(cx + 3.5, cy - 1, 1.8, 1.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // Manchas de pintura
  ctx.lineWidth = .8;
  for (const [dx, dy, col] of [[-6.5, 1.5, "rgba(220, 50, 50, .95)"], [-5, -4.5, "rgba(255, 205, 40, .95)"],
                               [.5, -6, "rgba(50, 110, 210, .95)"], [6.5, -4, "rgba(60, 170, 90, .95)"], [-1.5, 5, "rgba(150, 80, 170, .95)"]]){
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx + dx, cy + dy, 1.9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

// Bastón de mando en diagonal (terciopelo azul con estrellas y remates dorados): sello de los gobernantes
function baston(cx, cy){
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-Math.PI / 4);
  ctx.strokeStyle = TINTA; ctx.lineJoin = "round"; ctx.lineWidth = 1.4;
  const L = 11, g = 2.8, tapa = 3;
  // Cuerpo
  ctx.fillStyle = "rgba(40, 70, 160, .97)";
  ctx.beginPath(); ctx.rect(-L + tapa, -g, 2 * (L - tapa), 2 * g); ctx.fill(); ctx.stroke();
  // Estrellitas doradas
  ctx.fillStyle = "rgba(255, 205, 40, .98)";
  for (const dx of [-4, 0, 4]){ ctx.beginPath(); ctx.arc(dx, 0, 1, 0, Math.PI * 2); ctx.fill(); }
  // Remates dorados en los extremos
  for (const k of [-1, 1]){
    const x0 = k < 0 ? -L : L - tapa;
    ctx.fillStyle = "rgba(230, 175, 40, .98)";
    ctx.beginPath(); ctx.rect(x0, -g - .8, tapa, 2 * g + 1.6); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

// Tramo de la vida de una persona: |———— (cara) ————|
function tramoVida(it, y){
  const e = it.e, r = 23, x = it.x, s = e.id * 17 + 5;
  const x1 = xDe(e.añoNace), x2 = xDe(e.añoMuere);
  // Por etapas según el zoom: 1 = cara y nombre; 2 = además la raya de vida y las fechas; 3 = además la edad
  const etapa = it.etapa || 3;
  if (etapa >= 2){
  // La raya de vida, de una sola pasada (con dos, a veces se veía doble)
  if (x - r - 8 - x1 > 4) raya(x1, y, x - r - 8, y, s + 1, 2.6, 1);
  if (x2 - (x + r + 8) > 4) raya(x + r + 8, y, x2, y, s + 2, 2.6, 1);
  if (x2 - x1 > 2 * r + 20){                    // topes en los extremos
    raya(x1, y - 8, x1, y + 8, s + 3, 2.2);
    raya(x2, y - 8, x2, y + 8, s + 4, 2.2);
  }
  }
  cara(e.cara, x, y, r, s);
  // Icono de su oficio, fuera de la cara arriba a la izquierda, con hueco para que no la toque
  if (e.simbolo === "filosofo") lechuza(x - r * 1.45, y - r * 1.27);
  if (e.simbolo === "cientifico") probeta(x - r * 1.45, y - r * 1.27);
  if (e.simbolo === "artista") paleta(x - r * 1.45, y - r * 1.27);
  if (e.simbolo === "gobernante") baston(x - r * 1.45, y - r * 1.27);
  // Nombre (y años): se guardan para dibujarlos al final, encima de todas las caras
  const txt = etapa === 1 ? (e.corto || e.t) : etapa === 2 ? (e.etiquetaFechas || e.etiqueta) : e.etiqueta;
  nombresPendientes.push({ txt, x: x + r * 1.5 + 6, y: y - 4, a: ctx.globalAlpha });
}
let nombresPendientes = [];
function dibujarNombres(){
  ctx.save(); ctx.textAlign = "left"; ctx.textBaseline = "bottom"; ctx.font = `600 17px ${FUENTE}`;
  ctx.lineJoin = "round"; ctx.lineWidth = 4; ctx.strokeStyle = "rgba(246, 244, 238, .95)"; ctx.fillStyle = "#555";
  for (const n of nombresPendientes){ ctx.globalAlpha = n.a; ctx.strokeText(n.txt, n.x, n.y); ctx.fillText(n.txt, n.x, n.y); }
  ctx.restore(); nombresPendientes = [];
}
// Caras a modo de caricatura

    for (let k = -6; k <= 6; k++){ ctx.beginPath(); ctx.moveTo(x + k * r * .19 - r, y - r * 1.4); ctx.lineTo(x + k * r * .19 + r * .25, y + r * 1.1); ctx.stroke(); }
    ctx.restore();
  };
  const ojosKohl = (fem) => {
    ctx.fillStyle = TINTA; ctx.strokeStyle = TINTA;
    for (const k of [-1, 1]){
      ctx.beginPath(); ctx.arc(x + k * r * .3, y - r * .06, 2, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(x + k * r * .14, y - r * .08); ctx.quadraticCurveTo(x + k * r * .3, y - r * .18, x + k * r * .6, y - r * .08); ctx.stroke();

    ctx.fillStyle = TINTA;
    // Mechón sobre la frente
    ctx.beginPath();

    ctx.beginPath(); ctx.moveTo(x - r * .2, y + r * .62); ctx.quadraticCurveTo(x, y + r * .56, x + r * .2, y + r * .62); ctx.stroke();
    // Barbilla
    ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(x - r * .1, y + r * .82); ctx.quadraticCurveTo(x, y + r * .87, x + r * .1, y + r * .82); ctx.stroke();
  }
  if (quien === "stalin"){
    ctx.strokeStyle = TINTA; ctx.fillStyle = TINTA; ctx.lineCap = "round";

    ctx.quadraticCurveTo(x, y - r * 1.3, x + r * .45, y - r * 1.16);
    ctx.quadraticCurveTo(x + r * 1.12, y - r * .95, x + r * .96, y - r * .2);

    ctx.quadraticCurveTo(x, y - r * .5, x - r * .5, y - r * .62);

    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x, y - r * .08); ctx.lineTo(x - r * .06, y + r * .28); ctx.quadraticCurveTo(x + r * .02, y + r * .34, x + r * .1, y + r * .28); ctx.stroke();

  if (quien === "colon"){

    // Ojos con mirada lejana y cejas algo arqueadas

    }
    // Nariz larga

    // Boca fina y sin barba
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x - r * .18, y + r * .6); ctx.quadraticCurveTo(x, y + r * .64, x + r * .18, y + r * .6); ctx.stroke();
  }
  if (quien === "magallanes"){
    ctx.strokeStyle = TINTA; ctx.fillStyle = TINTA; ctx.lineCap = "round"; ctx.lineJoin = "round";
    // Pelo corto y oscuro
    ctx.beginPath();

    ctx.quadraticCurveTo(x + r * .85, y - r * .58, x + r * .4, y - r * .62);

    // Barba oscura y poblada, acabada en punta

    ctx.quadraticCurveTo(x - r * .95, y + r * .75, x, y + r * 1.22);

    ctx.quadraticCurveTo(x + r * .72, y + r * .25, x + r * .45, y + r * .32);

    // Rizos de la barba

      ctx.beginPath(); ctx.arc(x + dx * r, y + dy * r, r * .07, Math.PI * .2, Math.PI * 1.3); ctx.stroke();
    }

    ctx.fillStyle = TINTA;
    // Ojos y cejas fruncidas
    for (const k of [-1, 1]){

      ctx.lineWidth = 1.8;

  if (quien === "miguelangel"){
    ctx.strokeStyle = TINTA; ctx.fillStyle = TINTA; ctx.lineCap = "round"; ctx.lineJoin = "round";

    for (let k = -5; k <= 5; k++){
      const ang = Math.PI * (1.5 + k * .09);

    for (const k of [-1, 1]){                    // rizos sobre las orejas

    }
    // Barba corta partida en dos puntas
    ctx.beginPath();
    ctx.moveTo(x - r * .85, y + r * .2);
    ctx.quadraticCurveTo(x - r * .7, y + r * .9, x - r * .2, y + r * 1.2);
    ctx.lineTo(x, y + r * .98);
    ctx.lineTo(x + r * .2, y + r * 1.2);
    ctx.quadraticCurveTo(x + r * .7, y + r * .9, x + r * .85, y + r * .2);
    ctx.quadraticCurveTo(x + r * .55, y + r * .48, x + r * .3, y + r * .45);
    ctx.quadraticCurveTo(x, y + r * .38, x - r * .3, y + r * .45);
    ctx.quadraticCurveTo(x - r * .55, y + r * .48, x - r * .85, y + r * .2);
    ctx.fillStyle = "rgba(70, 60, 55, .95)"; ctx.fill(); ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = TINTA;
    // Ojos hundidos y ceño
    for (const k of [-1, 1]){
      ctx.beginPath(); ctx.arc(x + k * r * .3, y - r * .1, 1.9, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 1.7;
      ctx.beginPath(); ctx.moveTo(x + k * r * .12, y - r * .3); ctx.quadraticCurveTo(x + k * r * .3, y - r * .36, x + k * r * .46, y - r * .28); ctx.stroke();
    }
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x - r * .2, y - r * .5); ctx.lineTo(x + r * .2, y - r * .5); ctx.stroke();   // arruga de la frente
    // Nariz rota: aplastada y torcida
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x - r * .02, y - r * .18); ctx.lineTo(x + r * .08, y + r * .02); ctx.lineTo(x - r * .04, y + r * .12);
    ctx.quadraticCurveTo(x - r * .14, y + r * .26, x - r * .02, y + r * .3); ctx.lineTo(x + r * .14, y + r * .27); ctx.stroke();
    // Boca entre la barba
    ctx.save(); ctx.strokeStyle = "#fffdf7"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x - r * .14, y + r * .58); ctx.lineTo(x + r * .14, y + r * .58); ctx.stroke();

  }
  if (quien === "hitler"){
    // Pelo con el flequillo cayendo sobre la frente
    ctx.beginPath();
    ctx.moveTo(x + r * .92, y - r * .35);
    ctx.quadraticCurveTo(x + r * .7, y - r * 1.05, x - r * .1, y - r * 1.02);

    ctx.quadraticCurveTo(x - r * .2, y - r * .35, x + r * .35, y - r * .55);

    ctx.beginPath(); ctx.arc(x - r * .3, y + r * .12, 1.9, 0, Math.PI * 2); ctx.fill();

}

// Libro dibujado a mano con el título en la tapa
function libro(cx, cy, e){
  const s = e.id * 19 + 2, w = 84, h = 96, lomo = 10;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.07);
  const x0 = -w / 2, y0 = -h / 2;
  // Páginas asomando por detrás (borde derecho e inferior)
  ctx.fillStyle = "#fffdf7";
  ctx.fillRect(x0 + 4, y0 + 4, w, h);
  raya(x0 + w, y0 + 5, x0 + w + 4, y0 + 5, s, 1.4);
  raya(x0 + w + 4, y0 + 5, x0 + w + 4, y0 + h + 4, s + 1, 1.6);
  raya(x0 + 5, y0 + h + 4, x0 + w + 4, y0 + h + 4, s + 2, 1.6);
  raya(x0 + w + 1.5, y0 + 8, x0 + w + 1.5, y0 + h + 1, s + 3, .9);
  // Tapa
  ctx.fillStyle = "#fffdf7"; ctx.fillRect(x0, y0, w, h);
  raya(x0, y0, x0 + w, y0, s + 4, 2.2);
  raya(x0 + w, y0, x0 + w, y0 + h, s + 5, 2.2);
  raya(x0 + w, y0 + h, x0, y0 + h, s + 6, 2.2);
  raya(x0, y0 + h, x0, y0, s + 7, 2.2);
  raya(x0 + lomo, y0 + 2, x0 + lomo, y0 + h - 2, s + 8, 1.6);   // lomo
  // Título a rotulador con fluorescente
  const cxT = x0 + lomo + (w - lomo) / 2;
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = AMARILLO;
  ctx.fillRect(x0 + lomo + 4, y0 + 18, w - lomo - 8, 42); ctx.restore();
  ctx.fillStyle = TINTA; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  // Escribe el texto encogiéndolo si no cabe en la tapa
  const cabeEn = w - lomo - 10;
  const tamQueCabe = (txt, tam, fuente) => {
    ctx.font = `${tam}px ${fuente}`;
    const m = ctx.measureText(txt).width;
    return m > cabeEn ? Math.floor(tam * cabeEn / m) : tam;
  };
  const escribir = (txt, tam, fuente, y) => {
    ctx.font = `${tamQueCabe(txt, tam, fuente)}px ${fuente}`;
    ctx.fillText(txt, cxT, y);
  };
  const [l1, l2 = ""] = e.portada || [e.t.toUpperCase()];
  if (l2 && l2.length <= 6){
    // Título partido en dos (FRANKEN- / STEIN): las dos líneas con la misma letra
    const tam = Math.min(tamQueCabe(l1, 17, MARCADOR), tamQueCabe(l2, 17, MARCADOR));
    escribir(l1, tam, MARCADOR, y0 + 29);
    escribir(l2, tam, MARCADOR, y0 + 49);
  } else {
    escribir(l1, 17, MARCADOR, y0 + 29);
    if (l2) escribir(l2, 14, MARCADOR, y0 + 49);   // subtítulo más pequeño (Y CASTIGO)
  }
  ctx.fillStyle = "#555";
  escribir(e.sub || "", 19, FUENTE, y0 + h - 18);
  ctx.restore();
  ctx.textAlign = "left"; ctx.textBaseline = "top";
}

// El Sol convertido en gigante roja, con la Tierra pequeñita al lado
function solRojo(cx, cy, semilla){
  const s = semilla * 23 + 9, R0 = 24;
  // Cuerpo: rotulador naranja y rojo
  ctx.save(); ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "rgba(255, 150, 40, .75)"; ctx.beginPath(); ctx.arc(cx, cy, R0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(230, 60, 40, .45)"; ctx.beginPath(); ctx.arc(cx - 3, cy + 3, R0 * .72, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  circuloMano(cx, cy, R0, s, 2.2);
  // Rayos ondulados
  ctx.strokeStyle = TINTA; ctx.lineWidth = 1.8; ctx.lineCap = "round";
  for (let k = 0; k < 10; k++){
    const ang = k / 10 * Math.PI * 2 + .2;
    if (Math.abs(ang - 0.15) < .35) continue;      // hueco donde está la Tierra
    const r1 = R0 + 5, r2 = R0 + 13;
    const px = ang + Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1);
    ctx.quadraticCurveTo(cx + Math.cos(ang) * (r1 + r2) / 2 + Math.cos(px) * 3, cy + Math.sin(ang) * (r1 + r2) / 2 + Math.sin(px) * 3,
                         cx + Math.cos(ang) * r2, cy + Math.sin(ang) * r2);
    ctx.stroke();
  }
  // Tierra pequeñita a punto de ser engullida
  const ex = cx + R0 + 9, ey = cy + 3;
  ctx.save(); ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "rgba(70, 130, 230, .7)"; ctx.beginPath(); ctx.arc(ex, ey, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  circuloMano(ex, ey, 5, s + 3, 1.5);
}

const COSMICOS = ["sol", "tierra", "bigbang", "estrellas", "galaxia", "solJoven", "asteroide", "calavera"];

// Calavera a mano (extinciones)
function calavera(cx, cy, semilla){
  const s = semilla * 53 + 1;
  ctx.fillStyle = "#fffdf7";
  ctx.beginPath(); ctx.arc(cx, cy - 3, 14, Math.PI * .85, Math.PI * .15); ctx.lineTo(cx + 8, cy + 14); ctx.lineTo(cx - 8, cy + 14); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = TINTA; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.stroke();
  ctx.fillStyle = TINTA;
  ctx.beginPath(); ctx.ellipse(cx - 5.5, cy - 2, 3.6, 4.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 5.5, cy - 2, 3.6, 4.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx, cy + 3); ctx.lineTo(cx - 2, cy + 7); ctx.lineTo(cx + 2, cy + 7); ctx.closePath(); ctx.fill();
  ctx.lineWidth = 1.3;
  for (const dx of [-4, 0, 4]){ ctx.beginPath(); ctx.moveTo(cx + dx, cy + 10); ctx.lineTo(cx + dx, cy + 14); ctx.stroke(); }
}

// Primeras estrellas: tres estrellas gigantes azuladas
function primerasEstrellas(cx, cy, semilla){
  const s = semilla * 37 + 2;
  const estrella = (x, y, R0, k) => {
    ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = "rgba(110, 160, 255, .6)";
    ctx.beginPath();
    for (let i = 0; i < 8; i++){
      const ang = i / 8 * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? R0 * .38 : R0;
      i ? ctx.lineTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr) : ctx.moveTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.strokeStyle = TINTA; ctx.lineWidth = 1.8; ctx.lineJoin = "round"; ctx.stroke();
  };
  estrella(cx - 9, cy + 4, 18, 0);
  estrella(cx + 14, cy - 12, 11, 1);
  estrella(cx + 15, cy + 15, 8, 2);
  ctx.fillStyle = TINTA;
  for (const [dx, dy] of [[-28, -16], [28, 2], [-24, 22], [2, -26]]){
    ctx.beginPath(); ctx.arc(cx + dx, cy + dy, 1.5, 0, Math.PI * 2); ctx.fill();
  }
}

// Vía Láctea: galaxia espiral a mano, con núcleo amarillo
function galaxia(cx, cy, semilla){
  const s = semilla * 41 + 6, r = aleatorio(s);
  ctx.save(); ctx.translate(cx, cy); ctx.scale(1, .62); ctx.rotate(-.35);
  // Halo suave
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = "rgba(150, 120, 220, .28)";
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  // Dos brazos espirales
  ctx.strokeStyle = TINTA; ctx.lineCap = "round";
  for (const giro of [0, Math.PI]){
    for (let pasada = 0; pasada < 2; pasada++){
      ctx.lineWidth = pasada ? 1.2 : 2.2;
      ctx.beginPath();
      for (let k = 0; k <= 40; k++){
        const th = k / 40 * Math.PI * 1.7, rr = 5 + th * 8.2 + (pasada ? 2 : 0);
        const px = Math.cos(th + giro) * rr, py = Math.sin(th + giro) * rr;
        k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.stroke();
    }
  }
  // Estrellitas en los brazos
  ctx.fillStyle = TINTA;
  for (let k = 0; k < 14; k++){
    const th = r() * Math.PI * 1.7, rr = 6 + th * 8.2 + (r() - .5) * 6, g = r() < .5 ? 0 : Math.PI;
    ctx.beginPath(); ctx.arc(Math.cos(th + g) * rr, Math.sin(th + g) * rr, 1.1, 0, Math.PI * 2); ctx.fill();
  }
  // Núcleo
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = "rgba(255, 200, 30, .9)";
  ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.restore();
}

// Asteroide en llamas cayendo en diagonal

  ctx.quadraticCurveTo(cx - 22, cy - 16, cx + 8, cy + 6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255, 212, 0, .8)";

  ctx.quadraticCurveTo(cx - 16, cy - 10, cx + 4, cy + 4); ctx.closePath(); ctx.fill();

// El Big Bang: un punto que estalla en rayos, chispas y fluorescente
function bigBang(cx, cy, semilla){
  const s = semilla * 31 + 1, r = aleatorio(s);
  // Resplandor de fluorescente en forma de estrella
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = "rgba(255, 212, 0, .85)";
  ctx.beginPath();
  for (let k = 0; k < 16; k++){
    const ang = k / 16 * Math.PI * 2, rr = k % 2 ? 9 : 22 + r() * 6;
    const px = cx + Math.cos(ang) * rr, py = cy + Math.sin(ang) * rr;
    k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255, 140, 40, .6)"; ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // Contorno de la estrella a mano
  ctx.strokeStyle = TINTA; ctx.lineWidth = 2; ctx.lineJoin = "round";
  ctx.beginPath();
  const rr2 = aleatorio(s);
  for (let k = 0; k < 16; k++){
    const ang = k / 16 * Math.PI * 2, rr = k % 2 ? 9 : 22 + rr2() * 6;
    const px = cx + Math.cos(ang) * rr, py = cy + Math.sin(ang) * rr;
    k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.stroke();
  // Rayos que salen disparados
  for (let k = 0; k < 8; k++){
    const ang = k / 8 * Math.PI * 2 + .2, r1 = 30, r2 = 38 + r() * 6;
    raya(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1, cx + Math.cos(ang) * r2, cy + Math.sin(ang) * r2, s + k, 1.6);
  }
  // Chispas (puntitos y crucecitas)
  ctx.fillStyle = TINTA;
  for (let k = 0; k < 6; k++){
    const ang = r() * Math.PI * 2, d = 26 + r() * 18;
    ctx.beginPath(); ctx.arc(cx + Math.cos(ang) * d, cy + Math.sin(ang) * d, 1.6, 0, Math.PI * 2); ctx.fill();
  }
}

// Gran Pirámide a mano: hiladas de bloques, arena amarilla y un sol detrás; (cx, base) = centro de la base
function piramide(cx, base, semilla){
  const s = semilla * 59 + 7, w = 60, h = 58;
  // Sol detrás, arriba a la derecha
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = "rgba(255, 170, 40, .75)";
  ctx.beginPath(); ctx.arc(cx + 34, base - h + 6, 11, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  circuloMano(cx + 34, base - h + 6, 11, s, 1.6);
  // Cara iluminada y cara en sombra
  ctx.save(); ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "rgba(240, 200, 110, .85)";
  ctx.beginPath(); ctx.moveTo(cx - w, base); ctx.lineTo(cx, base - h); ctx.lineTo(cx + 8, base); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(190, 140, 70, .85)";
  ctx.beginPath(); ctx.moveTo(cx + 8, base); ctx.lineTo(cx, base - h); ctx.lineTo(cx + w, base); ctx.closePath(); ctx.fill();
  ctx.restore();
  // Contorno a mano
  raya(cx - w, base, cx, base - h, s + 1, 2.2);
  raya(cx, base - h, cx + w, base, s + 2, 2.2);
  raya(cx, base - h, cx + 8, base, s + 3, 1.8);
  // Hiladas de bloques
  for (let k = 1; k < 6; k++){
    const y = base - h * k / 6, f = 1 - k / 6;
    ctx.save(); ctx.globalAlpha *= .55;
    raya(cx - w * f + 2, y, cx + 8 * f - 1, y, s + 10 + k, 1);
    raya(cx + 8 * f + 1, y, cx + w * f - 2, y, s + 20 + k, 1);
    ctx.restore();
  }
  // Arena en la base
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.strokeStyle = "rgba(255, 212, 0, .85)"; ctx.lineWidth = 6; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(cx - w - 8, base + 2); ctx.quadraticCurveTo(cx, base - 2, cx + w + 8, base + 2); ctx.stroke(); ctx.restore();
  raya(cx - w - 10, base + 1, cx + w + 10, base + 1, s + 30, 1.6);
}

// --- Periodos ---
let zonasPer = [];
// Periodos sobre la línea. Si dos se solapan en el tiempo, uno va en la línea (carril 0)
// y el otro justo encima, pegado (carril 1, 2…).
// "desvanece": año en el que acaba de desvanecerse la franja (empieza a hacerlo en "f").
const SEP_CARRIL = 34, Y_PER_ABAJO = 90;   // Y_PER_ABAJO: distancia de la línea a la primera franja de debajo
function asignarCarriles(){
  const per = EVENTOS.filter(e => e.desde);
  const fin = e => e.añoDesvanece ?? e.añoHasta;
  const puestos = [];
  // Primero los que tienen carril fijo (Homo sapiens va siempre en la línea)
  per.filter(e => e.carril !== undefined).forEach(e => puestos.push(e));
  per.filter(e => e.carril === undefined).sort((a, b) => a.añoDesde - b.añoDesde).forEach(e => {
    let k = 0;
    while (puestos.some(o => o.carril === k && o.añoDesde < fin(e) && e.añoDesde < fin(o))) k++;
    e.carril = k; puestos.push(e);
  });
}
var asignarCarrilesPendiente;
function dibujarPeriodos(yL){
  if (asignarCarrilesPendiente){ asignarCarriles(); asignarCarrilesPendiente = false; }
  zonasPer = [];
  // 1) Geometría de cada franja visible
  const franjas = [];
  for (const e of EVENTOS){
    if (!e.desde) continue;
    const carril = e.carril || 0;
    // Los periodos históricos (imperios, épocas de Egipto…) van debajo de la línea, bajo las fechas,
    // y se apilan hacia abajo; la prehistoria y las especies siguen en la línea
    const abajo = e.añoDesde > -10000;
    const yB = abajo ? yL + Y_PER_ABAJO + carril * SEP_CARRIL : yL - carril * SEP_CARRIL;
    const alto = carril ? 15 : 17;                // las de encima, algo más finas
    let x1 = xDe(e.añoDesde), x2 = xDe(e.añoHasta);
    const xFin = e.añoDesvanece !== undefined ? xDe(e.añoDesvanece) : x2;
    const anchoReal = xFin - x1;
    if (xFin < -50 || x1 > W + 50) continue;
    // Es lo último en desaparecer: aguanta hasta que en realidad mide menos de 1/4 de píxel
    const a = umbralHistoria(e) ? visiblePorPeso(e, W / ppa)
            : Math.min(1, Math.max(0, Math.log(anchoReal / 0.25) / Math.log(12)));
    if (!a) continue;
    // Nunca más estrecho de 10 px: así se sigue viendo al alejarse
    if (x2 - x1 < 10){ const m = (x1 + x2) / 2; x1 = m - 5; x2 = m + 5; }
    franjas.push({ e, x1, x2, xFin: Math.max(xFin, x2), yB, alto, a, carril, abajo });
  }
  // 2) Franjas: dos pasadas de rotulador que se pisan; degradado si se desvanece
  for (const f of franjas){
    const { e, x1, x2, xFin, yB, a, carril } = f;
    const r = aleatorio(e.id * 7 + 3);
    ctx.save(); ctx.globalAlpha = a;
    let pintura = e.color;
    const transp = e.color.replace(/[\d.]+\)$/, "0)");
    if (e.añoSolido !== undefined){              // inicio difuso: de transparente a sólido
      const xS = xDe(e.añoSolido), g = ctx.createLinearGradient(x1, 0, xFin, 0);
      const c = Math.max(0, Math.min(1, (xS - x1) / (xFin - x1)));
      g.addColorStop(0, transp); g.addColorStop(c, e.color); g.addColorStop(1, e.color);
      pintura = g;
    }
    else if (xFin > x2 + 1){
      const g = ctx.createLinearGradient(x1, 0, xFin, 0);
      const corte = Math.max(0, Math.min(1, (x2 - x1) / (xFin - x1)));
      g.addColorStop(0, e.color); g.addColorStop(corte, e.color);
      g.addColorStop(1, e.color.replace(/[\d.]+\)$/, "0)"));
      pintura = g;
    }
    ctx.globalCompositeOperation = "multiply"; ctx.strokeStyle = pintura; ctx.lineCap = "butt";
    const pasadas = carril ? [[-5.5, 13], [5.5, 13]] : [[-6, 15], [6, 15]];
    for (const [dy, gr] of pasadas){
      ctx.lineWidth = gr + r() * 3;
      ctx.beginPath(); ctx.moveTo(x1, yB + dy + (r() - .5) * 3);
      ctx.quadraticCurveTo((x1 + xFin) / 2, yB + dy + (r() - .5) * 4, xFin, yB + dy + (r() - .5) * 3);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
    // Dibujo sobre la franja (dinosaurio), si hay sitio de sobra
    if (e.dibujo === "dino" && W / ppa < 6e8 && x2 - x1 > 90){
      const xd = Math.min(Math.max(x1 + (x2 - x1) * .78, 60), W - 60);
      if (xd > x1 + 40 && xd < x2 - 40) dino(xd, yB - f.alto - 1, e.id);
    }
    if (x2 - x1 > 30){
      if (e.añoSolido === undefined) raya(x1, yB - f.alto, x1, yB + f.alto, e.id + .3, 2);
      if (xFin <= x2 + 1) raya(x2, yB - f.alto, x2, yB + f.alto, e.id + .6, 2);
    }
    ctx.restore();
  }
  // 3) Nombres encima de cada franja, sin pisar otras franjas ni otros nombres
  const ocupadas = [];
  ctx.font = `17px ${MARCADOR}`;
  const xh = xDe(AÑO_HOY), wh = ctx.measureText(`HOY ${AÑO_HOY}`).width / 2 + 10;
  for (const f of franjas){
    const { e, x1, x2, xFin, yB, alto, a } = f;
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = `15px ${MARCADOR}`; ctx.fillStyle = TINTA; ctx.textBaseline = "bottom"; ctx.textAlign = "center";
    const txt = (e.rotulo || e.t).toUpperCase(), wt = ctx.measureText(txt).width;   // rótulo corto si lo hay
    const xMax = xFin > x2 + 1 ? x2 + (xFin - x2) * .3 : x2;          // no poner el nombre en la parte desvanecida
    const xt = Math.min(Math.max((x1 + xMax) / 2, Math.max(x1, 8) + wt / 2), Math.min(xMax, W - 8) - wt / 2);
    const xTexto = xMax - x1 > wt ? xt : (x1 + xMax) / 2;
    const tx1 = xTexto - wt / 2, tx2 = xTexto + wt / 2;
    // Si el nombre cabe dentro de su franja, va dentro (así nunca se separa de ella)
    ctx.font = `17px ${MARCADOR}`;
    const wIn = ctx.measureText(txt).width;
    const v1 = Math.max(x1, 0), v2 = Math.min(xMax, W);

      ctx.strokeText(txt, xc, yB + 1); ctx.fillText(txt, xc, yB + 1);

    if (f.abajo){

      ocupadas.push({ x1: tx1, x2: tx2, y: yT });

    for (let intentos = 0; intentos < 8; intentos++, subidas++){

      if (ocupadas.some(o => o.y === yTexto && tx1 < o.x2 + 10 && tx2 > o.x1 - 10)){ yTexto -= 18; continue; }
      subidas--; break;
    }

    // Si tiene otra franja justo encima, el nombre se separaría de la suya: mejor no ponerlo

    ocupadas.push({ x1: tx1, x2: tx2, y: yTexto });
    ctx.globalAlpha *= 1 - geoA;                  // mientras se ve la escala geológica, sin nombres encima
    ctx.fillText(txt, xTexto, yTexto);
    ctx.textBaseline = "top";
    ctx.restore();
    zonasPer.push({ x0: Math.min(x1, tx1), y0: yTexto - 20, x1: Math.max(xFin, tx2), y1: yB + alto, e });
  }
}

let visib = () => 1;

// Peso de un elemento de la historia humana: lo antiguo y lo largo se ve desde más lejos.
// peso = el mayor entre su duración y una quinta parte de su antigüedad (en años).
// Umbral = años en pantalla por debajo de los cuales aparece (Luna ≈ 6.000, pirámide ≈ 60.000).
function umbralHistoria(e){
  if (e._umbral !== undefined) return e._umbral;
  const inicio = e.añoDesde ?? e.añoNace ?? e.año;
  if (inicio <= -50000 || inicio > AÑO_HOY){ e._umbral = 0; return 0; }   // prehistoria y futuro: van por su cuenta
  const dur = e.añoDesde !== undefined ? e.añoHasta - e.añoDesde
            : e.añoNace !== undefined ? e.añoMuere - e.añoNace : 0;
  // La importancia también cuenta: los de detalle (nivel 3) pesan menos y salen más tarde
  const factorNivel = { 1: 1.5, 2: 1, 3: .3 }[e.nivel || 2];
  const peso = Math.max(dur, (AÑO_HOY - inicio) / 5, 1) * factorNivel;
  return e._umbral = 6000 * Math.pow(peso / 11, .52);
}
// Eventos (no periodos): el zoom al que aparecen depende solo de su nivel, no de su antigüedad,
// para que con un mismo zoom la regla sea igual en toda la línea. Lo demás lo decide el sitio.
function umbralEvento(e){
  if (!umbralHistoria(e)) return 0;

function prioridadEvento(e){

function visiblePorPeso(e, span, T = umbralHistoria(e)){

}
function dibujarEventos(yL){

  // 1) Colocar: decidir qué tarjetas caben en cada fila.

          [ini, Math.max(x2, der(e.etiquetaFechas || e.etiqueta))],        // 2: + raya y fechas
          [ini, Math.max(x2, der(e.etiqueta))]                             // 3: + edad

        }
        else if (e.icono === "coronas"){                    // doble corona con el año al lado

        }
        else if (e.icono === "libro" || e.icono === "cohete"){   // dibujo con el año al lado

      // …ni su nombre bajo la cara de alguien del carril de arriba

      if (c.e.cara) return null;

      for (const d of huecos) for (let k = 0; k < max; k++) if (libre(k, c.cx + d, c.cx + d + c.w, tmp)) return { k, d };
